<title>Moje cesta</title>
<!--
  MOJE CESTA — KOMPLETNÍ PROTOTYP
  Všech 11 JSON sekcí naživo. Hřiště k proklikání celé appky.

  Data se tahají relativně (MC_BASE="./data/"), takže soubor funguje lokálně
  (python -m http.server v kořeni) i na GitHub Pages.
  Obal + registr sekcí je převzatý z cesta_prototyp.html; sloty jsou tu
  nahrazené živými renderery.

  Meta tagy nahoře jsou pro samostatné spuštění na mobilu (PWA přes
  „Přidat na plochu" + vypnutá cache, ať se refresh po pushi projeví hned).
  Uvnitř Miowebu je WordPress ignoruje, nevadí tam.
-->

<div id="mc-root" lang="cs"><div class="mc-loading">Načítám…</div></div>

<style>
  :where(#mc-root *, #mc-root *::before, #mc-root *::after) { margin:0; box-sizing:border-box; }
  /* Mobil: žádný modrý záblesk při ťuknutí, žádný výběr textu na dlouhý dotyk
     u klikacích prvků. Hover jen tam, kde je myš — na dotyku by po ťuknutí
     visel (viz @media (hover:hover) u všech :hover). */
  #mc-root{ -webkit-tap-highlight-color:transparent; }
  :where(#mc-root button, #mc-root .mc-card.clickable, #mc-root .mc-tile, #mc-root .mc-name-item, #mc-root .mc-feeling, #mc-root .mc-swipe-card){ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  /* Pozor na specificitu: `#mc-root ul` (0,1,1) přebíjí třídy (0,1,0), takže
     každé .mc-list/.mc-cards/.mc-md ul tiše přišlo o vlastní padding a leželo
     na okraji obrazovky. Reset proto přes :where() — nulová specificita. */
  :where(#mc-root ul) { padding:0; list-style:none; }

  /* ===== PALETA =====
     Dvě sady, přepínač píše data-theme na #mc-root (ne na <html> — uvnitř
     Miowebu nad ním nemáme kontrolu). Dark je zapsaný jako výchozí přímo na
     #mc-root, aby appka měla barvy i kdyby JS nedoběhl.

     Mapování starých názvů na nový design systém:
       --bg → bg | --surface → card | --surface-2 → card-alt | --text → text
       --body → text (oba jsou čtený text, nová paleta je sjednocuje)
       --soft → text-secondary | --accent-dim → accent-soft
     Nové: --muted (nejtlumenější), --teal + --teal-soft (tag pilulky),
     --on-accent (text NA accent ploše — v dark tmavý, v light světlý; dřív
     bylo natvrdo #15120E, což by na světlé terakotě nebylo vidět). */
  #mc-root {
    --bg:#1C1914; --surface:#262119; --surface-2:#2E281E; --border:#3A3226; --pack:#14110D;
    --text:#F2EBDC; --body:#F2EBDC; --soft:#B5AA96; --muted:#7C7264;
    --accent:#E08252; --accent-dim:#3D2A1F; --on-accent:#1C1914; --heart:#E08252;
    --teal:#6FBBA6; --teal-soft:#223832; --teal-deep:#16332F;
    /* Skupiny štítků ve filtru (25. 11. 2026): podklad / písmo / vybraný */
    --g-st-bg:#232D3A; --g-st-tx:#A9BEDA; --g-st-on:#8FAAD0;
    --g-em-bg:#35242C; --g-em-tx:#DDA6BD; --g-em-on:#D08EAB;
    --g-co-bg:#223832; --g-co-tx:#8CC9B6; --g-co-on:#6FBBA6;
    --g-vz-bg:#352C1C; --g-vz-tx:#DDBE80; --g-vz-on:#D2AC5E;
    --g-ch-bg:#25301F; --g-ch-tx:#AFCB9F; --g-ch-on:#97B886;
    --empty:#3A3226; --done:#6FBBA6; --missed:#E08252;

    /* Tón sekce: akční sekce (První pomoc, Tělo, Přerámování, Cvičení) jedou
       červeně, čtecí (Otázky, Inspirace, Články, O appce) zeleně. Nadpisy,
       odrážky a ikonky se řídí --tone; data-tone se přepíná na #mc-root podle
       otevřené sekce. Výchozí = accent. */
    --tone:var(--accent); --tone-soft:var(--accent-dim);

    /* Jednotná osa zarovnání — dřív si každý blok odsazoval po svém
       (18/16/14px), takže nic nesedělo na jednu linku. */
    --gutter:20px;
    /* Vnitřní boční padding dlaždice — z něj se počítá i odsazení bloku nad dlaždicemi,
       aby text začínal na stejné lince jako texty v dlaždicích. */
    --tile-pad:15px;

    --serif:'Fraunces',Georgia,'Times New Roman',ui-serif,serif;
    --sans:'Public Sans',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;

    font-family:var(--sans); background:var(--bg); color:var(--body);
    max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; padding-bottom:60px;
    box-sizing:border-box;   /* 25. 11. 2026: dřív 100vh + 60 px navrch → krátká stránka šla rolovat do prázdna */
    line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased; position:relative;
  }

  /* --surface je čistě bílá, ne krémová jako v handoffu — karty a dlaždice
     potřebovaly víc kontrastu proti pozadí stránky. */
  #mc-root[data-theme="light"] {
    --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#FBF5EA; --border:#E8DFCE; --pack:#EBE3D3;
    --text:#2B241C; --body:#2B241C; --soft:#6B6053; --muted:#9C9385;
    --accent:#B8562E; --accent-dim:#F0DCCD; --on-accent:#FFFDF8; --heart:#D98763;
    --teal:#3E7266; --teal-soft:#DCEAE5; --teal-deep:#1F4F49;
    --g-st-bg:#E7EDF5; --g-st-tx:#3F5B80; --g-st-on:#5877A0;
    --g-em-bg:#F5E6EC; --g-em-tx:#8B4766; --g-em-on:#A85F80;
    --g-co-bg:#DCEAE5; --g-co-tx:#2F6457; --g-co-on:#3E7266;
    --g-vz-bg:#F5EBD6; --g-vz-tx:#7E5C1E; --g-vz-on:#A57D35;
    --g-ch-bg:#E6EEE0; --g-ch-tx:#4B6840; --g-ch-on:#66855A;
    --empty:#E8DFCE; --done:#3E7266; --missed:#B8562E;
  }

  /* Čtecí sekce přebarví tón na zelenou. */
  #mc-root[data-tone="teal"]{ --tone:var(--teal); --tone-soft:var(--teal-soft); }

  /* Samostatné spuštění (Pages / PWA): #mc-root visí přímo pod body a kolem
     appky prosvítá bílá stránka. Uvnitř Miowebu je #mc-root zanořený ve WP
     divech, selektor se nechytí a pozadí stránky zůstane na WordPressu.
     Barvy jsou tu natvrdo — body je nad #mc-root, na jeho proměnné nedosáhne. */
  html:has(> body > #mc-root), body:has(> #mc-root) { margin:0; background:#1C1914; }
  html:has(> body > #mc-root[data-theme="light"]),
  body:has(> #mc-root[data-theme="light"]) { background:#F6F1E7; }

  /* ===== TYPOGRAFIE =====
     Fraunces je variabilní font s osou opsz (optical size) — sám mění kresbu
     podle velikosti. Bez explicitního nastavení jede na výchozích 14pt a
     nadpisy vypadají placatě; proto se opsz řídí ručně.

     Dělba podle handoffu: Fraunces = nadpisy a čísla, Public Sans = UI
     i běžný text. Coconut téma mělo serif i na inputech a textu karet, což
     mockup nedělá. Váhy: nadpisy 600 (dřív 400 kvůli Georgii — ve Fraunces
     je 400 hubená). */
  #mc-root :is(h1,h2,h3,h4){ font-family:var(--serif); font-weight:600; letter-spacing:-0.01em; }
  #mc-root h1{ font-size:30px; line-height:1.15; font-variation-settings:'opsz' 72; }
  #mc-root h2{ font-size:20px; line-height:1.25; font-variation-settings:'opsz' 36; }
  #mc-root h3,#mc-root h4{ font-size:17px; line-height:1.3; font-variation-settings:'opsz' 24; }

  /* Eyebrow — accentový škatulkový nadpis nad sekcí (v mockupu „POSTUP") */
  .mc-eyebrow{ font-family:var(--sans); font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--accent); margin-bottom:14px; }

  /* ===== TAG PILULKY =====
     Dřív se tagy sázely jako holý text přes čárku (a v seznamu vůbec).
     Základní pilulka je teal; varianta .time je accentová (čas, trvání). */
  .mc-tag-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .mc-tag{ font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:0.02em;
    padding:5px 12px; border-radius:20px; background:var(--teal-soft); color:var(--teal); line-height:1.3; }
  .mc-tag.time{ background:var(--accent-dim); color:var(--accent);
    display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-weight:700; }
  .mc-tag.time svg{ width:12px; height:12px; }
  .mc-tag.more{ background:transparent; color:var(--muted); padding:5px 4px; }
  .mc-tag-row.fit{ flex-wrap:nowrap; overflow:hidden; }
  .mc-tag-row.fit .mc-tag{ flex-shrink:0; white-space:nowrap; }
  .mc-tag-row.fit .mc-tag[hidden]{ display:none; }

  .mc-loading,.mc-error{ padding:56px 24px; text-align:center; color:var(--soft); font-size:14px; line-height:1.7; }
  .mc-error strong{ color:var(--text); font-family:var(--serif); font-weight:600; }
  .mc-error code{ color:var(--accent); font-family:var(--mono); font-size:12px; }

  /* ===== TOPBAR ===== */
  .mc-topbar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:14px calc(var(--gutter) - 8px); background:var(--bg); border-bottom:1px solid var(--border); }
  .mc-icon-btn{ flex-shrink:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--soft); cursor:pointer; padding:0; border-radius:9px;
    transition:color .15s ease,background .15s ease; position:relative; }
  @media (hover:hover){ .mc-icon-btn:hover{ color:var(--text); background:var(--surface); } }
  .mc-icon-btn svg{ width:22px; height:22px; display:block; }
  .mc-topbar-title{ flex:1; text-align:center; font-family:var(--serif); font-weight:600; font-size:19px;
    font-variation-settings:'opsz' 36; color:var(--text); letter-spacing:-0.01em; cursor:pointer; line-height:1.1; }
  .mc-topbar-title .mc-mark{ color:var(--accent); font-style:italic; }
  .mc-heart-top,.mc-heart-top.on{ color:var(--heart); }   /* obrys taky barvou srdíčka, jako v kartách (25. 11. 2026) */
  .mc-heart-top .hf{ display:none; }
  .mc-heart-top.on .he{ display:none; }
  .mc-heart-top.on .hf{ display:block; }
  .mc-topbadge{ position:absolute; top:4px; right:4px; min-width:16px; height:16px; padding:0 4px;
    background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px; font-weight:700;
    border-radius:8px; display:flex; align-items:center; justify-content:center; line-height:1; }

  /* ===== MENU ===== */
  .mc-menu-backdrop{ position:fixed; inset:0; z-index:40; background:#0009; animation:mcFade .18s ease forwards; }
  .mc-menu{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:340px; z-index:41;
    background:var(--surface); border-right:1px solid var(--border); padding:14px 0 24px; overflow-y:auto;
    animation:mcSlide .2s cubic-bezier(.2,.7,.3,1) forwards; }
  .mc-menu-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 16px 14px;
    margin-bottom:6px; border-bottom:1px solid var(--border); }
  .mc-menu-head h2{ font-size:19px; color:var(--text); font-variation-settings:'opsz' 36; cursor:pointer; }
  .mc-menu-head h2 .mc-mark{ color:var(--accent); font-style:italic; }
  .mc-menu-item{ display:flex; align-items:center; gap:13px; width:100%; padding:13px 16px; background:none;
    border:none; cursor:pointer; text-align:left; color:var(--body); font-family:var(--sans); font-size:15px;
    transition:background .12s ease; }
  @media (hover:hover){ .mc-menu-item:hover{ background:var(--surface-2); } }
  .mc-menu-item.active{ color:var(--accent); }
  .mc-menu-item .mi-ic{ flex-shrink:0; width:22px; height:22px; color:var(--soft); }
  .mc-menu-item.active .mi-ic{ color:var(--accent); }
  .mc-menu-item .mi-ic svg{ width:22px; height:22px; display:block; }
  .mc-menu-item .mi-label{ flex:1; }
  .mc-menu-item .mi-badge{ background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px;
    font-weight:700; padding:1px 7px; border-radius:7px; }
  .mc-menu-sep{ height:1px; background:var(--border); margin:6px 16px; }

  /* ===== HOME ===== */
  /* Úvodka: sloupec na výšku okna, dlaždice si vezmou zbytek. dvh kvůli
     adresnímu řádku na mobilu — 100vh tam počítá s plochou, která reálně
     není vidět. */
  /* height, ne min-height: s min-height se kontejner nafoukne podle obsahu a
     flexu pak nezbyde co rozdělovat — mřížka si vezme svoje min-content
     a přeteče. */
  #mc-root[data-page="home"]{ display:flex; flex-direction:column;
    height:100vh; height:100dvh; min-height:0; padding-bottom:0; }
  /* minmax(0,1fr) + min-height:0 — bez nich se řádky ani flex položka nesmrsknou
     pod velikost obsahu a na nízkém displeji mřížka přeteče. */
  #mc-root[data-page="home"] .mc-tiles{ flex:1; min-height:0;
    grid-template-rows:repeat(4,minmax(0,1fr)); padding-bottom:var(--gutter); }
  .mc-tiles{ padding-top:0; }
  #mc-root[data-page="home"] .mc-tile{ min-height:72px; overflow:hidden; }
  /* Na nízkém displeji ubereme dlaždici na výšce, ať se všechny čtyři řady
     vejdou bez scrollování. */
  @media (max-height:700px){
    #mc-root[data-page="home"]{ --tile-pad:13px; }
    #mc-root[data-page="home"] .mc-tile{ gap:6px; padding:12px var(--tile-pad); }
    #mc-root[data-page="home"] .mc-tile-ic{ width:32px; height:32px; border-radius:9px; }
    #mc-root[data-page="home"] .mc-tile-ic svg{ width:17px; height:17px; }
    #mc-root[data-page="home"] .mc-home-intro{ padding-top:16px; padding-bottom:10px; }
  }

  /* Text nad dlaždicemi začíná na lince textů v dlaždicích (gutter + rámeček + padding), zprava stejně. */
  .mc-home-intro{ padding:24px calc(var(--gutter) + 1px + var(--tile-pad)) 14px; }
  /* „Dnešní inspirace“ je štítek, ne nadpis appky — hlavní slovo má citát. */
  .mc-home-intro .mc-eyebrow{ color:var(--tone); margin-bottom:0; }
  .mc-home-intro p{ color:var(--soft); font-size:15px; line-height:1.55; margin-top:8px; }
  /* Citát dne — velikost jako názvy dlaždic, ale tenký řez. */
  .mc-home-intro p.mc-daily{ font-family:var(--serif); font-weight:400; font-size:17px; line-height:1.5;
    font-variation-settings:'opsz' 24; color:var(--body); margin-top:8px; }
  .mc-home-intro .mc-card-author{ margin-top:6px; }
  .mc-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 var(--gutter); }
  .mc-tile{ display:flex; flex-direction:column; gap:9px; min-height:118px; padding:16px var(--tile-pad);
    background:var(--surface); border:1px solid var(--border); border-radius:16px; cursor:pointer; text-align:left;
    transition:border-color .15s ease,transform .1s ease,background .15s ease; position:relative; }
  @media (hover:hover){ .mc-tile:hover{ border-color:var(--accent); background:var(--surface-2); } }
  .mc-tile:active{ transform:scale(.985); }
  /* Ikonka v barevném čtverečku podle tónu sekce — akční červeně, čtecí
     zeleně. Dřív se střídalo mechanicky ob jednu, bez významu. */
  .mc-tile-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim); color:var(--accent); }
  .mc-tile[data-tone="teal"] .mc-tile-ic{ background:var(--teal-soft); color:var(--teal); }
  .mc-tile-ic svg{ width:20px; height:20px; display:block; }
  .mc-tile-name{ margin-top:auto; font-family:var(--serif); font-weight:600; font-size:17px;
    font-variation-settings:'opsz' 24; color:var(--text); line-height:1.2; letter-spacing:-0.01em; }
  /* Moje oblíbené (24. 11. 2026): pakl karet na podbarvení o kus tmavším než pozadí stránky,
     přesahuje dlaždice ze všech stran; počty velkým Fraunces vpravo nahoře. Materiály pod
     paklem nízké, v jednom řádku. Prázdná dlaždice zašedlá s nulou. */
  .mc-fav-pack{ margin:8px calc(var(--gutter) - 10px) 16px; padding:10px; background:var(--pack); border-radius:24px; }
  .mc-fav-pack .mc-tiles{ padding:0; }
  .mc-tile-num{ position:absolute; top:12px; right:15px; font-family:var(--serif); font-weight:600; font-size:34px; line-height:1;
    font-variation-settings:'opsz' 72; letter-spacing:-0.02em; color:var(--accent); }
  .mc-tile[data-tone="teal"] .mc-tile-num{ color:var(--teal); }
  .mc-tile.empty{ opacity:.45; cursor:default; }
  .mc-tile.empty:active{ transform:none; }
  /* Rozložení na výšku displeje (24. 11. 2026): jedna mezera --fg všude — nadpis → text → podbarvení
     paklu → materiály → spodek obrazovky. Pakl a materiály si dělí zbytek výšky 5 : 4 (dlaždice paklu
     vyšší, materiály nižší, v řadě stejně vysoké). Selektory s #mc-root, ať je nepřebije .mc-sec-head
     (dřív kvůli tomu text ležel na paklu). Minima jsou nízká, aby se to vešlo i s lištou prohlížeče. */
  /* box-sizing: root ho jinak nemá (reset jen potomkům) a spodní mezera by ležela pod okrajem obrazovky. */
  #mc-root[data-page="favhome"]{ --fg:18px; box-sizing:border-box; display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; padding-bottom:var(--fg); }
  #mc-root[data-page="favhome"] .mc-fav-intro{ padding:var(--fg) var(--gutter); }
  #mc-root[data-page="favhome"] .mc-fav-intro p{ margin-top:var(--fg); }
  #mc-root[data-page="favhome"] .mc-fav-pack{ margin-top:0; margin-bottom:var(--fg); flex:5 1 0; display:flex; flex-direction:column; }
  #mc-root[data-page="favhome"] .mc-fav-pack .mc-tiles{ flex:1; grid-template-rows:repeat(2,minmax(84px,1fr)); }
  #mc-root[data-page="favhome"] .mc-fav-pack .mc-tile{ min-height:0; overflow:hidden; }
  #mc-root[data-page="favhome"] .mc-fav-mat{ flex:4 1 0; grid-template-rows:repeat(2,minmax(76px,1fr)); }
  #mc-root[data-page="favhome"] .mc-fav-mat .mc-tile{ overflow:hidden; }
  /* Nízký displej: menší ikona a padding v paklu (jako na homepage), ať se dlaždice vejde do 84 px. */
  @media (max-height:760px){
    #mc-root[data-page="favhome"] .mc-fav-pack .mc-tile{ gap:6px; padding:12px var(--tile-pad); }
    #mc-root[data-page="favhome"] .mc-fav-pack .mc-tile-ic{ width:32px; height:32px; border-radius:9px; }
    #mc-root[data-page="favhome"] .mc-fav-pack .mc-tile-ic svg{ width:17px; height:17px; }
    #mc-root[data-page="favhome"] .mc-fav-mat .mc-tile{ padding:10px var(--tile-pad); gap:4px; }
  }
  .mc-fav-mat{ grid-template-rows:repeat(2,84px); }
  .mc-fav-mat .mc-tile{ min-height:0; gap:6px; padding:12px var(--tile-pad); }
  .mc-fav-mat .mc-tile-ic{ width:32px; height:32px; border-radius:9px; }
  .mc-fav-mat .mc-tile-ic svg{ width:17px; height:17px; }
  .mc-fav-mat .mc-tile-num{ font-size:26px; top:11px; right:14px; }
  .mc-fav-mat .mc-tile-name{ font-size:16px; }
  .mc-sec-row .mc-vt{ margin-left:auto; }
  .mc-ftabs .mc-vt{ flex-shrink:0; }
  .mc-tile-badge{ position:absolute; top:12px; right:12px; min-width:18px; height:18px; padding:0 5px;
    background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px; font-weight:700;
    border-radius:9px; display:flex; align-items:center; justify-content:center; }

  /* ===== SECTION HEADER ===== */
  .mc-sec-head{ padding:18px var(--gutter) 2px; }
  .mc-sec-head h1{ color:var(--tone); }
  .mc-sec-head p{ color:var(--soft); font-size:15px; line-height:1.55; margin-top:18px; }
  /* Rytmus jako Moje oblíbené (25. 11. 2026): horní lišta → 18 → nadpis → 18 → text → 18 → obsah. */
  .mc-sec-head:has(> p){ padding-bottom:0; }
  .mc-sec-head:has(> p) + :is(.mc-cards,.mc-list,.mc-namelist){ padding-top:18px; }
  .mc-sec-head:has(> p) + .mc-search-wrap{ margin-top:18px; }
  /* Řádek H1 + přepínač „jen oblíbené". Srdíčko menší a obrysové, ať se
     nečte jako „uložit sekci"; plné jen když je přepnuté. */
  /* flex-wrap: na úzkém displeji (≈320 px) tlačítka spadnou pod nadpis, vpravo zarovnaná. */
  .mc-sec-row{ display:flex; align-items:center; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; }

  /* ===== SEARCH ===== */
  /* Obalovač má nesymetrické odsazení (20px nahoře, 2px dole), takže top:50%
     u ikon centrovalo vůči němu, ne vůči vstupu — lupa i křížek seděly o 9px
     výš. Odsazení proto řeší margin a wrap sám těsně obepíná input. */
  .mc-search-wrap{ margin:20px var(--gutter) 2px; position:relative; display:flex; }
  .mc-search{ width:100%; padding:10px 68px 10px 40px;   /* jako dřív klíčové slovo ve filtru, všude stejně (25. 11. 2026) */ font-family:var(--sans); font-size:15px; color:var(--text);
    background:var(--field); border:1px solid var(--border); border-radius:10px; outline:none; transition:border-color .15s ease; }
  /* Pole hledání drobounce světlejší než pozadí appky (25. 11. 2026) — ne bílé, jen prosvětlené. */
  #mc-root{ --field:color-mix(in srgb, var(--bg) 55%, var(--surface)); }
  .mc-search::placeholder{ color:var(--muted); }
  .mc-search:focus{ border-color:var(--accent); }
  /* Lupa a reset výběru: stejná velikost i barva jako placeholder (20. 11. 2026) */
  .mc-search-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); display:block; width:19px; height:19px;
    color:var(--muted); pointer-events:none; }
  /* Nástroje vpravo v hledání — počítadlo vybraných + křížek na vymazání.
     Dřív viselo počítadlo na right:30px, tedy mimo osu ostatního obsahu. */
  .mc-search-tools{ position:absolute; right:8px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:6px; }
  .mc-search-clear{ display:flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0;
    background:none; border:none; cursor:pointer; color:var(--muted); border-radius:50%; transition:color .12s ease; }
  @media (hover:hover){ .mc-search-clear:hover{ color:var(--text); } }
  .mc-search-clear svg{ width:13px; height:13px; }

  /* ===== SUBMENU (Nejnovější / Redakce / filtr) ===== */
  .mc-submenu{ display:flex; gap:5px; padding:14px var(--gutter) 4px; flex-wrap:wrap; align-items:center; }
  .mc-submenu button{ background:var(--surface); border:1px solid var(--border); color:var(--soft);
    font-family:var(--sans); font-size:13px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer;
    transition:all .15s ease; }
  @media (hover:hover){ .mc-submenu button:hover{ color:var(--text); } }
  .mc-submenu button.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .mc-submenu .mc-filter-btn{ display:inline-flex; align-items:center; gap:6px; }
  /* Nástroje (oko, karty) k pravému okraji řádku submenu */
  .mc-tools-in{ margin-left:auto; display:inline-flex; gap:5px; }
  /* Přepínač karty / seznam (viewToggle) — všude stejný bílý čtvereček jako Nejnovější / Filtr. */
  #mc-root .mc-vt{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--surface);
    border:1px solid var(--border); color:var(--soft); padding:7px 10px; border-radius:8px; cursor:pointer; transition:all .15s ease; }
  #mc-root .mc-vt svg{ width:16px; height:16px; display:block; }
  @media (hover:hover){ #mc-root .mc-vt:hover{ color:var(--text); } }
  /* Otázky / Inspirace: Filtr a přepínač v řádku s nadpisem, přicvaknuté k pravé hraně. */
  .mc-sec-row .mc-head-tools{ padding:0; flex-wrap:nowrap; margin-left:auto; }
  /* Karty Otázek a Inspirace bez scrollu stránky — stejně jako zápisník přerámování. */
  .mc-qfold .mc-swipe-wrap{ padding-top:0; }
  .mc-qfold .mc-swipe{ height:calc(100vh - 200px); height:calc(100svh - 200px); min-height:360px; }
  .mc-submenu .mc-filter-btn svg{ width:15px; height:15px; }
  .mc-submenu .mc-filter-btn .fc{ background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px;
    font-weight:700; padding:0 6px; border-radius:6px; }

  /* ===== FILTER PANEL ===== */
  /* Panel filtru přes celou obrazovku (od 24. 11. 2026): hlavička, rolovací tělo, přilepená lišta dole. */
  .mc-fsheet{ position:fixed; top:0; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; z-index:45; background:var(--bg);
    display:flex; flex-direction:column; animation:mcFade .15s ease forwards; }
  .mc-fsheet .fs-head{ display:flex; align-items:center; justify-content:space-between; padding:14px calc(var(--gutter) - 8px) 6px var(--gutter);
    border-bottom:1px solid var(--border); }
  .mc-fsheet .fs-head h2{ margin:0; color:var(--tone); }
  .mc-fsheet .fs-body{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:16px var(--gutter) 24px; }
  .mc-fsheet .fs-foot{ display:flex; gap:10px; padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--bg); }
  .mc-fsheet .fs-foot .mc-fab{ flex:1; min-width:0; }
  .mc-fsheet .fs-foot .mc-fab.ghost{ flex:0 0 auto; width:auto; padding-left:18px; padding-right:18px; }
  /* Zrušit filtry / Zrušit výběr (25. 11. 2026): v klidu obrys jako pilulky filtru, když má smysl, bílé pozadí. */
  #mc-root .mc-clear{ flex:0 0 auto; width:auto; padding-left:18px; padding-right:18px; background:transparent; border:1px solid var(--border); color:var(--text); }
  #mc-root .mc-clear:disabled{ opacity:1; color:var(--muted); cursor:default; }
  #mc-root .mc-clear:not(:disabled){ background:var(--surface); }
  .mc-fab-row{ display:flex; gap:10px; width:100%; max-width:484px; pointer-events:auto; }
  .mc-fab-row .mc-fab{ flex:1; min-width:0; }
  .mc-fsheet .fs-foot .mc-fab:disabled{ opacity:.45; cursor:default; }
  .fs-search{ margin:0 0 14px; }
    .mc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .mc-chip{ background:var(--surface); border:1px solid var(--border); color:var(--body); font-family:var(--sans);
    font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:20px; cursor:pointer; transition:all .12s ease; }
  .mc-chip.dur{ background:var(--surface); color:var(--accent); font-family:var(--mono); font-weight:700; }
  /* Skupiny ve filtru: malý nadpis jednou tlumenou barvou, pilulky s jemným podkladem skupiny a jednotným obrysem, vybraná sytá. */
  .fs-group + .fs-group{ margin-top:20px; }
  .fs-gh{ margin-bottom:8px; font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--soft); }
  .mc-chip[class*=" g-"]{ border-color:var(--border); }   /* jednotný jemný obrys, barva jen v podkladu (25. 11. 2026) */
  .mc-chip.g-st{ background:var(--g-st-bg); color:var(--g-st-tx); }
  .mc-chip.g-em{ background:var(--g-em-bg); color:var(--g-em-tx); }
  .mc-chip.g-co{ background:var(--g-co-bg); color:var(--g-co-tx); }
  .mc-chip.g-vz{ background:var(--g-vz-bg); color:var(--g-vz-tx); }
  .mc-chip.g-ch{ background:var(--g-ch-bg); color:var(--g-ch-tx); }
  .mc-chip.g-st.on{ background:var(--g-st-on); border-color:var(--g-st-on); }
  .mc-chip.g-em.on{ background:var(--g-em-on); border-color:var(--g-em-on); }
  .mc-chip.g-co.on{ background:var(--g-co-on); border-color:var(--g-co-on); }
  .mc-chip.g-vz.on{ background:var(--g-vz-on); border-color:var(--g-vz-on); }
  .mc-chip.g-ch.on{ background:var(--g-ch-on); border-color:var(--g-ch-on); }
  .mc-chip[class*=" g-"].on{ color:var(--on-accent); }
  @media (hover:hover){ .mc-chip:hover{ border-color:var(--soft); } }
  .mc-chip.on,.mc-chip.dur.on{ background:var(--tone); border-color:var(--tone); color:var(--on-accent); font-weight:700; }
  .mc-filter-foot{ display:flex; justify-content:flex-end; margin-top:12px; }
  .mc-filter-clear{ background:none; border:none; color:var(--soft); font-family:var(--sans); font-size:12.5px;
    cursor:pointer; text-decoration:underline; }
  @media (hover:hover){ .mc-filter-clear:hover{ color:var(--text); } }

  /* ===== FLOATING ACTION ===== */
  .mc-fab-wrap{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom)); pointer-events:none;
    background:linear-gradient(to top,var(--bg) 58%,transparent); }
  .mc-fab{ pointer-events:auto; max-width:484px; width:100%; background:var(--accent); color:var(--on-accent); border:none;
    border-radius:12px; padding:14px; font-family:var(--sans); font-size:15px; font-weight:700; cursor:pointer;
    border:1px solid transparent;   /* stejná výška s obrysovými tlačítky vedle (dřív o 2 px nižší) */
    transition:transform .12s ease,filter .15s ease; }
  @media (hover:hover){ .mc-fab:hover{ filter:brightness(1.06); } }
  .mc-fab:active{ transform:scale(.98); }

  /* ===== FEELING LIST ===== */
  /* Hustší seznamy (25. 11. 2026): nižší boxy, rozestup 7 px — víc na stránku. Checkbox beze změny. */
  .mc-list{ padding:20px var(--gutter) 0; list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:7px; align-content:start; }
  .mc-feeling{ display:flex; align-items:center; gap:7px; padding:6px 4px 6px 10px; background:var(--surface);
    border:1px solid var(--border); border-radius:11px; transition:border-color .15s ease,background .15s ease; min-width:0; }
  .mc-feeling.checked{ border-color:var(--tone); background:var(--tone-soft); }
  .mc-check{ flex-shrink:0; width:20px; height:20px; border-radius:6px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .12s ease; }
  .mc-check.on{ background:var(--tone); border-color:var(--tone); }
  .mc-check svg{ width:12px; height:12px; color:var(--on-accent); opacity:0; transition:opacity .12s ease; }
  .mc-check.on svg{ opacity:1; }
  .mc-check:active{ transform:scale(.92); }
  .mc-feeling-name{ flex:1; min-width:0; font-family:var(--serif); font-weight:600; font-size:13.5px;
    font-variation-settings:'opsz' 14; letter-spacing:0; line-height:1.25; color:var(--text); cursor:pointer;
    overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto; }
  .mc-feeling-go{ flex-shrink:0; font-family:var(--mono); color:var(--soft); font-size:15px; opacity:.45; cursor:pointer; padding:0; margin-left:-3px; }
  @media (hover:hover){ .mc-feeling-name:hover ~ .mc-feeling-go,.mc-feeling-go:hover{ opacity:.9; color:var(--tone); } }
  .mc-more{ width:auto; margin:10px var(--gutter) 4px; padding:11px; background:transparent; border:1px dashed var(--border);
    border-radius:14px; color:var(--soft); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s ease; }
  @media (hover:hover){ .mc-more:hover{ color:var(--text); border-color:var(--soft); } }

  /* ===== NAME LIST (crisis, body) ===== */
  .mc-namelist{ padding:24px var(--gutter) 0; }
  .mc-name-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:11px 17px; background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:7px;
    cursor:pointer; text-align:left; transition:border-color .15s ease,background .15s ease; }
  @media (hover:hover){ .mc-name-item:hover{ border-color:var(--accent); background:var(--surface-2); } }
  .mc-name-item .n{ font-family:var(--serif); font-weight:600; font-size:16.5px; font-variation-settings:'opsz' 24;
    letter-spacing:-0.01em; color:var(--text); line-height:1.25; }
  .mc-name-item .go{ font-family:var(--mono); color:var(--soft); font-size:18px; opacity:.5; }
  /* Seznam cvičení v oddílu: pod názvem řádek metadat (čas · náročnost · řetěz) */
  .mc-name-item .nb{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .mc-name-item .sub{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--soft); }
  .mc-name-item .sub .m{ display:inline-flex; align-items:center; gap:4px; }
  .mc-name-item .sub svg{ width:12px; height:12px; }
  .mc-name-item .sub .warn{ color:var(--accent); }

  /* ===== PŘERÁMOVÁNÍ — brány ===== */
  .mc-gates{ padding-top:20px; }
  .mc-gates .mc-card{ padding:20px 50px 20px 20px; }
  .mc-gates .gate-hint{ margin-top:4px; color:var(--soft); font-style:italic; }
  .mc-card.nofav{ padding-right:20px; }
  .mc-name-item .sub-n{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--soft); }
  /* Zrcadlo bolístek: věty, ne názvy — sans, menší, bez serifové váhy */
  .mc-under{ margin:26px var(--gutter) 0; padding-top:18px; border-top:1px solid var(--border); }
  .mc-under h2{ color:var(--tone); }
  .mc-under p{ color:var(--soft); font-size:14.5px; line-height:1.55; margin:6px 0 12px; }
  .mc-fab-wrap.static{ position:static; padding:16px var(--gutter) 0; background:none; pointer-events:auto; }

  /* ===== LIŠTA „jen nové" / seznam–karty ===== */
  .mc-tools{ display:flex; justify-content:flex-end; gap:6px; padding:12px var(--gutter) 0; }
  .mc-pill{ display:inline-flex; align-items:center; gap:5px; background:none; border:1px solid var(--border); border-radius:999px;
    padding:5px 11px 5px 9px; cursor:pointer; color:var(--muted); font-family:var(--mono); font-size:11px;
    transition:border-color .15s ease,color .15s ease,background .15s ease; }
  .mc-pill svg{ width:14px; height:14px; display:block; }
  @media (hover:hover){ .mc-pill:hover{ color:var(--text); border-color:var(--muted); } }
  .mc-pill.on{ color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .mc-pill.ic{ padding:6px 7px; gap:4px; }
  .mc-pill svg{ width:16px; height:16px; }
  .mc-pill .fc{ background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px; font-variant-numeric:tabular-nums; letter-spacing:-0.03em;
    min-width:15px; height:15px; padding:0 3px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; }
  .mc-submenu-triplet{ align-items:center; }
  .mc-link{ background:none; border:none; padding:0; margin-top:6px; cursor:pointer; color:var(--accent); font-family:var(--sans); font-size:14px; font-weight:600; text-decoration:underline; text-underline-offset:3px; }

  /* ===== PROUD KARET (swipe) =====
     Horizontální scroll-snap, jedna karta = šířka obrazovky. Výška se váže
     na okno; uvnitř Miowebu je to výška elementu — ověřit v embedu. */
  .mc-swipe-wrap{ padding:12px 0 0; }
  .mc-swipe{ display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; gap:0; height:calc(100vh - 230px); min-height:400px; max-height:720px; }
  .mc-swipe::-webkit-scrollbar{ display:none; }
  .mc-swipe-card{ flex:0 0 100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; display:flex; flex-direction:column;
    padding:4px var(--gutter) 12px; box-sizing:border-box; }
  .mc-swipe-card .sc-body{ position:relative; flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center;
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px 24px 48px; text-align:center; }
  /* Počítadlo a srdíčko dole v rozích — srdíčko blíž palci. */
  .mc-swipe-card .sc-count{ position:absolute; bottom:18px; left:18px; font-family:var(--mono); font-size:11px; color:var(--muted); }
  /* Počítadlo + bublinka zpětné vazby vlevo dole (od 20. 11. 2026), stejná barva */
  .mc-swipe-card .sc-foot-l{ position:absolute; left:14px; bottom:9px; height:34px; display:flex; align-items:center; gap:4px; color:var(--muted); }
  .mc-swipe-card .sc-foot-l .sc-count{ position:static; }
  .mc-swipe-card .sc-foot-l .sc-count{ font-family:var(--sans); font-size:13px; font-variant-numeric:tabular-nums; }
  .mc-swipe-card .sc-foot-l .sc-fb{ position:static; width:34px; height:34px; color:var(--muted); opacity:.6; }
  .mc-swipe-card .sc-foot-l .sc-fb svg{ width:22px; height:22px; }
  .mc-swipe-card .sc-body .mc-heart{ top:auto; bottom:9px; right:10px; }
  .mc-swipe-card .sc-body .mc-heart svg{ width:24px; height:24px; }
  /* Terčík u experimentů — výška pod řádkem, aby nerozhodil řádkování */
  .mc-exp{ display:inline-block; width:.85em; height:.85em; margin-right:.3em; vertical-align:-.08em; color:var(--accent); line-height:0; }
  .mc-exp svg{ width:100%; height:100%; display:block; }
  .mc-swipe-card .sc-fb{ position:absolute; top:10px; right:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    background:none; border:0; color:var(--muted); opacity:.55; cursor:pointer; border-radius:10px; }
  .mc-swipe-card .sc-fb svg{ width:19px; height:19px; }
  @media (hover:hover){ .mc-swipe-card .sc-fb:hover{ opacity:1; color:var(--tone); } }
  .mc-swipe-card .sc-text{ font-family:var(--serif); font-weight:400; color:var(--text); line-height:1.35; letter-spacing:-0.01em; font-variation-settings:'opsz' 36; }
  .mc-swipe-card .sc-text.xl{ font-size:30px; }
  .mc-swipe-card .sc-text.lg{ font-size:24px; }
  .mc-swipe-card .sc-text.md{ font-size:20px; line-height:1.4; }
  .mc-swipe-card .sc-text.sm{ font-size:17px; line-height:1.5; font-variation-settings:'opsz' 24; }
  .mc-swipe-card .sc-meta{ margin-top:18px; font-family:var(--mono); font-size:11px; color:var(--soft); }
  .mc-swipe-card.break .sc-body{ background:var(--surface-2); border-style:dashed; }
  /* ===== Zápisník: čistá stránka odpovědí v režimu karet (od 20. 11. 2026) =====
     Nahoře jen Zpět, pod ním záložky jako v papírovém zápisníku, karta přes celou plochu,
     dole switch „Jen nové“ a přepnutí na seznam. Bez scrollu. */
  .mc-folder .mc-swipe-wrap{ padding:0; }
  .mc-folder .mc-swipe{ height:calc(100vh - 180px); height:calc(100svh - 180px); min-height:380px; max-height:none; }
  .mc-folder .mc-swipe-card{ padding-top:0; padding-bottom:0; }
  /* Od 24. 11. 2026: blok s kartami (.mc-folder) má výšku okna bez horní lišty (69 px) — hlavička
     (Zpět + záložky / nadpis s tlačítky) nahoře, karta vyplní zbytek, spodní lišta se stejným
     odstupem od karty i od spodku obrazovky. Bez scrollu stránky. Odstup hlavička → karta 16 px všude. */
  #mc-root[data-page="fill"]{ padding-bottom:0; }
  #mc-root[data-page="fill"] .mc-folder{ min-height:calc(100vh - 69px); min-height:calc(100dvh - 69px); display:flex; flex-direction:column; }
  #mc-root[data-page="fill"] .mc-folder .mc-swipe-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; }
  #mc-root[data-page="fill"] .mc-folder .mc-swipe{ flex:1; height:auto; min-height:300px; max-height:none; }
  /* Symetrie (24. 11. 2026): řádek nad kartou (Zpět + záložky + přepínač, u Otázek a Inspirace nadpis
     + Filtr + přepínač) i lišta pod kartou mají nad sebou a pod sebou stejných 16 px — vycentrované
     ve volném prostoru mezi horní lištou appky / spodkem obrazovky a kartou. */
  #mc-root[data-page="fill"] .mc-sfoot{ padding:16px var(--gutter); }
  .mc-ftabs{ display:flex; align-items:center; gap:8px; padding:16px var(--gutter); }
  .mc-qfold .mc-sec-head{ padding:16px var(--gutter); }
  .mc-fback{ margin-right:auto; background:none; border:none; padding:0; cursor:pointer;
    color:var(--accent); font-family:var(--sans); font-size:13px; font-weight:600; white-space:nowrap; }
  .mc-submenu-triplet.in{ padding:0; flex-wrap:nowrap; }
  .mc-sfoot{ display:flex; align-items:center; gap:10px; padding:10px var(--gutter); }
  .mc-sfoot .sp{ flex:1; }
  .mc-sfoot .mc-fbf{ width:26px; height:26px; padding:0; margin-right:16px; background:none; border:none; cursor:pointer; color:var(--muted); display:flex; }
  .mc-sfoot .mc-fbf svg{ width:26px; height:26px; display:block; }
  .mc-sfoot .lbl{ font-family:var(--sans); font-size:14px; font-weight:600; color:color-mix(in srgb, var(--soft) 45%, var(--muted)); line-height:26px; display:flex; align-items:center; gap:4px; }
  .mc-sfoot .cnt{ font-family:var(--sans); font-size:14px; font-weight:600; color:inherit; }
  .mc-sfoot .mc-switch{ margin-left:15px; }
  .mc-switch{ position:relative; width:44px; height:26px; border-radius:13px; border:none; padding:0; cursor:pointer;
    background:color-mix(in srgb, var(--muted) 38%, var(--surface)); transition:background .15s ease; flex-shrink:0; }
  .mc-switch::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px #0004; transition:transform .15s ease; }
  .mc-switch.on{ background:color-mix(in srgb, var(--accent) 45%, var(--surface)); }
  .mc-switch.on::after{ transform:translateX(18px); }
  /* Seznam: jen tři čárky bez obrysu, výška jako switch, na ose srdíčka v kartě */
  .mc-swipe-card .sc-foot-r{ position:absolute; right:16px; bottom:9px; height:34px; max-width:62%; display:block; line-height:34px;
    font-family:var(--sans); font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mc-swipe-card .sc-heart{ display:flex; justify-content:center; margin-top:20px; }
  .mc-swipe-card .sc-body .sc-heart .mc-heart{ position:static; padding:8px; }
  /* Srdíčko pod textem karty: obrys rovnou světlejší červenou (--heart), ne šedou (24. 11. 2026). */
  .mc-swipe-card .sc-heart .mc-heart .he{ color:var(--heart); }
  .mc-swipe-card .sc-body .sc-heart .mc-heart svg{ width:34px; height:34px; }
  /* Placka jako první karta: víc témat = jedna karta, čísla bez duplicit */
  .mc-swipe-card.alert .sc-body{ border:2px solid var(--accent); text-align:left; justify-content:center; padding:26px 22px 26px; }
  .sc-alert-ic{ color:var(--accent); display:flex; margin-bottom:10px; }
  .sc-alert-ic svg{ width:26px; height:26px; }
  .sc-alert-t{ font-family:var(--sans); font-size:16.5px; line-height:1.5; color:var(--text); }
  .sc-alert-n{ margin-top:8px; font-family:var(--sans); font-size:14px; line-height:1.45; color:var(--soft); }
  .sc-alert-tels{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .sc-alert-tels a{ font-family:var(--sans); font-size:14px; line-height:1.35; color:var(--soft); text-decoration:none; }
  .sc-alert-tels a b{ display:block; font-size:22px; font-weight:700; color:var(--accent); letter-spacing:.01em; }
  .sc-alert-go{ margin-top:16px; padding:0; background:none; border:none; cursor:pointer; color:var(--accent);
    font-family:var(--sans); font-size:14px; font-weight:600; text-align:left; }
  /* Návod s palcem — jen při úplně prvním vstupu */
  .mc-swipe-card.tutor .sc-body{ overflow:hidden; }
  .sc-tutor-t{ font-family:var(--serif); font-weight:600; font-size:24px; line-height:1.25; color:var(--tone); font-variation-settings:'opsz' 36; }
  .sc-tutor-p{ margin:10px 0 0; font-size:15.5px; line-height:1.5; color:var(--text); }
  .sc-thumb{ position:absolute; left:50%; bottom:-6px; width:74px; margin-left:-37px; color:var(--muted); opacity:.75;
    animation:mcThumb 2.4s ease-in-out .6s infinite; }
  .sc-thumb svg{ width:100%; display:block; }
  .sc-tutor-up{ display:flex; justify-content:center; color:var(--tone); margin-bottom:12px; animation:mcUp 1.4s ease-in-out infinite; }
  .sc-tutor-up svg{ width:30px; height:30px; }
  @keyframes mcUp{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  @keyframes mcPulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--tone) 55%, transparent); } 100%{ box-shadow:0 0 0 9px transparent; } }
  .mc-submenu-triplet.pulse button:not(.active){ animation:mcPulse 1.3s ease-out infinite; border-color:var(--tone); color:var(--tone); }
  .mc-switch.pulse{ animation:mcPulse 1.3s ease-out infinite; }
  /* Šipka doleva dolů na switch „Jen nové“ (třetí návodná karta). */
  .sc-tutor-dl{ position:absolute; left:16px; bottom:14px; color:var(--tone); animation:mcDl 1.4s ease-in-out infinite; }
  .sc-tutor-dl svg{ width:30px; height:30px; display:block; transform:rotate(-135deg); }
  @keyframes mcDl{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-6px,6px); } }
  @keyframes mcThumb{ 0%,100%{ transform:translateX(0); } 30%{ transform:translateX(-46px); } 60%{ transform:translateX(38px); } }
  /* Měkký řez — výraznější než „Stačí pro dnes?“ */
  .mc-swipe-card.break.soft .sc-body{ background:var(--tone-soft); border:1.5px solid var(--tone); border-style:solid; }
  .sc-soft-t{ font-family:var(--serif); font-weight:600; font-size:24px; line-height:1.2; color:var(--tone); font-variation-settings:'opsz' 36; }
  .sc-soft-p{ margin:12px 0 0; font-size:15.5px; line-height:1.55; color:var(--text); }
  .mc-soft{ list-style:none; margin:14px 0; padding:22px 20px; border-radius:16px; background:var(--tone-soft); border:1.5px solid var(--tone); text-align:center; }
  .mc-soft .sc-actions{ display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  .mc-soft .sc-actions .mc-fab{ width:auto; padding:12px 22px; }
  /* Výzva ke swipování */
  @keyframes mcPeek{ 0%{ transform:none; } 35%{ transform:translateX(-64px); } 60%{ transform:translateX(-64px); } 100%{ transform:none; } }
  .mc-swipe.hint .mc-swipe-card{ animation:mcPeek 1.3s ease .45s 1; }
  .mc-swipe-card .sc-actions{ display:flex; gap:8px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
  .mc-swipe-card .sc-actions .mc-fab{ width:auto; padding:12px 22px; }
  .mc-swipe-card .sc-actions.col{ flex-direction:column; align-items:center; gap:10px; }
  .mc-swipe-card .sc-act-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .mc-fab.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
  /* Připomínka zálohy — pop-up uprostřed při vstupu (jednou za měsíc) */
  .mc-modal-backdrop{ position:fixed; inset:0; z-index:60; background:#000a; animation:mcFade .18s ease forwards; }
  .mc-modal{ position:fixed; z-index:61; left:50%; top:50%; transform:translate(-50%,-50%); width:calc(100% - 2*var(--gutter)); max-width:360px;
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px 22px 18px; text-align:center; box-shadow:0 20px 60px #0006; }
  .mc-modal-ic{ width:46px; height:46px; margin:0 auto 12px; border-radius:50%; background:var(--tone-soft); color:var(--tone); display:flex; align-items:center; justify-content:center; }
  .mc-modal-ic svg{ width:22px; height:22px; }
  .mc-modal h2{ font-family:var(--serif); font-weight:600; font-size:21px; line-height:1.2; font-variation-settings:'opsz' 36; color:var(--text); margin:0 0 8px; }
  .mc-modal p{ font-size:14.5px; line-height:1.5; color:var(--soft); margin:0 0 16px; }
  .mc-modal .mc-fab{ display:block; width:100%; margin-top:8px; }

  /* ===== ADMIN (provizorní) ===== */
  .mc-adm{ display:flex; align-items:center; gap:4px; margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); }
  .mc-adm .adm-sp{ flex:1; }
  .mc-adm .adm-src{ font-family:var(--mono); font-size:10px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:2px 6px; }
  .mc-adm .adm-src.edited{ color:var(--teal); border-color:var(--teal); }
  .adm-btn{ background:none; border:1px solid var(--border); border-radius:8px; width:34px; height:30px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--soft); }
  .adm-btn svg{ width:15px; height:15px; }
  .adm-btn.on{ color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .adm-btn.del{ color:var(--muted); }
  @media (hover:hover){ .adm-btn:hover{ color:var(--text); border-color:var(--muted); } .adm-btn.del:hover{ color:var(--accent); border-color:var(--accent); } }
  .mc-card:not(.nofav) .mc-adm{ margin-right:-30px; }   /* lišta smí pod srdíčko — nofav srdíčko nemá */
  .mc-swipe-card .mc-adm{ justify-content:center; border-top:none; margin-top:14px; }
  .mc-swipe-card .mc-adm .adm-sp{ display:none; }
  .mc-adm-detail{ padding:0 var(--gutter); }
  .mc-adm-detail .mc-adm{ margin-top:6px; }
  .mc-top{ display:inline-flex; color:var(--accent); vertical-align:-2px; margin-right:5px; }
  .mc-top svg{ width:14px; height:14px; }
  .mc-card-meta .mc-top{ margin:0; gap:4px; }
  .mc-adm-edit textarea{ width:100%; box-sizing:border-box; font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--text); background:var(--surface-2);
    border:1px solid var(--accent); border-radius:12px; padding:10px 12px; resize:vertical; }
  .mc-adm-edit .adm-row{ display:flex; gap:6px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; }
  .mc-adm-edit .adm-row .mc-fab{ width:auto; padding:9px 14px; font-size:13px; }
  .mc-swipe-card .mc-adm-edit{ text-align:left; }
  .mc-adm-edit input{ width:100%; box-sizing:border-box; margin-top:6px; font-family:var(--sans); font-size:14px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
  .mc-adm-fedit{ margin-top:10px; }
  .mc-adm-fedit textarea.big{ font-family:var(--mono); font-size:13px; line-height:1.55; min-height:40vh; }
  .adm-fields{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .adm-pill{ font-family:var(--sans); font-size:12px; padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--soft); cursor:pointer; }
  .adm-pill.active{ color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .adm-pill.edited::after{ content:" •"; color:var(--teal); font-weight:700; }
  .adm-shared{ display:flex; gap:8px; align-items:flex-start; font-family:var(--sans); font-size:13px; line-height:1.4; color:var(--accent); margin-bottom:8px; }
  .adm-shared svg{ width:16px; height:16px; flex:none; }
  .mc-toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60;
    display:flex; align-items:center; gap:14px; background:var(--text); color:var(--bg); padding:11px 16px; border-radius:12px;
    font-family:var(--sans); font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.25); max-width:calc(100% - 40px); }
  .mc-toast button{ background:none; border:none; color:var(--accent); font-family:var(--sans); font-size:14px; font-weight:700; cursor:pointer; padding:0; }
  .mc-menu-item.adm .mi-label{ color:var(--muted); }
  .mc-menu-item.adm.active .mi-label{ color:var(--accent); }
  .mc-adm-stats{ display:flex; gap:10px; margin:16px var(--gutter) 0; }
  .mc-adm-stats > div{ flex:1; text-align:center; padding:12px 8px; background:var(--surface); border:1px solid var(--border); border-radius:14px; font-family:var(--sans); font-size:12px; color:var(--soft); }
  .mc-adm-stats b{ display:block; font-family:var(--mono); font-size:20px; color:var(--text); }
  .mc-box.adm-export{ padding:12px 16px; }
  .mc-adm-actions{ display:flex; gap:8px; flex-wrap:wrap; margin:12px var(--gutter) 0; }
  .mc-adm-actions .mc-fab{ width:auto; flex:1; padding:12px 14px; font-size:14px; }
  .mc-adm-note{ margin:10px var(--gutter) 0; font-family:var(--sans); font-size:13px; color:var(--muted); line-height:1.5; }
  .mc-adm-h3{ font-family:var(--sans); font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 8px; }
  .mc-card.del .mc-card-text{ color:var(--muted); }

  /* ===== MOJE CESTA — oddíly ===== */
  .mc-card-eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--tone); margin-bottom:6px; }
  .mc-card-eyebrow.mc-guide-ic{ display:flex; }
  .mc-card-eyebrow.mc-guide-ic svg{ width:16px; height:16px; }
  .mc-card-go{ position:absolute; top:16px; right:16px; font-family:var(--mono); color:var(--soft); font-size:18px; opacity:.5; }
  .mc-sec-link{ display:inline-flex; align-items:center; gap:8px; margin:10px var(--gutter) 0; padding:0; background:none; border:none;
    cursor:pointer; font-family:var(--sans); font-size:13.5px; color:var(--soft); text-align:left; }
  @media (hover:hover){ .mc-sec-link:hover{ color:var(--text); } }
  .mc-sec-link .l{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--tone); }

  /* Náročnost — pilulka (nízká / střední / vysoká) */
  .mc-diff{ display:inline-block; padding:3px 10px; border-radius:999px; font-family:var(--sans); font-size:12px; font-weight:600; line-height:1.4; }
  .mc-diff.low{ background:var(--teal-soft); color:var(--teal); }
  .mc-diff.mid{ background:var(--accent-dim); color:var(--accent); }
  .mc-diff.high{ background:var(--accent); color:var(--on-accent); }

  /* Boxy pod taby: řetěz a upozornění (stejný rámeček jako .mc-strip) */
  .mc-box{ margin:10px var(--gutter) 0; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .mc-box .b-head{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px; background:none; border:none; cursor:pointer; text-align:left; }
  .mc-box .b-num{ font-family:var(--mono); font-size:12px; color:var(--accent); background:var(--accent-dim); padding:4px 8px; border-radius:8px; }
  .mc-box .b-text{ flex:1; font-family:var(--sans); font-size:14px; color:var(--text); line-height:1.45; }
  .mc-box .b-chev{ color:var(--soft); display:flex; transition:transform .15s ease; }
  .mc-box .b-chev svg{ width:16px; height:16px; }
  .mc-box.open .b-chev{ transform:rotate(180deg); }
  .mc-box .b-body{ padding:0 16px 14px; border-top:1px solid var(--border); }
  .mc-box .b-title{ font-family:var(--serif); font-weight:600; font-size:16px; font-variation-settings:'opsz' 24; color:var(--text); padding-top:12px; }
  .mc-box .b-hint{ font-family:var(--sans); font-size:13px; color:var(--soft); margin:4px 0 10px; }
  .mc-box .b-list{ margin:0; padding-left:22px; font-family:var(--mono); font-size:12px; color:var(--soft); }
  .mc-box .b-list li{ margin:4px 0; }
  .mc-box .b-list button{ background:none; border:none; padding:0; cursor:pointer; font-family:var(--sans); font-size:14px; color:var(--text); text-align:left; }
  .mc-box .b-list li.cur button{ color:var(--accent); font-weight:600; }
  /* Placka „obraťte se na odborníka“ — vážná témata, vždy nahoře, nejde zavřít.
     Tlustý lem v accentu místo plochy: výrazné, ale ne poplach. */
  .mc-alert{ display:flex; gap:12px; margin:12px var(--gutter) 4px; padding:14px 16px; background:var(--surface);
    border:3px solid var(--accent); border-radius:14px; }
  .mc-alert .a-ic{ flex-shrink:0; color:var(--accent); display:flex; padding-top:1px; }
  .mc-alert .a-ic svg{ width:22px; height:22px; }
  .mc-alert .a-body{ flex:1; min-width:0; }
  .mc-alert .a-text{ font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--text); }
  .mc-alert .a-tels{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .mc-alert .a-tel{ font-family:var(--sans); font-size:14px; line-height:1.4; color:var(--soft); text-decoration:none; }
  .mc-alert .a-tel b{ font-size:18px; font-weight:700; color:var(--accent); margin-right:8px; white-space:nowrap; }
  .mc-alert .a-go{ margin-top:10px; padding:0; background:none; border:none; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:600; color:var(--accent); }
  .mc-alert + .mc-alert{ margin-top:8px; }
  .mc-warn{ display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .mc-warn .b-ic{ flex-shrink:0; width:30px; height:30px; border-radius:9px; background:var(--accent-dim); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .mc-warn .b-ic svg{ width:16px; height:16px; }

  /* Příloha cvičení (attachments) — samostatná karta za postupem */
  .mc-attach{ margin:20px var(--gutter) 0; padding:16px 20px; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
  .mc-attach .a-title{ font-family:var(--serif); font-weight:600; font-size:16px; font-variation-settings:'opsz' 24; color:var(--tone); margin-bottom:8px; }
  .mc-attach .mc-md{ font-size:14.5px; }

  /* ===== BACK / DETAIL ===== */
  .mc-back{ display:inline-flex; align-items:center; gap:5px; margin:20px var(--gutter) 0; background:none; border:none;
    padding:0; color:var(--accent); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; transition:opacity .15s ease; }
  @media (hover:hover){ .mc-back:hover{ opacity:.7; } }
  .mc-detail-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px var(--gutter) 2px; }
  .mc-detail-title{ font-family:var(--serif); font-weight:600; font-size:30px; font-variation-settings:'opsz' 72;
    color:var(--tone); letter-spacing:-0.01em; line-height:1.15; }
  .mc-detail-sub{ padding:2px var(--gutter) 2px; color:var(--soft); font-family:var(--mono); font-size:12px; }
  .mc-detail-heart{ flex-shrink:0; background:none; border:none; cursor:pointer; padding:4px; color:var(--muted); transition:transform .12s ease; }
  .mc-detail-heart:active{ transform:scale(.9); }
  .mc-detail-heart svg{ width:24px; height:24px; display:block; }
  .mc-detail-heart .hf{ display:none; color:var(--heart); }
  .mc-detail-heart.on .he{ display:none; }
  .mc-detail-heart.on .hf{ display:block; }
  .mc-detail-meta{ padding:10px var(--gutter) 0; }
  .mc-detail-body{ padding:18px var(--gutter) 0; }

  .mc-submenu-triplet{ display:flex; gap:5px; padding:14px var(--gutter) 4px; flex-wrap:wrap; }
  .mc-submenu-triplet button{ background:var(--surface); border:1px solid var(--border); color:var(--soft);
    font-family:var(--sans); font-size:13px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; transition:all .15s ease; }
  @media (hover:hover){ .mc-submenu-triplet button:hover{ color:var(--text); } }
  .mc-submenu-triplet button.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  /* ===== CARDS ===== */
  .mc-cards{ padding:20px var(--gutter) 0; list-style:none; }
  /* Karta podle .ex-card z mockupu: měkčí rádius, bez accentového pruhu vlevo
     (ten v mockupu patří jen .journal-card), perex v sans a tlumený. */
  .mc-card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px 50px 18px 20px; margin-bottom:10px; overflow:hidden; }
  .mc-card.clickable{ cursor:pointer; transition:border-color .15s ease,background .15s ease; }
  @media (hover:hover){ .mc-card.clickable:hover{ border-color:var(--accent); background:var(--surface-2); } }
  .mc-card-title{ font-family:var(--serif); font-weight:600; font-size:18px; font-variation-settings:'opsz' 24;
    letter-spacing:-0.01em; color:var(--text); line-height:1.25; margin-bottom:6px; }
  .mc-card-text{ font-family:var(--sans); font-size:14.5px; line-height:1.55; color:var(--soft); }
  /* .lead = Fraunces (dnes jen věta pod branou). Citáty a otázky jedou od 24. 11. 2026 stejným písmem
     jako přerámování (.mc-card-text), ať se v Oblíbených nemění styl. */
  .mc-card-text.lead{ font-family:var(--serif); font-weight:400; font-size:17px; line-height:1.5;
    font-variation-settings:'opsz' 24; color:var(--text); }
  .mc-card-author{ margin-top:9px; font-family:var(--sans); font-size:12.5px; color:var(--accent); }
  .mc-card-author .yr{ color:var(--soft); }
  .mc-card .mc-tag-row{ margin-top:10px; }
  .mc-card-meta{ margin-top:9px; font-family:var(--mono); font-size:11px; color:var(--soft); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .mc-card-meta:empty{ display:none; }
  .mc-card-meta .m{ display:inline-flex; align-items:center; gap:4px; }
  .mc-card-meta svg{ width:12px; height:12px; }
  .mc-card.read .mc-card-title{ color:var(--soft); }

  .mc-heart{ position:absolute; top:12px; right:11px; background:none; border:none; cursor:pointer; padding:5px; transition:transform .12s ease; }
  .mc-heart:active{ transform:scale(.9); }
  .mc-heart svg{ width:22px; height:22px; display:block; transition:all .12s ease; }
  .mc-heart .he{ color:var(--muted); }
  .mc-heart .hf{ color:var(--heart); display:none; }
  .mc-heart.on .he{ display:none; }
  .mc-heart.on .hf{ display:block; }

  /* ===== TABBAR (Postup / Info) =====
     Dřív rozbalovací toggle „▸ K čemu to je". Mockup má dva taby, aktivní
     s tmavým pozadím; Info nese tečku, že tam něco je. */
  /* Od 24. 11. 2026 čtyři tlačítka: nevybrané bílé s rámečkem, vybrané tmavé. */
  .mc-tabbar{ display:flex; gap:8px; padding:18px var(--gutter) 4px; }
  .mc-tab{ flex:1; text-align:center; padding:10px 0; border-radius:12px; border:1px solid var(--border); cursor:pointer;

    transition:background .15s ease,color .15s ease,border-color .15s ease; }
  @media (hover:hover){ .mc-tab:hover{ color:var(--text); border-color:var(--muted); } }
  .mc-tab.active{ background:var(--text); border-color:var(--text); color:var(--bg); }
  .mc-tab .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent);

  .mc-strip{ display:flex; align-items:center; gap:10px; margin:16px var(--gutter) 0; padding:14px 16px;

  .mc-strip .s-ic{ flex-shrink:0; width:34px; height:34px; border-radius:10px; background:var(--accent-dim);

  .mc-strip .s-label{ font-family:var(--sans); font-size:11px; text-transform:uppercase; letter-spacing:0.06em;

  .mc-strip .s-value{ font-family:var(--sans); font-size:14px; font-weight:600; color:var(--text); }

  .mc-strip.ex{ align-items:center; gap:12px; }
  .mc-strip.ex .s-ic{ width:calc(var(--n) * 20px); height:calc(var(--n) * 20px); border-radius:12px; }

  .mc-strip .s-rows{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .mc-strip .s-rows .s-value{ line-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Svislá linka přes celou výšku boxu, od horního k dolnímu okraji (záporný margin = padding boxu). */
  .mc-strip .s-sep{ align-self:stretch; width:1px; margin:-14px 0; background:var(--border); flex-shrink:0; }
  .mc-strip .s-diff{ text-align:left; flex-shrink:0; }

  /* ===== JOURNAL CARD (Zápis do deníku) =====

  .mc-journal{ margin:28px var(--gutter) 0; padding:18px 20px; background:var(--surface-2);

  .mc-journal-eyebrow svg{ width:15px; height:15px; }
  .mc-journal .mc-md{ font-size:15px; }

  /* Odkaz na plné znění článku na blogu. Ukazuje se jen u článků se

  .mc-source{ margin:30px var(--gutter) 0; padding-top:16px; border-top:1px solid var(--border); }

  .mc-md > :first-child{ margin-top:0; }
  .mc-md p{ margin:0 0 13px; }
  .mc-md ul,.mc-md ol{ margin:0 0 14px; padding-left:22px; }
  .mc-md ul{ list-style:none; } .mc-md ol{ list-style:decimal; }

  .mc-steps > ol{ list-style:none; padding-left:0; counter-reset:mcstep; margin:0; }

  .mc-steps > ol > li > strong:first-child{ display:block; font-family:var(--sans); font-size:16px;

  .mc-md li > ul{ list-style:circle; }
  .mc-md li::marker{ color:var(--accent); }

  .mc-md strong.mc-tel{ color:var(--tone); }

  .mc-about{ padding:14px var(--gutter) 0; font-family:var(--serif); font-size:16.5px; line-height:1.7; color:var(--body); }

  .mc-about .a-guide{ padding:0; background:none; border:none; cursor:pointer; text-align:left;

  /* Úvodní souhlas: celá obrazovka místo appky, checkboxy až pod textem */
  .mc-consent{ max-width:560px; margin:0 auto; padding:32px 0 40px; }

  .mc-consent-row{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    font-family:var(--sans); font-size:15px; line-height:1.4; color:var(--text); }
  .mc-consent-row[aria-pressed="true"]{ border-color:var(--tone); background:var(--tone-soft); }
  .mc-consent > .mc-fab{ display:block; width:calc(100% - 2 * var(--gutter)); margin:0 var(--gutter); }

  #mc-root[data-still] .mc-in,

  // Úprava položky = { pole: hodnota }. Starší úpravy vět jsou jen string

  // Původní hodnoty polí se drží v it._o (jen v paměti).
  function admOrig(it,field){ it._o=it._o||{}; if(!(field in it._o)) it._o[field]=it[field]; return it._o[field]; }
  function admSetField(store,id,field,v){
    var it=admItem(store,id); if(!it) return;
    var orig=admOrig(it,field), f=admFields(store,id);
    if(v===(orig==null?"":String(orig))){ delete f[field]; it[field]=orig; } else { f[field]=v; it[field]=v; }
    var keys=Object.keys(f), map=ADMIN.edits[store]=ADMIN.edits[store]||{};
    if(!keys.length) delete map[id]; else map[id]=(keys.length===1&&keys[0]==="text")?f.text:f;
  }
  function admRestoreItem(store,id){ var it=admItem(store,id); if(it&&it._o) Object.keys(it._o).forEach(function(k){ it[k]=it._o[k]; }); delete (ADMIN.edits[store]||{})[id]; }

  var legacyKeys={}, LEGACY_STORES=["pains","situations"];

    legacyKeys={};

      (d[0]||[]).forEach(function(o){
        (o[d[1]]||[]).map(function(x){ return x.id; }).sort().forEach(function(id,i){ legacyKeys[o.id+":"+i]=id; });
      });
    });
  }
  function migrateList(a){
    if(!Array.isArray(a)) return false;
    var changed=false;
    a.forEach(function(k,i){ if(legacyKeys[k]){ a[i]=legacyKeys[k]; changed=true; } });
    return changed;
  }
  function migrateAdminKeys(a){
    var changed=false;
    LEGACY_STORES.forEach(function(st){
      if(a.deleted&&migrateList(a.deleted[st])) changed=true;

      var e=a.edits&&a.edits[st];

    return changed;
  }

  // Jeden citát na den, drží se přes celý den (opakované otevření appky ho

  // Lokální datum, ne UTC — jinak by se citát měnil ve dvě ráno.
  function today(){
    var d=new Date();
    return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  }
  function dailyInspiration(){
    var all=(DB&&DB.inspirations)||[];
    if(!all.length) return null;
    var d=USER.daily, t=today();
    if(d&&d.date===t){
      var cur=(itemIndex.inspirations||{})[d.id];
      if(cur) return cur;   // položka mohla zmizet z dat → přelosuje se
    }
    var seen=(d&&Array.isArray(d.seen))?d.seen:[];
    var pool=all.filter(function(x){ return seen.indexOf(x.id)<0; });
    if(!pool.length){ seen=[]; pool=all.slice(); }
    var pick=pool[Math.floor(Math.random()*pool.length)];
    USER.daily={ date:t, id:pick.id, seen:seen.concat([pick.id]) };
    saveUser();
    return pick;
  }

  // ===================== NAČTENÍ =====================
  // Odkud data jsou: Last-Modified = čas deploye na Pages (stejný u všech
  // souborů), X-MC-Source = značka service workeru, když vrátil cache.
  var DATA_INFO={modified:null,cache:false};
  function noteData(r){
    if(!r.headers||!r.headers.get) return;
    var lm=Date.parse(r.headers.get("Last-Modified")||"");
    if(!isNaN(lm)&&(DATA_INFO.modified==null||lm>DATA_INFO.modified)) DATA_INFO.modified=lm;
    if(r.headers.get("X-MC-Source")==="cache") DATA_INFO.cache=true;
  }
  function load(){
    var keys=Object.keys(FILES);
    Promise.all(keys.map(function(k){
      return fetch(MC_BASE+FILES[k],{cache:"no-cache"}).then(function(r){ if(!r.ok) throw new Error(FILES[k]+" → HTTP "+r.status); noteData(r); return r.json(); });
    })).then(function(arrs){
      DB={}; keys.forEach(function(k,i){ DB[k]=arrs[i]; });
      prepare(); render();
    }).catch(showError);
  }

  function prepare(){
    DB.clusters.forEach(function(c){ clusterName[c.id]=c.name; clusterSort[c.id]=c.sort_order; });

      byCluster[t.key]={}; itemIndex[t.key]={};
      (DB[t.key]||[]).forEach(function(it){
        (byCluster[t.key][it.cluster_id]=byCluster[t.key][it.cluster_id]||[]).push(it);
        itemIndex[t.key][it.id]=it;
      });
      Object.keys(byCluster[t.key]).forEach(function(cid){ byCluster[t.key][cid].sort(function(a,b){ return a.sort_order-b.sort_order; }); });
    });
    contentClusters=Object.keys(byCluster.reframings);
    Object.keys(CONTENT).forEach(function(key){
      var dk=CONTENT[key].dataKey;
      flat[dk]=(DB[dk]||[]).slice().sort(function(a,b){ return a.sort_order-b.sort_order; });
      itemIndex[dk]={}; flat[dk].forEach(function(it){ itemIndex[dk][it.id]=it; });
    });
    // Oddíly a řetězy (Moje cesta). sort_order cvičení je lokální per oddíl,
    // chain_order per řetěz — proto dva samostatné indexy.
    ["sections","chains","fears","situations","pains"].forEach(function(dk){
      flat[dk]=(DB[dk]||[]).slice().sort(function(a,b){ return a.sort_order-b.sort_order; });
      itemIndex[dk]={}; flat[dk].forEach(function(it){ itemIndex[dk][it.id]=it; });
    });
    itemIndex.hlasky={};
    (DB.pains||[]).forEach(function(p){ (p.hlasky||[]).forEach(function(x){ itemIndex.hlasky[x.id]={ id:x.id, text:x.text, meta:p.text, source:x.source, approved:x.approved }; }); });
    // Přerámování situací jako položky (ID sitr_NNNN) — kvůli adminu.
    itemIndex.sitref={};
    (DB.situations||[]).forEach(function(s){ (s.reframings||[]).forEach(function(r){ itemIndex.sitref[r.id]={ id:r.id, text:r.text, meta:s.name, approved:r.approved }; }); });
    buildLegacyKeys(); migrateStoredKeys();
    applyEdits();
    bySection={}; byChain={};
    (DB.exercises||[]).forEach(function(e){
      if(e.section_id) (bySection[e.section_id]=bySection[e.section_id]||[]).push(e);
      if(e.chain_id) (byChain[e.chain_id]=byChain[e.chain_id]||[]).push(e);
    });
    Object.keys(bySection).forEach(function(k){ bySection[k].sort(function(a,b){ return a.sort_order-b.sort_order; }); });
    Object.keys(byChain).forEach(function(k){ byChain[k].sort(function(a,b){ return (a.chain_order||0)-(b.chain_order||0); }); });
  }

  function showError(err){
    document.getElementById("mc-root").innerHTML=
      '<div class="mc-error"><strong>Data se nepodařilo načíst.</strong><br><br>'+
