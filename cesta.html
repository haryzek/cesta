  // ===================== RENDER — obsahový detail =====================
  function viewContentDetail(){
    var d=state.detail, item=(itemIndex[d.type]||{})[d.id];
    var cfg=null; Object.keys(CONTENT).forEach(function(k){ if(CONTENT[k].dataKey===d.type) cfg=CONTENT[k]; });
    if(!item||!cfg) return '<div class="mc-empty">Položka nenalezena.</div>';
    var title=item[cfg.titleField]||item.name||"";
    var store=cfg.store, on=isFav(store,d.id);
    // Cvičení: taby Postup / Info / Teorie / Praxe. Info/Teorie/Praxe se u
    // cvičení dědí z oddílu (v datech jsou vždy null), info_extra/theory_extra
    // se předřadí nad oddílový text. Tab se kreslí jen když má obsah.
    var isEx=!!cfg.info, sec=isEx&&item.section_id?itemIndex.sections[item.section_id]:null;
    var tabs=[];
    if(isEx){
      tabs.push({key:"body",label:"Postup"});
      var src={ info:item.info||(sec&&sec.info), theory:item.theory||(sec&&sec.theory), practice:item.practice||(sec&&sec.practice) };
      if(src.info) tabs.push({key:"info",label:"Info",src:src.info,extra:item.info_extra});
      if(src.theory) tabs.push({key:"theory",label:"Teorie",src:src.theory,extra:item.theory_extra});
      if(src.practice) tabs.push({key:"practice",label:"Praxe",src:src.practice,practice:true});
    }
    var hasTabs=tabs.length>1;
    var tab=tabs.some(function(t){return t.key===d.tab;})?d.tab:"body";

    var h='<button class="mc-back" onclick="MC.detailBack()">← Zpět</button>';
    // Pořadí podle mockupu: tag pilulky nad H1, pak titulek, pak perex.
    // Čas u cvičení nese box náročnosti pod taby, takže pilulku nedubluje.
    var pills=[];
    if(cfg.timeField&&item[cfg.timeField]&&!isEx) pills.push(timeTag(item[cfg.timeField]));
    if(item.tags&&item.tags.length) item.tags.forEach(function(t){ pills.push('<span class="mc-tag">'+esc(t)+'</span>'); });
    if(pills.length) h+='<div class="mc-detail-meta"><div class="mc-tag-row">'+pills.join("")+'</div></div>';

    h+='<div class="mc-detail-head"><div class="mc-detail-title">'+esc(title)+'</div>';
    h+='<button class="mc-detail-heart '+(on?"on":"")+'" onclick="MC.fav(\''+store+'\',\''+d.id+'\')" aria-label="Uložit"><svg class="he" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><svg class="hf" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button></div>';
    if(item.perex) h+='<div class="mc-detail-perex">'+esc(item.perex)+'</div>';
    // Most z cvičení do jeho oddílu v Moje cesta.
    if(sec) h+='<button class="mc-sec-link" onclick="MC.journeySection(\''+sec.id+'\')"><span class="l">Oddíl '+("0"+sec.sort_order).slice(-2)+'</span>'+esc(sec.title)+' ›</button>';

    if(hasTabs){
      h+='<div class="mc-tabbar">';
      tabs.forEach(function(t){ h+='<button class="mc-tab '+(tab===t.key?"active":"")+'" onclick="MC.detailTab(\''+t.key+'\')">'+t.label+(t.key!=="body"?'<span class="dot"></span>':'')+'</button>'; });
      h+='</div>';
    }
    var cur=tabs.filter(function(t){return t.key===tab;})[0];
    if(cur&&cur.key!=="body"){
      if(cur.extra) h+='<div class="mc-detail-body mc-md mc-extra">'+md(cur.extra)+'</div>';
      if(cur.practice) h+=renderPractice(cur.src,sec&&sec.diary_practice,title);
      else h+='<div class="mc-detail-body mc-md">'+md(stripDupHeading(cur.src,title))+'</div>';
    } else {
      if(isEx){
        // Box náročnosti: Trvání (jedna performance) · Praxe (frequency /
        // training_period) · Náročnost. Návrh local/_design/box_náročnosti.jpg.
        var praxe=[item.frequency,item.training_period].filter(Boolean).join(" / ");
        h+='<div class="mc-strip"><div class="s-ic">'+IC.clock+'</div><div class="s-rows">';
        if(item.duration) h+='<div><span class="s-label">Trvání:</span><span class="s-value">'+esc(item.duration)+' min</span></div>';
        if(praxe) h+='<div><span class="s-label">Praxe:</span><span class="s-value">'+esc(praxe)+'</span></div>';
        h+='</div>';
        if(item.difficulty) h+='<div class="s-diff"><div class="s-label">Náročnost</div>'+diffPill(item.difficulty)+'</div>';
        h+='</div>';
        // Box řetězu — jediný nosič návaznosti. Rozklik ukáže celý řetěz.
        if(item.chain_id && byChain[item.chain_id]){
          var ch=itemIndex.chains[item.chain_id], list=byChain[item.chain_id];
          h+='<div class="mc-box mc-chain '+(d.chainOpen?"open":"")+'"><button class="b-head" onclick="MC.detailChain()"><span class="b-num">'+item.chain_order+'/'+list.length+'</span><span class="b-text">Cvičení je součástí řetězu</span><span class="b-chev">'+IC.chevron+'</span></button>';
          if(d.chainOpen){
            h+='<div class="b-body"><div class="b-title">'+esc(ch?ch.title:"")+'</div><div class="b-hint">Cvičení na sebe navazují — doporučujeme začít od prvního.</div><ol class="b-list">';
            list.forEach(function(e){ h+='<li class="'+(e.id===item.id?"cur":"")+'"><button onclick="MC.detail(\'exercises\',\''+e.id+'\')">'+esc(e.name)+'</button></li>'; });
            h+='</ol></div>';
          }
          h+='</div>';
        }
        if(item.warning) h+='<div class="mc-box mc-warn"><span class="b-ic">'+IC.warn+'</span><span class="b-text">'+esc(item.warning)+'</span></div>';
      }
      var jr=isEx?{body:stripDupHeading(item.body,title),journal:null}:splitJournal(stripDupHeading(item.body,title));
      h+='<div class="mc-detail-body mc-md'+(isEx?" mc-steps":"")+'">'+md(jr.body)+'</div>';
      if(isEx&&item.attachments&&item.attachments.length){
        item.attachments.forEach(function(a){ h+='<div class="mc-attach"><div class="a-title">'+esc(a.title||"Příloha")+'</div><div class="mc-md">'+md(a.body||"")+'</div></div>'; });
      }
      // Deník cvičení žije v polích: oddílový (společný) + specifický, slepené.
      var diary=isEx?[sec&&sec.diary_exercise,item.diary_exercise].filter(Boolean).join("\n"):jr.journal;
      if(diary) h+=journalCard(diary);
      // Zkrácené články (`show_link: true`) nabídnou plné znění na blogu.
      // Odkaz staví renderer, ne markdown — parser odkazy neumí a do těl se
      // zásadně nepíšou. Podmínka na https:// je pojistka, ať se do href
      // nedostane nic jiného než webová adresa.
      if(item.show_link && /^https:\/\//.test(String(item.source_url||""))){
        h+='<div class="mc-source"><a href="'+esc(item.source_url)+'" target="_blank" rel="noopener noreferrer">'+
           IC.external+'Celý článek na blogu</a></div>';
      }
    }
    if(cfg.readable) markRead(d.id);
    return h;
  }

        h+='<li class="mc-card mc-in'+(fv.detail?' clickable':'')+'"'+
           (fv.detail?' onclick="MC.detail(\''+fv.dataKey+'\',\''+it.id+'\')"':'')+'>';

  // ===================== SPOLEČNÉ =====================
  var HEART_ICONS='<svg class="he" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><svg class="hf" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';

  // Lišta nad seznamem věty: přepínač „jen nové" (indikátor i přepínač v jednom,
  // pořád na očích) a přepínač seznam / karty.
  // Oko otevřené = vidím všechno, škrtnuté = viděné schované; počet nových
  // jako mini badge (stejný vzor jako počet filtrů u tlačítka Filtr).
  // inline=true vrací jen tlačítka (vkládá se do řádku submenu).
  function listTools(store,total,shown,inline){
    var on=USER.onlyNew, sw=viewMode()==="swipe";
    var h='<button class="mc-pill ic '+(on?"on":"")+'" onclick="MC.onlyNew()" aria-label="'+(on?"Zobrazit i viděné":"Jen nové")+'">'+(on?IC.eyeOff:IC.eye)+(on?'<span class="fc">'+shown+'</span>':'')+'</button>';
    h+='<button class="mc-pill ic '+(sw?"on":"")+'" onclick="MC.viewMode(\''+(sw?"list":"swipe")+'\')" aria-label="'+(sw?"Seznam":"Karty")+'">'+(sw?IC.list:IC.cards)+'</button>';
    return inline?'<span class="mc-tools-in">'+h+'</span>':'<div class="mc-tools">'+h+'</div>';

  // Prázdný stav při „jen nové": všechno viděno → nabídnout viděné.
  function allSeen(){ return '<div class="mc-empty"><div class="e-ic">✓</div>Všechno z tohohle už jste viděli.<br><button class="mc-link" onclick="MC.onlyNew()">Zobrazit i viděné</button></div>'; }
  // Proud karet: horizontální scroll-snap bez knihovny. Seznam se snímkuje
  // (key) — při „jen nové" by karty jinak mizely pod rukama, jak se označují
  // za viděné. Každých SWIPE_BREAK karet měkký předěl „Stačí pro dnes?",
  // na konci závěr — appka sama nabízí odchod.
  var SWIPE_BREAK=10;
  function swipeView(store,key,items,meta){
    var sw=state.swipe;
    if(sw.key!==key){ sw.key=key; sw.ids=items.map(function(it){ return it.id; }); sw.index=0; }
    var idx={}; items.forEach(function(it){ idx[it.id]=it; });
    var list=sw.ids.map(function(id){ return idx[id]; }).filter(Boolean);
    if(!list.length) return USER.onlyNew?allSeen():'<div class="mc-empty">Nic tu není.</div>';
    var h='<div class="mc-swipe-wrap"><div class="mc-swipe" id="mc-swipe" data-store="'+store+'">';
    list.forEach(function(it,i){
      var size=it.text.length<90?"xl":it.text.length<180?"lg":it.text.length<320?"md":"sm";
      // Počítadlo vlevo nahoře a srdíčko vpravo nahoře v kartě — nic mimo ni.
      h+='<div class="mc-swipe-card" data-id="'+esc(it.id)+'"><div class="sc-body"><span class="sc-count">'+(i+1)+' / '+list.length+'</span>'+heartBtn(store,it.id,isFav(store,it.id));
      h+='<div class="sc-text '+size+'">'+esc(it.text)+'</div>'+(meta?'<div class="sc-meta">'+meta(it)+'</div>':'')+'</div></div>';
      if((i+1)%SWIPE_BREAK===0 && i<list.length-1) h+='<div class="mc-swipe-card break"><div class="sc-body"><div class="sc-text lg">Stačí pro dnes?</div><div class="sc-actions"><button class="mc-fab ghost" onclick="MC.swipeClose()">Zavřít</button><button class="mc-fab" onclick="MC.swipeNext()">Ještě pár</button></div></div></div>';
    });
    h+='<div class="mc-swipe-card break end"><div class="sc-body"><div class="sc-text lg">'+(USER.onlyNew?"To je všechno nové. Zítra zas.":"To je všechno.")+'</div><div class="sc-actions"><button class="mc-fab ghost" onclick="MC.swipeClose()">Zavřít</button>'+(USER.onlyNew?'<button class="mc-fab" onclick="MC.onlyNew()">Zobrazit i viděné</button>':'')+'</div></div></div>';
    return h+'</div></div>';
  }
  // Po překreslení: obnovit pozici a označovat viděné podle karty na obrazovce.
  function bindSwipe(){
    var el=document.getElementById("mc-swipe"); if(!el) return;
    var store=el.getAttribute("data-store"), cards=el.children;
    function w(){ return el.clientWidth||1; }
    function update(){
      var i=Math.round(el.scrollLeft/w()); if(i<0)i=0; if(i>=cards.length)i=cards.length-1;
      state.swipe.index=i;
      var c=cards[i];
      if(c&&c.getAttribute("data-id")) markSeen(store,c.getAttribute("data-id"));
    }
    el.scrollLeft=state.swipe.index*w();
    var t; el.addEventListener("scroll",function(){ clearTimeout(t); t=setTimeout(update,80); });
    update();
  }
  function swipeStep(d){ var el=document.getElementById("mc-swipe"); if(el) el.scrollBy({left:d*el.clientWidth,behavior:"smooth"}); }
  function favCountOf(stores){ return stores.reduce(function(n,s){ return n+USER.favorites[s].length; },0); }
  function heartBtn(store,id,on,stop){

  }

    rfSearch:function(v){ state.rf.search=v; render(); var s=document.getElementById("mc-search"); if(s){ s.focus(); s.value=v; s.setSelectionRange(v.length,v.length); } },
    rfSecondary:function(){ state.rf.showSecondary=!state.rf.showSecondary; render(); },
    rfToggle:function(id){ var sel=state.rf.selected; if(sel[id]) delete sel[id]; else { var f=DB.feelings.filter(function(x){return x.id===id;})[0]; if(f) sel[id]=f; } render(); },
    rfSingle:function(cid){ state.rf.detailMode="single"; state.rf.detailClusters=[{cluster_id:cid,count:1}]; state.rf.detailTitle=null; state.rf.origin="feelings"; enterRfDetail(); },
    rfOpenSelected:function(){
      var sel=state.rf.selected, feels=Object.keys(sel).map(function(k){return sel[k];}), counts={};
      feels.forEach(function(f){ counts[f.cluster_id]=(counts[f.cluster_id]||0)+1; });
      var cids=Object.keys(counts);
      if(cids.length===1){ state.rf.detailMode="single"; state.rf.detailClusters=[{cluster_id:cids[0],count:counts[cids[0]]}]; }
      else { state.rf.detailMode="merged"; state.rf.detailClusters=cids.map(function(c){ return {cluster_id:c,count:counts[c]}; }); }
      state.rf.detailTitle=null; state.rf.origin="feelings";
      enterRfDetail();
    },
    rfBack:function(){ state.rf.view=state.rf.origin||"feelings"; scrollTop(); render(); },
    // brány
    rfGate:function(g){ var rf=state.rf; rf.view=g||"gates"; if(g==="fears"){ rf.fearGroup=null; } if(g==="pains"){ rf.pain=null; } scrollTop(); render(); },
    rfFearsTab:function(t){ state.rf.fearsTab=t; render(); },
    rfFearSearch:function(v){ state.rf.fearSearch=v; render(); refocus(v); },
    rfFearGroup:function(g){ state.rf.fearGroup=g; state.rf.view="fearGroup"; scrollTop(); render(); },
    rfSituation:function(id){ state.rf.situation=id; state.rf.view="situation"; scrollTop(); render(); },
    rfSitBack:function(){ var rf=state.rf; rf.view=rf.fearSearch.trim()||!rf.fearGroup?"fears":"fearGroup"; scrollTop(); render(); },
    // Kanonový strach → rovnou triplet přes merged interleaving nad prvními
    // FEAR_CLUSTERS jádrovými pocity. Zpět vede tam, odkud se přišlo.
    rfFear:function(id){
      var rf=state.rf, f=itemIndex.fears[id]; if(!f) return;
      var cids=(f.cluster_ids||[]).slice(0,FEAR_CLUSTERS).filter(function(c){ return contentClusters.indexOf(c)>-1; });
      if(!cids.length) return;
      rf.detailMode=cids.length===1?"single":"merged";
      rf.detailClusters=cids.map(function(c){ return {cluster_id:c,count:1}; });
      rf.detailTitle=f.name; rf.origin=rf.view;
      enterRfDetail();
    },
    rfPainSearch:function(v){ state.rf.painSearch=v; state.rf.painLimit=30; render(); refocus(v); },
    rfPainMore:function(){ state.rf.painLimit+=30; render(); },
    rfPain:function(id){ state.rf.pain=id; state.rf.view="pain"; scrollTop(); render(); },
    rfType:function(t){ state.rf.activeType=t; state.rf.pageLimit=50; scrollTop(); render(); },
    rfMore:function(){ state.rf.pageLimit+=50; render(); },
    // obsahové sekce
    secMode:function(key,m){ secState(key).mode=m; scrollTop(); render(); },
    secFav:function(key){ var s=secState(key); s.favOnly=!s.favOnly; render(); },
    secFilter:function(key){ var s=secState(key); s.filterOpen=!s.filterOpen; render(); },
    secKw:function(key,v){ secState(key).kw=v; render(); var i=document.querySelector(".mc-filter .fkw"); if(i){ i.focus(); i.value=v; i.setSelectionRange(v.length,v.length); } },
    secTag:function(key,t){ var s=secState(key),i=s.tags.indexOf(t); if(i>-1)s.tags.splice(i,1); else s.tags.push(t); render(); },
    secDur:function(key,i){ var s=secState(key), p=s.durs.indexOf(i); if(p>-1) s.durs.splice(p,1); else s.durs.push(i); render(); },
    secClear:function(key){ var s=secState(key); s.kw=""; s.tags=[]; s.durs=[]; render(); },
    secSearch:function(v){ secState(state.section).search=v; render(); var s=document.getElementById("mc-search"); if(s){ s.focus(); s.value=v; s.setSelectionRange(v.length,v.length); } },
    // detail
    detail:function(type,id){ state.detail={ type:type, id:id, tab:"body", chainOpen:false }; scrollTop(); render(); },
    detailBack:function(){ state.detail=null; scrollTop(); render(); },
    detailTab:function(t){ if(state.detail) state.detail.tab=t; scrollTop(); render(); },
    detailChain:function(){ if(state.detail) state.detail.chainOpen=!state.detail.chainOpen; render(); },
    // Moje cesta
    journeySection:function(id){ state.page="section"; state.section="journey"; state.detail=null; state.journey.sectionId=id; state.journey.tab="exercises"; scrollTop(); render(); },
    journeyBack:function(){ state.journey.sectionId=null; scrollTop(); render(); },
    journeyTab:function(t){ state.journey.tab=t; scrollTop(); render(); },
    // oblíbené
    fav:function(store,id){ toggleFav(store,id); render(); },
    // jen nové / proud karet
    onlyNew:function(){ USER.onlyNew=!USER.onlyNew; saveUser(); state.swipe.key=null; render(); },
    viewMode:function(m){ try{ localStorage.setItem(VIEW_KEY,m); }catch(e){} state.swipe.key=null; render(); },
    swipeNext:function(){ swipeStep(1); },
    swipeClose:function(){ if(state.section==="reframing"){ var rf=state.rf; if(rf.view==="detail") MC.rfBack(); else if(rf.view==="pain") MC.rfGate("pains"); else MC.home(); } else MC.home(); },
    // Enter v hledání zavře klávesnici. Na mobilu jinak není jak ji schovat —
    // filtruje se průběžně, takže není co odesílat.
    searchKey:function(e){ if(e&&e.key==="Enter"){ e.preventDefault(); if(e.target&&e.target.blur) e.target.blur(); } },
    // téma
    theme:function(){
      var next=theme()==="light"?"dark":"light";
      try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
      applyTheme(); render();
    }
  };

  function enterRfDetail(){ state.rf.view="detail"; state.rf.activeType="reframings"; state.rf.pageLimit=50; scrollTop(); render(); }
  // Po překreslení vrátí kurzor do hledacího pole (render ho nahradil).
  function refocus(v){ var s=document.getElementById("mc-search"); if(s){ s.focus(); s.value=v; s.setSelectionRange(v.length,v.length); } }
  function scrollTop(){ var r=document.getElementById("mc-root"); if(r&&r.scrollIntoView) r.scrollIntoView({block:"start"}); }

  applyTheme();
  load();
})();
</script>
