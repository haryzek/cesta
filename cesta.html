<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#15120E">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Moje cesta</title>
<!--
  MOJE CESTA — KOMPLETNÍ PROTOTYP
  Všech 11 JSON sekcí naživo. Hřiště k proklikání celé appky.

  Data se tahají relativně (MC_BASE="./data/"), takže soubor funguje lokálně
  (python -m http.server v kořeni) i na GitHub Pages.
  Obal + registr sekcí je převzatý z cesta_prototyp.html; sloty jsou tu
  nahrazené živými renderery.

  Meta tagy nahoře jsou pro samostatné spuštění na mobilu (PWA přes
  „Přidat na plochu" + vypnutá cache, ať se refresh po pushi projeví hned).
  Uvnitř Miowebu je WordPress ignoruje, nevadí tam.
-->

<div id="mc-root"><div class="mc-loading">Načítám…</div></div>

<style>
  :where(#mc-root *, #mc-root *::before, #mc-root *::after) { margin:0; box-sizing:border-box; }
  /* Mobil: žádný modrý záblesk při ťuknutí, žádný výběr textu na dlouhý dotyk
     u klikacích prvků. Hover jen tam, kde je myš — na dotyku by po ťuknutí
     visel (viz @media (hover:hover) u všech :hover). */
  #mc-root{ -webkit-tap-highlight-color:transparent; }
  :where(#mc-root button, #mc-root .mc-card.clickable, #mc-root .mc-tile, #mc-root .mc-name-item, #mc-root .mc-feeling, #mc-root .mc-swipe-card){ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  /* Pozor na specificitu: `#mc-root ul` (0,1,1) přebíjí třídy (0,1,0), takže
     každé .mc-list/.mc-cards/.mc-md ul tiše přišlo o vlastní padding a leželo
     na okraji obrazovky. Reset proto přes :where() — nulová specificita. */
  :where(#mc-root ul) { padding:0; list-style:none; }

  /* ===== PALETA =====
     Dvě sady, přepínač píše data-theme na #mc-root (ne na <html> — uvnitř
     Miowebu nad ním nemáme kontrolu). Dark je zapsaný jako výchozí přímo na
     #mc-root, aby appka měla barvy i kdyby JS nedoběhl.

     Mapování starých názvů na nový design systém:
       --bg → bg | --surface → card | --surface-2 → card-alt | --text → text
       --body → text (oba jsou čtený text, nová paleta je sjednocuje)
       --soft → text-secondary | --accent-dim → accent-soft
     Nové: --muted (nejtlumenější), --teal + --teal-soft (tag pilulky),
     --on-accent (text NA accent ploše — v dark tmavý, v light světlý; dřív
     bylo natvrdo #15120E, což by na světlé terakotě nebylo vidět). */
  #mc-root {
    --bg:#1C1914; --surface:#262119; --surface-2:#2E281E; --border:#3A3226;
    --text:#F2EBDC; --body:#F2EBDC; --soft:#B5AA96; --muted:#7C7264;
    --accent:#E08252; --accent-dim:#3D2A1F; --on-accent:#1C1914; --heart:#E08252;
    --teal:#6FBBA6; --teal-soft:#223832; --teal-deep:#16332F;
    --empty:#3A3226; --done:#6FBBA6; --missed:#E08252;

    /* Tón sekce: akční sekce (První pomoc, Tělo, Přerámování, Cvičení) jedou
       červeně, čtecí (Otázky, Inspirace, Články, O appce) zeleně. Nadpisy,
       odrážky a ikonky se řídí --tone; data-tone se přepíná na #mc-root podle
       otevřené sekce. Výchozí = accent. */
    --tone:var(--accent); --tone-soft:var(--accent-dim);

    /* Jednotná osa zarovnání — dřív si každý blok odsazoval po svém
       (18/16/14px), takže nic nesedělo na jednu linku. */
    --gutter:20px;

    --serif:'Fraunces',Georgia,'Times New Roman',ui-serif,serif;
    --sans:'Public Sans',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;

    font-family:var(--sans); background:var(--bg); color:var(--body);
    max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:60px;
    line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased; position:relative;
  }

  /* --surface je čistě bílá, ne krémová jako v handoffu — karty a dlaždice
     potřebovaly víc kontrastu proti pozadí stránky. */
  #mc-root[data-theme="light"] {
    --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#FBF5EA; --border:#E8DFCE;
    --text:#2B241C; --body:#2B241C; --soft:#6B6053; --muted:#9C9385;
    --accent:#B8562E; --accent-dim:#F0DCCD; --on-accent:#FFFDF8; --heart:#D98763;
    --teal:#3E7266; --teal-soft:#DCEAE5; --teal-deep:#1F4F49;
    --empty:#E8DFCE; --done:#3E7266; --missed:#B8562E;
  }

  /* Čtecí sekce přebarví tón na zelenou. */
  #mc-root[data-tone="teal"]{ --tone:var(--teal); --tone-soft:var(--teal-soft); }

  /* Samostatné spuštění (Pages / PWA): #mc-root visí přímo pod body a kolem
     appky prosvítá bílá stránka. Uvnitř Miowebu je #mc-root zanořený ve WP
     divech, selektor se nechytí a pozadí stránky zůstane na WordPressu.
     Barvy jsou tu natvrdo — body je nad #mc-root, na jeho proměnné nedosáhne. */
  html:has(> body > #mc-root), body:has(> #mc-root) { margin:0; background:#1C1914; }
  html:has(> body > #mc-root[data-theme="light"]),
  body:has(> #mc-root[data-theme="light"]) { background:#F6F1E7; }

  /* ===== TYPOGRAFIE =====
     Fraunces je variabilní font s osou opsz (optical size) — sám mění kresbu
     podle velikosti. Bez explicitního nastavení jede na výchozích 14pt a
     nadpisy vypadají placatě; proto se opsz řídí ručně.

     Dělba podle handoffu: Fraunces = nadpisy a čísla, Public Sans = UI
     i běžný text. Coconut téma mělo serif i na inputech a textu karet, což
     mockup nedělá. Váhy: nadpisy 600 (dřív 400 kvůli Georgii — ve Fraunces
     je 400 hubená). */
  #mc-root :is(h1,h2,h3,h4){ font-family:var(--serif); font-weight:600; letter-spacing:-0.01em; }
  #mc-root h1{ font-size:30px; line-height:1.15; font-variation-settings:'opsz' 72; }
  #mc-root h2{ font-size:20px; line-height:1.25; font-variation-settings:'opsz' 36; }
  #mc-root h3,#mc-root h4{ font-size:17px; line-height:1.3; font-variation-settings:'opsz' 24; }

  /* Eyebrow — accentový škatulkový nadpis nad sekcí (v mockupu „POSTUP") */
  .mc-eyebrow{ font-family:var(--sans); font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--accent); margin-bottom:14px; }

  /* ===== TAG PILULKY =====
     Dřív se tagy sázely jako holý text přes čárku (a v seznamu vůbec).
     Základní pilulka je teal; varianta .time je accentová (čas, trvání). */
  .mc-tag-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .mc-tag{ font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:0.02em;
    padding:5px 12px; border-radius:20px; background:var(--teal-soft); color:var(--teal); line-height:1.3; }
  .mc-tag.time{ background:var(--accent-dim); color:var(--accent);
    display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-weight:700; }
  .mc-tag.time svg{ width:12px; height:12px; }
  .mc-tag.more{ background:transparent; color:var(--muted); padding:5px 4px; }

  .mc-loading,.mc-error{ padding:56px 24px; text-align:center; color:var(--soft); font-size:14px; line-height:1.7; }
  .mc-error strong{ color:var(--text); font-family:var(--serif); font-weight:600; }
  .mc-error code{ color:var(--accent); font-family:var(--mono); font-size:12px; }

  /* ===== TOPBAR ===== */
  .mc-topbar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:14px calc(var(--gutter) - 8px); background:var(--bg); border-bottom:1px solid var(--border); }
  .mc-icon-btn{ flex-shrink:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--soft); cursor:pointer; padding:0; border-radius:9px;
    transition:color .15s ease,background .15s ease; position:relative; }
  @media (hover:hover){ .mc-icon-btn:hover{ color:var(--text); background:var(--surface); } }
  .mc-icon-btn svg{ width:22px; height:22px; display:block; }
  .mc-topbar-title{ flex:1; text-align:center; font-family:var(--serif); font-weight:600; font-size:19px;
    font-variation-settings:'opsz' 36; color:var(--text); letter-spacing:-0.01em; cursor:pointer; line-height:1.1; }
  .mc-topbar-title .mc-mark{ color:var(--accent); font-style:italic; }
  .mc-heart-top.on{ color:var(--heart); }
  .mc-heart-top .hf{ display:none; }
  .mc-heart-top.on .he{ display:none; }
  .mc-heart-top.on .hf{ display:block; }
  .mc-topbadge{ position:absolute; top:4px; right:4px; min-width:16px; height:16px; padding:0 4px;
    background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px; font-weight:700;
    border-radius:8px; display:flex; align-items:center; justify-content:center; line-height:1; }

  /* ===== MENU ===== */
  .mc-menu-backdrop{ position:fixed; inset:0; z-index:40; background:#0009; animation:mcFade .18s ease forwards; }
  .mc-menu{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:340px; z-index:41;
    background:var(--surface); border-right:1px solid var(--border); padding:14px 0 24px; overflow-y:auto;
    animation:mcSlide .2s cubic-bezier(.2,.7,.3,1) forwards; }
  .mc-menu-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 16px 14px;
    margin-bottom:6px; border-bottom:1px solid var(--border); }
  .mc-menu-head h2{ font-size:19px; color:var(--text); font-variation-settings:'opsz' 36; cursor:pointer; }
  .mc-menu-head h2 .mc-mark{ color:var(--accent); font-style:italic; }
  .mc-menu-item{ display:flex; align-items:center; gap:13px; width:100%; padding:13px 16px; background:none;
    border:none; cursor:pointer; text-align:left; color:var(--body); font-family:var(--sans); font-size:15px;
    transition:background .12s ease; }
  @media (hover:hover){ .mc-menu-item:hover{ background:var(--surface-2); } }
  .mc-menu-item.active{ color:var(--accent); }
  .mc-menu-item .mi-ic{ flex-shrink:0; width:22px; height:22px; color:var(--soft); }
  .mc-menu-item.active .mi-ic{ color:var(--accent); }
  .mc-menu-item .mi-ic svg{ width:22px; height:22px; display:block; }
  .mc-menu-item .mi-label{ flex:1; }
  .mc-menu-item .mi-badge{ background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px;
    font-weight:700; padding:1px 7px; border-radius:7px; }
  .mc-menu-sep{ height:1px; background:var(--border); margin:6px 16px; }

  /* ===== HOME ===== */
  /* Úvodka: sloupec na výšku okna, dlaždice si vezmou zbytek. dvh kvůli
     adresnímu řádku na mobilu — 100vh tam počítá s plochou, která reálně
     není vidět. */
  /* height, ne min-height: s min-height se kontejner nafoukne podle obsahu a
     flexu pak nezbyde co rozdělovat — mřížka si vezme svoje min-content
     a přeteče. */
  #mc-root[data-page="home"]{ display:flex; flex-direction:column;
    height:100vh; height:100dvh; min-height:0; padding-bottom:0; }
  /* minmax(0,1fr) + min-height:0 — bez nich se řádky ani flex položka nesmrsknou
     pod velikost obsahu a na nízkém displeji mřížka přeteče. */
  #mc-root[data-page="home"] .mc-tiles{ flex:1; min-height:0;
    grid-template-rows:repeat(4,minmax(0,1fr)); padding-bottom:var(--gutter); }
  .mc-tiles{ padding-top:0; }
  #mc-root[data-page="home"] .mc-tile{ min-height:72px; overflow:hidden; }
  /* Na nízkém displeji ubereme dlaždici na výšce, ať se všechny čtyři řady
     vejdou bez scrollování. */
  @media (max-height:700px){
    #mc-root[data-page="home"] .mc-tile{ gap:6px; padding:12px 13px; }
    #mc-root[data-page="home"] .mc-tile-ic{ width:32px; height:32px; border-radius:9px; }
    #mc-root[data-page="home"] .mc-tile-ic svg{ width:17px; height:17px; }
    #mc-root[data-page="home"] .mc-home-intro{ padding-top:16px; padding-bottom:10px; }
  }

  .mc-home-intro{ padding:24px var(--gutter) 14px; }
  .mc-home-intro h1{ font-size:25px; font-variation-settings:'opsz' 48; }
  .mc-home-intro h1{ color:var(--tone); }
  .mc-home-intro p{ color:var(--soft); font-size:15px; line-height:1.55; margin-top:8px; }
  /* Citát dne — velikost jako názvy dlaždic, ale tenký řez. */
  .mc-home-intro p.mc-daily{ font-family:var(--serif); font-weight:400; font-size:17px; line-height:1.5;
    font-variation-settings:'opsz' 24; color:var(--body); margin-top:14px; }
  .mc-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 var(--gutter); }
  .mc-tile{ display:flex; flex-direction:column; gap:9px; min-height:118px; padding:16px 15px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; cursor:pointer; text-align:left;
    transition:border-color .15s ease,transform .1s ease,background .15s ease; position:relative; }
  @media (hover:hover){ .mc-tile:hover{ border-color:var(--accent); background:var(--surface-2); } }
  .mc-tile:active{ transform:scale(.985); }
  /* Ikonka v barevném čtverečku podle tónu sekce — akční červeně, čtecí
     zeleně. Dřív se střídalo mechanicky ob jednu, bez významu. */
  .mc-tile-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim); color:var(--accent); }
  .mc-tile[data-tone="teal"] .mc-tile-ic{ background:var(--teal-soft); color:var(--teal); }
  .mc-tile-ic svg{ width:20px; height:20px; display:block; }
  .mc-tile-name{ margin-top:auto; font-family:var(--serif); font-weight:600; font-size:17px;
    font-variation-settings:'opsz' 24; color:var(--text); line-height:1.2; letter-spacing:-0.01em; }
  .mc-tile-badge{ position:absolute; top:12px; right:12px; min-width:18px; height:18px; padding:0 5px;
    background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px; font-weight:700;
    border-radius:9px; display:flex; align-items:center; justify-content:center; }

  /* ===== SECTION HEADER ===== */
  .mc-sec-head{ padding:24px var(--gutter) 2px; }
  .mc-sec-head h1{ color:var(--tone); }
  .mc-sec-head p{ color:var(--soft); font-size:15px; line-height:1.55; margin-top:8px; }
  /* Řádek H1 + přepínač „jen oblíbené". Srdíčko menší a obrysové, ať se
     nečte jako „uložit sekci"; plné jen když je přepnuté. */
  .mc-sec-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .mc-sec-heart{ display:inline-flex; align-items:center; gap:5px; flex-shrink:0; background:none; border:1px solid var(--border);
    border-radius:999px; padding:5px 10px 5px 8px; cursor:pointer; color:var(--muted); font-family:var(--mono); font-size:11px;
    transition:border-color .15s ease,color .15s ease,background .15s ease; }
  @media (hover:hover){ .mc-sec-heart:hover{ color:var(--text); border-color:var(--muted); } }
  .mc-sec-heart svg{ width:16px; height:16px; display:block; }
  .mc-sec-heart .hf{ display:none; }
  .mc-sec-heart.on{ color:var(--heart); border-color:var(--heart); background:var(--surface); }
  .mc-sec-heart.on .he{ display:none; }
  .mc-sec-heart.on .hf{ display:block; }

  /* ===== SEARCH ===== */
  /* Obalovač má nesymetrické odsazení (20px nahoře, 2px dole), takže top:50%
     u ikon centrovalo vůči němu, ne vůči vstupu — lupa i křížek seděly o 9px
     výš. Odsazení proto řeší margin a wrap sám těsně obepíná input. */
  .mc-search-wrap{ margin:20px var(--gutter) 2px; position:relative; display:flex; }
  .mc-search{ width:100%; padding:11px 68px 11px 40px; font-family:var(--sans); font-size:15px; color:var(--text);
    background:var(--bg); border:1px solid var(--border); border-radius:10px; outline:none; transition:border-color .15s ease; }
  .mc-search::placeholder{ color:var(--muted); }
  .mc-search:focus{ border-color:var(--accent); }
  .mc-search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); display:block; width:16px; height:16px;
    color:var(--soft); pointer-events:none; }
  /* Nástroje vpravo v hledání — počítadlo vybraných + křížek na vymazání.
     Dřív viselo počítadlo na right:30px, tedy mimo osu ostatního obsahu. */
  .mc-search-tools{ position:absolute; right:8px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:6px; }
  .mc-count-pill{ background:var(--tone); color:var(--on-accent); font-family:var(--mono); font-size:11px;
    font-weight:700; min-width:20px; text-align:center; padding:3px 7px; border-radius:6px; pointer-events:none; }
  .mc-search-clear{ display:flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0;
    background:none; border:none; cursor:pointer; color:var(--muted); border-radius:50%; transition:color .12s ease; }
  @media (hover:hover){ .mc-search-clear:hover{ color:var(--text); } }
  .mc-search-clear svg{ width:13px; height:13px; }

  /* ===== SUBMENU (Nejnovější / Redakce / filtr) ===== */
  .mc-submenu{ display:flex; gap:6px; padding:14px var(--gutter) 4px; flex-wrap:wrap; align-items:center; }
  .mc-submenu button{ background:var(--surface); border:1px solid var(--border); color:var(--soft);
    font-family:var(--sans); font-size:13px; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer;
    transition:all .15s ease; }
  @media (hover:hover){ .mc-submenu button:hover{ color:var(--text); } }
  .mc-submenu button.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .mc-submenu .mc-filter-btn{ display:inline-flex; align-items:center; gap:6px; }
  /* Nástroje (oko, karty) k pravému okraji řádku submenu */
  .mc-tools-in{ margin-left:auto; display:inline-flex; gap:6px; }
  .mc-submenu .mc-filter-btn svg{ width:15px; height:15px; }
  .mc-submenu .mc-filter-btn .fc{ background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px;
    font-weight:700; padding:0 6px; border-radius:6px; }

  /* ===== FILTER PANEL ===== */
  .mc-filter{ margin:10px var(--gutter) 0; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .mc-filter .fkw{ width:100%; padding:10px 12px; font-family:var(--sans); font-size:15px; color:var(--text);
    background:var(--bg); border:1px solid var(--border); border-radius:10px; outline:none; margin-bottom:12px; }
  .mc-filter .fkw:focus{ border-color:var(--tone); }
    .mc-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .mc-chip{ background:var(--surface-2); border:1px solid var(--border); color:var(--body); font-family:var(--sans);
    font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:20px; cursor:pointer; transition:all .12s ease; }
  .mc-chip.dur{ background:var(--accent-dim); border-color:transparent; color:var(--accent); font-family:var(--mono); font-weight:700; }
  @media (hover:hover){ .mc-chip:hover{ border-color:var(--soft); } }
  .mc-chip.on,.mc-chip.dur.on{ background:var(--tone); border-color:var(--tone); color:var(--on-accent); font-weight:700; }
  .mc-filter-foot{ display:flex; justify-content:flex-end; margin-top:12px; }
  .mc-filter-clear{ background:none; border:none; color:var(--soft); font-family:var(--sans); font-size:12.5px;
    cursor:pointer; text-decoration:underline; }
  @media (hover:hover){ .mc-filter-clear:hover{ color:var(--text); } }

  /* ===== FLOATING ACTION ===== */
  .mc-fab-wrap{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom)); pointer-events:none;
    background:linear-gradient(to top,var(--bg) 58%,transparent); }
  .mc-fab{ pointer-events:auto; max-width:484px; width:100%; background:var(--accent); color:var(--on-accent); border:none;
    border-radius:12px; padding:14px; font-family:var(--sans); font-size:15px; font-weight:700; cursor:pointer;
    transition:transform .12s ease,filter .15s ease; }
  @media (hover:hover){ .mc-fab:hover{ filter:brightness(1.06); } }
  .mc-fab:active{ transform:scale(.98); }

  /* ===== FEELING LIST ===== */
  .mc-list{ padding:20px var(--gutter) 0; list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start; }
  .mc-feeling{ display:flex; align-items:center; gap:8px; padding:9px 10px 9px 11px; background:var(--surface);
    border:1px solid var(--border); border-radius:11px; transition:border-color .15s ease,background .15s ease; min-width:0; }
  .mc-feeling.checked{ border-color:var(--tone); background:var(--tone-soft); }
  .mc-check{ flex-shrink:0; width:20px; height:20px; border-radius:6px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .12s ease; }
  .mc-check.on{ background:var(--tone); border-color:var(--tone); }
  .mc-check svg{ width:12px; height:12px; color:var(--on-accent); opacity:0; transition:opacity .12s ease; }
  .mc-check.on svg{ opacity:1; }
  .mc-check:active{ transform:scale(.92); }
  .mc-feeling-name{ flex:1; min-width:0; font-family:var(--serif); font-weight:600; font-size:13.5px;
    font-variation-settings:'opsz' 14; letter-spacing:0; line-height:1.25; color:var(--text); cursor:pointer;
    overflow-wrap:anywhere; hyphens:auto; }
  .mc-feeling-go{ flex-shrink:0; font-family:var(--mono); color:var(--soft); font-size:15px; opacity:.45; cursor:pointer; padding:0 1px; }
  @media (hover:hover){ .mc-feeling-name:hover ~ .mc-feeling-go,.mc-feeling-go:hover{ opacity:.9; color:var(--tone); } }
  .mc-more{ width:auto; margin:10px var(--gutter) 4px; padding:11px; background:transparent; border:1px dashed var(--border);
    border-radius:14px; color:var(--soft); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s ease; }
  @media (hover:hover){ .mc-more:hover{ color:var(--text); border-color:var(--soft); } }

  /* ===== NAME LIST (crisis, body) ===== */
  .mc-namelist{ padding:24px var(--gutter) 0; }
  .mc-name-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:15px 17px; background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:8px;
    cursor:pointer; text-align:left; transition:border-color .15s ease,background .15s ease; }
  @media (hover:hover){ .mc-name-item:hover{ border-color:var(--accent); background:var(--surface-2); } }
  .mc-name-item .n{ font-family:var(--serif); font-weight:600; font-size:16.5px; font-variation-settings:'opsz' 24;
    letter-spacing:-0.01em; color:var(--text); line-height:1.25; }
  .mc-name-item .go{ font-family:var(--mono); color:var(--soft); font-size:18px; opacity:.5; }
  /* Seznam cvičení v oddílu: pod názvem řádek metadat (čas · náročnost · řetěz) */
  .mc-name-item .nb{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .mc-name-item .sub{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--soft); }
  .mc-name-item .sub .m{ display:inline-flex; align-items:center; gap:4px; }
  .mc-name-item .sub svg{ width:12px; height:12px; }
  .mc-name-item .sub .warn{ color:var(--accent); }

  /* ===== PŘERÁMOVÁNÍ — brány ===== */
  .mc-gates{ padding-top:20px; }
  .mc-gates .mc-card{ padding:20px 50px 20px 20px; }
  .mc-gates .gate-hint{ margin-top:4px; color:var(--soft); font-style:italic; }
  .mc-card.nofav{ padding-right:20px; }
  .mc-name-item .sub-n{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--soft); }
  /* Zrcadlo bolístek: věty, ne názvy — sans, menší, bez serifové váhy */
  .mc-mirror .mc-name-item .n{ font-family:var(--sans); font-weight:500; font-size:15px; line-height:1.4; }
  .mc-under{ margin:26px var(--gutter) 0; padding-top:18px; border-top:1px solid var(--border); }
  .mc-under h2{ color:var(--tone); }
  .mc-under p{ color:var(--soft); font-size:14.5px; line-height:1.55; margin:6px 0 12px; }
  .mc-under .mc-chips{ padding:0; }
  .mc-fab-wrap.static{ position:static; padding:16px var(--gutter) 0; background:none; pointer-events:auto; }

  /* ===== LIŠTA „jen nové" / seznam–karty ===== */
  .mc-tools{ display:flex; justify-content:flex-end; gap:6px; padding:12px var(--gutter) 0; }
  .mc-pill{ display:inline-flex; align-items:center; gap:5px; background:none; border:1px solid var(--border); border-radius:999px;
    padding:5px 11px 5px 9px; cursor:pointer; color:var(--muted); font-family:var(--mono); font-size:11px;
    transition:border-color .15s ease,color .15s ease,background .15s ease; }
  .mc-pill svg{ width:14px; height:14px; display:block; }
  @media (hover:hover){ .mc-pill:hover{ color:var(--text); border-color:var(--muted); } }
  .mc-pill.on{ color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .mc-pill.ic{ padding:6px 8px; }
  .mc-pill svg{ width:16px; height:16px; }
  .mc-pill .fc{ background:var(--accent); color:var(--on-accent); font-family:var(--mono); font-size:10px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; }
  .mc-submenu-triplet{ align-items:center; }
  .mc-link{ background:none; border:none; padding:0; margin-top:6px; cursor:pointer; color:var(--accent); font-family:var(--sans); font-size:14px; font-weight:600; text-decoration:underline; text-underline-offset:3px; }

  /* ===== PROUD KARET (swipe) =====
     Horizontální scroll-snap, jedna karta = šířka obrazovky. Výška se váže
     na okno; uvnitř Miowebu je to výška elementu — ověřit v embedu. */
  .mc-swipe-wrap{ padding:12px 0 0; }
  .mc-swipe{ display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; gap:0; height:calc(100vh - 230px); min-height:400px; max-height:720px; }
  .mc-swipe::-webkit-scrollbar{ display:none; }
  .mc-swipe-card{ flex:0 0 100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; display:flex; flex-direction:column;
    padding:4px var(--gutter) 12px; box-sizing:border-box; }
  .mc-swipe-card .sc-body{ position:relative; flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center;
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px 24px 48px; text-align:center; }
  /* Počítadlo a srdíčko dole v rozích — srdíčko blíž palci. */
  .mc-swipe-card .sc-count{ position:absolute; bottom:18px; left:18px; font-family:var(--mono); font-size:11px; color:var(--muted); }
  .mc-swipe-card .sc-body .mc-heart{ top:auto; bottom:9px; right:10px; }
  .mc-swipe-card .sc-body .mc-heart svg{ width:24px; height:24px; }
  .mc-swipe-card .sc-text{ font-family:var(--serif); font-weight:400; color:var(--text); line-height:1.35; letter-spacing:-0.01em; font-variation-settings:'opsz' 36; }
  .mc-swipe-card .sc-text.xl{ font-size:30px; }
  .mc-swipe-card .sc-text.lg{ font-size:24px; }
  .mc-swipe-card .sc-text.md{ font-size:20px; line-height:1.4; }
  .mc-swipe-card .sc-text.sm{ font-size:17px; line-height:1.5; font-variation-settings:'opsz' 24; }
  .mc-swipe-card .sc-meta{ margin-top:18px; font-family:var(--mono); font-size:11px; color:var(--soft); }
  .mc-swipe-card.break .sc-body{ background:var(--surface-2); border-style:dashed; }
  .mc-swipe-card .sc-actions{ display:flex; gap:8px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
  .mc-swipe-card .sc-actions .mc-fab{ width:auto; padding:12px 22px; }
  .mc-fab.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }

  /* ===== MOJE CESTA — oddíly ===== */
  .mc-card-eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--tone); margin-bottom:6px; }
  .mc-card-go{ position:absolute; top:16px; right:16px; font-family:var(--mono); color:var(--soft); font-size:18px; opacity:.5; }
  .mc-sec-link{ display:inline-flex; align-items:center; gap:8px; margin:10px var(--gutter) 0; padding:0; background:none; border:none;
    cursor:pointer; font-family:var(--sans); font-size:13.5px; color:var(--soft); text-align:left; }
  @media (hover:hover){ .mc-sec-link:hover{ color:var(--text); } }
  .mc-sec-link .l{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--tone); }
  .mc-extra{ padding-bottom:0; }
  .mc-extra + .mc-detail-body{ padding-top:0; }

  /* Náročnost — pilulka (nízká / střední / vysoká) */
  .mc-diff{ display:inline-block; padding:3px 10px; border-radius:999px; font-family:var(--sans); font-size:12px; font-weight:600; line-height:1.4; }
  .mc-diff.low{ background:var(--teal-soft); color:var(--teal); }
  .mc-diff.mid{ background:var(--accent-dim); color:var(--accent); }
  .mc-diff.high{ background:var(--accent); color:var(--on-accent); }

  /* Boxy pod taby: řetěz a upozornění (stejný rámeček jako .mc-strip) */
  .mc-box{ margin:10px var(--gutter) 0; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .mc-box .b-head{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px; background:none; border:none; cursor:pointer; text-align:left; }
  .mc-box .b-num{ font-family:var(--mono); font-size:12px; color:var(--accent); background:var(--accent-dim); padding:4px 8px; border-radius:8px; }
  .mc-box .b-text{ flex:1; font-family:var(--sans); font-size:14px; color:var(--text); line-height:1.45; }
  .mc-box .b-chev{ color:var(--soft); display:flex; transition:transform .15s ease; }
  .mc-box .b-chev svg{ width:16px; height:16px; }
  .mc-box.open .b-chev{ transform:rotate(180deg); }
  .mc-box .b-body{ padding:0 16px 14px; border-top:1px solid var(--border); }
  .mc-box .b-title{ font-family:var(--serif); font-weight:600; font-size:16px; font-variation-settings:'opsz' 24; color:var(--text); padding-top:12px; }
  .mc-box .b-hint{ font-family:var(--sans); font-size:13px; color:var(--soft); margin:4px 0 10px; }
  .mc-box .b-list{ margin:0; padding-left:22px; font-family:var(--mono); font-size:12px; color:var(--soft); }
  .mc-box .b-list li{ margin:4px 0; }
  .mc-box .b-list button{ background:none; border:none; padding:0; cursor:pointer; font-family:var(--sans); font-size:14px; color:var(--text); text-align:left; }
  .mc-box .b-list li.cur button{ color:var(--accent); font-weight:600; }
  .mc-warn{ display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .mc-warn .b-ic{ flex-shrink:0; width:30px; height:30px; border-radius:9px; background:var(--accent-dim); color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .mc-warn .b-ic svg{ width:16px; height:16px; }

  /* Příloha cvičení (attachments) — samostatná karta za postupem */
  .mc-attach{ margin:20px var(--gutter) 0; padding:16px 20px; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
  .mc-attach .a-title{ font-family:var(--serif); font-weight:600; font-size:16px; font-variation-settings:'opsz' 24; color:var(--tone); margin-bottom:8px; }
  .mc-attach .mc-md{ font-size:14.5px; }

  /* ===== BACK / DETAIL ===== */
  .mc-back{ display:inline-flex; align-items:center; gap:5px; margin:20px var(--gutter) 0; background:none; border:none;
    padding:0; color:var(--accent); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; transition:opacity .15s ease; }
  @media (hover:hover){ .mc-back:hover{ opacity:.7; } }
  .mc-detail-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px var(--gutter) 2px; }
  .mc-detail-title{ font-family:var(--serif); font-weight:600; font-size:30px; font-variation-settings:'opsz' 72;
    color:var(--tone); letter-spacing:-0.01em; line-height:1.15; }
  .mc-detail-sub{ padding:2px var(--gutter) 2px; color:var(--soft); font-family:var(--mono); font-size:12px; }
  .mc-detail-heart{ flex-shrink:0; background:none; border:none; cursor:pointer; padding:4px; color:var(--muted); transition:transform .12s ease; }
  .mc-detail-heart:active{ transform:scale(.9); }
  .mc-detail-heart svg{ width:24px; height:24px; display:block; }
  .mc-detail-heart .hf{ display:none; color:var(--heart); }
  .mc-detail-heart.on .he{ display:none; }
  .mc-detail-heart.on .hf{ display:block; }
  .mc-detail-meta{ padding:10px var(--gutter) 0; }
  .mc-detail-perex{ padding:10px var(--gutter) 0; font-family:var(--sans); font-size:15px; line-height:1.55; color:var(--soft); }
  .mc-detail-body{ padding:18px var(--gutter) 0; }

  .mc-submenu-triplet{ display:flex; gap:6px; padding:14px var(--gutter) 4px; flex-wrap:wrap; }
  .mc-submenu-triplet button{ background:var(--surface); border:1px solid var(--border); color:var(--soft);
    font-family:var(--sans); font-size:13px; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer; transition:all .15s ease; }
  @media (hover:hover){ .mc-submenu-triplet button:hover{ color:var(--text); } }
  .mc-submenu-triplet button.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  /* ===== CARDS ===== */
  .mc-cards{ padding:20px var(--gutter) 0; list-style:none; }
  /* Karta podle .ex-card z mockupu: měkčí rádius, bez accentového pruhu vlevo
     (ten v mockupu patří jen .journal-card), perex v sans a tlumený. */
  .mc-card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px 50px 18px 20px; margin-bottom:10px; overflow:hidden; }
  .mc-card.clickable{ cursor:pointer; transition:border-color .15s ease,background .15s ease; }
  @media (hover:hover){ .mc-card.clickable:hover{ border-color:var(--accent); background:var(--surface-2); } }
  .mc-card-title{ font-family:var(--serif); font-weight:600; font-size:18px; font-variation-settings:'opsz' 24;
    letter-spacing:-0.01em; color:var(--text); line-height:1.25; margin-bottom:6px; }
  .mc-card-text{ font-family:var(--sans); font-size:14.5px; line-height:1.55; color:var(--soft); }
  /* Citát je display text, ne perex — zůstává ve Fraunces. */
  .mc-card-text.lead{ font-family:var(--serif); font-weight:400; font-size:17px; line-height:1.5;
    font-variation-settings:'opsz' 24; color:var(--text); }
  .mc-card-author{ margin-top:9px; font-family:var(--sans); font-size:12.5px; color:var(--accent); }
  .mc-card-author .yr{ color:var(--soft); }
  .mc-card .mc-tag-row{ margin-top:10px; }
  .mc-card-meta{ margin-top:9px; font-family:var(--mono); font-size:11px; color:var(--soft); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .mc-card-meta:empty{ display:none; }
  .mc-card-meta .m{ display:inline-flex; align-items:center; gap:4px; }
  .mc-card-meta svg{ width:12px; height:12px; }
  .mc-card.read .mc-card-title{ color:var(--soft); }

  .mc-heart{ position:absolute; top:12px; right:11px; background:none; border:none; cursor:pointer; padding:5px; transition:transform .12s ease; }
  .mc-heart:active{ transform:scale(.9); }
  .mc-heart svg{ width:22px; height:22px; display:block; transition:all .12s ease; }
  .mc-heart .he{ color:var(--muted); }
  .mc-heart .hf{ color:var(--heart); display:none; }
  .mc-heart.on .he{ display:none; }
  .mc-heart.on .hf{ display:block; }

  /* ===== TABBAR (Postup / Info) =====
     Dřív rozbalovací toggle „▸ K čemu to je". Mockup má dva taby, aktivní
     s tmavým pozadím; Info nese tečku, že tam něco je. */
  .mc-tabbar{ display:flex; gap:6px; padding:18px var(--gutter) 4px; }
  .mc-tab{ flex:1; text-align:center; padding:11px 0; border-radius:12px; border:none; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:600; color:var(--soft); background:transparent;
    transition:background .15s ease,color .15s ease; }
  @media (hover:hover){ .mc-tab:hover{ color:var(--text); } }
  .mc-tab.active{ background:var(--text); color:var(--bg); }
  .mc-tab .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent);
    margin-left:5px; vertical-align:middle; }
  .mc-tab.active .dot{ background:var(--bg); }

  /* ===== DURATION STRIP ===== */
  .mc-strip{ display:flex; align-items:center; gap:10px; margin:16px var(--gutter) 0; padding:14px 16px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .mc-strip .s-ic{ flex-shrink:0; width:34px; height:34px; border-radius:10px; background:var(--accent-dim);
    color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .mc-strip .s-ic svg{ width:16px; height:16px; }
  .mc-strip .s-label{ font-family:var(--sans); font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); font-weight:600; margin-bottom:1px; }
  .mc-strip .s-value{ font-family:var(--sans); font-size:14px; font-weight:600; color:var(--text); }
  /* Box náročnosti: vlevo řádky Trvání / Praxe, vpravo pilulka náročnosti */
  .mc-strip .s-rows{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mc-strip .s-rows > div{ display:flex; gap:8px; align-items:baseline; }
  .mc-strip .s-rows .s-label{ margin:0; min-width:56px; }
  .mc-strip .s-diff{ text-align:right; flex-shrink:0; }
  .mc-strip .s-diff .s-label{ margin-bottom:4px; }

  /* ===== JOURNAL CARD (Zápis do deníku) =====
     Reflexe po cvičení — odlišená teal kartou (klidová/čtecí barva) proti
     červenému postupu. Vzor z mockupu exercise.html. */
  .mc-journal{ margin:28px var(--gutter) 0; padding:18px 20px; background:var(--surface-2);
    border:1px solid var(--border); border-left:3px solid var(--teal); border-radius:16px; }
  .mc-journal-eyebrow{ display:flex; align-items:center; gap:7px; font-family:var(--sans);
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--teal); margin-bottom:12px; }
  .mc-journal-eyebrow svg{ width:15px; height:15px; }
  .mc-journal .mc-md{ font-size:15px; }
  .mc-journal .mc-md ul > li::before{ background:var(--teal); }

  /* Odkaz na plné znění článku na blogu. Ukazuje se jen u článků se
     `show_link: true`, tedy tam, kde je pro appku zkráceno víc než 20 %.
     Záměrně tichý — vede pryč z appky, nemá soupeřit s obsahem. */
  .mc-source{ margin:30px var(--gutter) 0; padding-top:16px; border-top:1px solid var(--border); }
  .mc-source a{ display:inline-flex; align-items:center; gap:7px; font-family:var(--sans);
    font-size:14px; color:var(--muted); text-decoration:none; }
  @media (hover:hover){ .mc-source a:hover{ color:var(--tone); } }
  .mc-source svg{ width:14px; height:14px; flex:none; }

  /* ===== MARKDOWN ===== */
  .mc-md{ font-family:var(--sans); font-size:15.5px; line-height:1.65; color:var(--body); }
  .mc-md h2,.mc-md h3,.mc-md h4{ font-family:var(--serif); font-weight:600; color:var(--tone); line-height:1.25; letter-spacing:-0.01em; }
  .mc-md h2{ font-size:20px; margin:30px 0 14px; font-variation-settings:'opsz' 36; }
  .mc-md h3{ font-size:17px; margin:24px 0 11px; font-variation-settings:'opsz' 24; }
  .mc-md h4{ font-size:15px; margin:20px 0 9px; font-family:var(--sans); font-weight:700; color:var(--text); }
  .mc-md > :first-child{ margin-top:0; }
  .mc-md p{ margin:0 0 13px; }
  .mc-md ul,.mc-md ol{ margin:0 0 14px; padding-left:22px; }
  .mc-md ul{ list-style:none; } .mc-md ol{ list-style:decimal; }
  .mc-md ul > li{ position:relative; }
  .mc-md ul > li::before{ content:''; position:absolute; left:-15px; top:0.62em;
    width:5px; height:5px; border-radius:50%; background:var(--tone); }
  .mc-md li{ margin-bottom:6px; padding-left:3px; }
  .mc-md ol > li{ margin-bottom:14px; }

  /* ===== KROKY =====
     Mockup má kroky jako kruh s číslem + vertikální linka. Data jsou ale
     markdown s číslovaným seznamem, ne strukturovaná pole — datový model se
     nesahá. Kroky se proto skládají z <ol>, který renderer už vyrábí:
     counter dělá číslo, ::before kruh, ::after linku k dalšímu kroku.
     Platí jen na vnořené úrovni 0 (.mc-steps > ol), aby vnitřní seznamy
     zůstaly normální odrážky. */
  .mc-steps > ol{ list-style:none; padding-left:0; counter-reset:mcstep; margin:0; }
  .mc-steps > ol > li{ position:relative; padding-left:48px; padding-bottom:22px; margin-bottom:0;
    counter-increment:mcstep; }
  .mc-steps > ol > li::before{ content:counter(mcstep); position:absolute; left:0; top:-4px;
    width:34px; height:34px; border-radius:50%; background:var(--surface); border:1.5px solid var(--accent);
    color:var(--accent); display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:600; font-size:15px; font-variation-settings:'opsz' 24; z-index:1; }
  .mc-steps > ol > li:not(:last-child)::after{ content:''; position:absolute; left:17px; top:34px; bottom:0;
    width:1px; background:var(--border); }
  .mc-steps > ol > li > strong:first-child{ display:block; font-family:var(--sans); font-size:16px;
    font-weight:600; color:var(--text); line-height:1.3; margin-bottom:6px; }
  .mc-steps > ol > li ul{ margin-top:6px; margin-bottom:0; color:var(--soft); font-size:14.5px; }
  .mc-steps > ol > li ul li::marker{ color:var(--muted); }
  .mc-md li > ul,.mc-md li > ol{ margin:7px 0 0; }
  .mc-md li > ul{ list-style:circle; }
  .mc-md li::marker{ color:var(--accent); }
  .mc-md strong{ color:var(--text); font-weight:700; }
  .mc-md strong.mc-tel{ color:var(--tone); }
  .mc-md em{ color:var(--soft); font-style:italic; }

  /* ===== FAVORITES ===== */
  .mc-fav-group{ padding:6px var(--gutter) 0; }
  .mc-fav-group h2{ font-family:var(--serif); font-size:18px; font-weight:400; color:var(--text); margin:18px 0 8px;
    display:flex; align-items:center; gap:8px; }
  .mc-fav-group h2 .c{ color:var(--soft); font-family:var(--mono); font-weight:600; font-size:12px; }
  .mc-empty{ text-align:center; padding:60px 32px; color:var(--soft); line-height:1.7; font-size:14px; }
  .mc-empty .e-ic{ font-size:34px; opacity:.4; margin-bottom:12px; }

  .mc-more-page{ width:calc(100% - 36px); margin:4px 18px 0; padding:12px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--sans); font-size:13px;
    font-weight:600; cursor:pointer; transition:border-color .15s ease; }
  @media (hover:hover){ .mc-more-page:hover{ border-color:var(--accent); } }

  /* ===== ABOUT ===== */
  .mc-about{ padding:14px var(--gutter) 0; font-family:var(--serif); font-size:16.5px; line-height:1.7; color:var(--body); }
  .mc-about p{ margin:0 0 14px; }
  .mc-about strong{ color:var(--text); }

  @keyframes mcIn{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  .mc-in{ animation:mcIn .2s ease forwards; }
  @keyframes mcFade{ from{opacity:0;} to{opacity:1;} }
  @keyframes mcSlide{ from{transform:translateX(-100%);} to{transform:translateX(0);} }

  function loadUser(){
    var u=emptyUser();
    try{ var d=JSON.parse(localStorage.getItem(STORE_KEY));
      if(d&&typeof d==="object"){
        FAV_STORES.forEach(function(s){ if(Array.isArray(d.favorites&&d.favorites[s])) u.favorites[s]=d.favorites[s]; });

  // neviděných; když dojdou všechny, kolo se restartuje.
  // Lokální datum, ne UTC — jinak by se citát měnil ve dvě ráno.
  function today(){
    var d=new Date();
    return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  }
  function dailyInspiration(){
    var all=(DB&&DB.inspirations)||[];
    if(!all.length) return null;
    var d=USER.daily, t=today();
    if(d&&d.date===t){
      var cur=(itemIndex.inspirations||{})[d.id];
      if(cur) return cur;   // položka mohla zmizet z dat → přelosuje se
    }
    var seen=(d&&Array.isArray(d.seen))?d.seen:[];
    var pool=all.filter(function(x){ return seen.indexOf(x.id)<0; });
    if(!pool.length){ seen=[]; pool=all.slice(); }
    var pick=pool[Math.floor(Math.random()*pool.length)];
    USER.daily={ date:t, id:pick.id, seen:seen.concat([pick.id]) };
    saveUser();
    return pick;
  }

  // ===================== TÉMA =====================
  // Volba přežívá v localStorage; dokud si uživatel nevybere, jede se podle
  // systému. data-theme se píše na #mc-root, ne na <html> — uvnitř Miowebu
  // nad ním nemáme kontrolu.
  var THEME_KEY="mc_theme";
  function theme(){
    var t; try{ t=localStorage.getItem(THEME_KEY); }catch(e){}
    if(t==="light"||t==="dark") return t;
    try{ if(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches) return "light"; }catch(e){}
    return "dark";
  }
  function applyTheme(){
    var t=theme(), root=document.getElementById("mc-root");
    if(root) root.setAttribute("data-theme",t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t==="light"?"#F6F1E7":"#1C1914");
  }
  function favCount(){ return FAV_STORES.reduce(function(n,s){ return n+USER.favorites[s].length; },0); }
  function isFav(store,id){ return USER.favorites[store].indexOf(id)>-1; }
  function toggleFav(store,id){ var a=USER.favorites[store],i=a.indexOf(id); if(i>-1)a.splice(i,1); else { a.push(id); markSeen(store,id); } saveUser(); }
  // Paměť „viděl jsem" — plní se JEN ve swipe módu (karta na obrazovce =
  // přečtená) a srdíčkem. Seznam ji jen čte: při „jen nové" filtruje, nikdy
  // nepíše — proscrollovat 50 karet není vidět je.
  function isSeen(store,id){ return (USER.seen[store]||[]).indexOf(id)>-1; }
  function markSeen(store,id){ var a=USER.seen[store]=USER.seen[store]||[]; if(a.indexOf(id)<0){ a.push(id); saveUser(); } }
  function unseenOnly(store,items){ return USER.onlyNew?items.filter(function(it){ return !isSeen(store,it.id); }):items; }
  // Seznam / karty — vkus, ne kontext: globální volba v localStorage.
  var VIEW_KEY="mc_view";
  function viewMode(){ var v; try{ v=localStorage.getItem(VIEW_KEY); }catch(e){} return v==="swipe"?"swipe":"list"; }
  function isRead(id){ return USER.read.indexOf(id)>-1; }
  function markRead(id){ if(USER.read.indexOf(id)<0){ USER.read.push(id); saveUser(); } }
  function newsTotal(){ return 0; }

  // ===================== NAČTENÍ =====================
  function load(){
    var keys=Object.keys(FILES);
    Promise.all(keys.map(function(k){
      return fetch(MC_BASE+FILES[k],{cache:"no-cache"}).then(function(r){ if(!r.ok) throw new Error(FILES[k]+" → HTTP "+r.status); return r.json(); });
    })).then(function(arrs){
      DB={}; keys.forEach(function(k,i){ DB[k]=arrs[i]; });
      prepare(); render();
    }).catch(showError);
  }

  function prepare(){
    DB.clusters.forEach(function(c){ clusterName[c.id]=c.name; clusterSort[c.id]=c.sort_order; });
    TYPES.forEach(function(t){
      byCluster[t.key]={}; itemIndex[t.key]={};
      (DB[t.key]||[]).forEach(function(it){
        (byCluster[t.key][it.cluster_id]=byCluster[t.key][it.cluster_id]||[]).push(it);
        itemIndex[t.key][it.id]=it;
      });
      Object.keys(byCluster[t.key]).forEach(function(cid){ byCluster[t.key][cid].sort(function(a,b){ return a.sort_order-b.sort_order; }); });
    });
    contentClusters=Object.keys(byCluster.reframings);
    Object.keys(CONTENT).forEach(function(key){
      var dk=CONTENT[key].dataKey;
      flat[dk]=(DB[dk]||[]).slice().sort(function(a,b){ return a.sort_order-b.sort_order; });
      itemIndex[dk]={}; flat[dk].forEach(function(it){ itemIndex[dk][it.id]=it; });
    });
    // Oddíly a řetězy (Moje cesta). sort_order cvičení je lokální per oddíl,
    // chain_order per řetěz — proto dva samostatné indexy.
    ["sections","chains","fears","situations","pains"].forEach(function(dk){
      flat[dk]=(DB[dk]||[]).slice().sort(function(a,b){ return a.sort_order-b.sort_order; });
      itemIndex[dk]={}; flat[dk].forEach(function(it){ itemIndex[dk][it.id]=it; });
    });
    itemIndex.hlasky={};
    (DB.pains||[]).forEach(function(p){ (p.hlasky||[]).forEach(function(x,i){ itemIndex.hlasky[p.id+":"+i]={ id:p.id+":"+i, text:x.text, meta:p.text }; }); });
    bySection={}; byChain={};
    (DB.exercises||[]).forEach(function(e){
      if(e.section_id) (bySection[e.section_id]=bySection[e.section_id]||[]).push(e);
      if(e.chain_id) (byChain[e.chain_id]=byChain[e.chain_id]||[]).push(e);
    });
    Object.keys(bySection).forEach(function(k){ bySection[k].sort(function(a,b){ return a.sort_order-b.sort_order; }); });
    Object.keys(byChain).forEach(function(k){ byChain[k].sort(function(a,b){ return (a.chain_order||0)-(b.chain_order||0); }); });
  }

  function showError(err){
    document.getElementById("mc-root").innerHTML=
      '<div class="mc-error"><strong>Data se nepodařilo načíst.</strong><br><br>'+
      'JSONy se čtou relativně z <code>data/</code>. Spusť appku přes lokální '+
      'server v kořeni repa, ne otevřením souboru z disku.<br><br><span style="opacity:.6">Detail: '+esc(String(err&&err.message||err))+'</span></div>';
  }

  // ===================== POMOCNÉ =====================
  function esc(s){ var d=document.createElement("div"); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
  function deburr(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
  function minutes(n){ return '<span class="m">'+IC.clock+(n||0)+' min</span>'; }
  // Tag pilulky. V kartách seznamu se řada ořezává (limit), ať karta nenaroste
  // do plotu — v detailu se ukazují všechny.
  function tagRow(tags,limit){
    if(!tags||!tags.length) return "";
    var show=limit?tags.slice(0,limit):tags, rest=limit?tags.length-show.length:0;
    var h='<div class="mc-tag-row">';
    show.forEach(function(t){ h+='<span class="mc-tag">'+esc(t)+'</span>'; });
    if(rest>0) h+='<span class="mc-tag more">+'+rest+'</span>';
    return h+'</div>';
  }
  function timeTag(n){ return '<span class="mc-tag time">'+IC.clock+(n||0)+' min</span>'; }

  // ===================== MARKDOWN ===================== (identický s produkcí)
  function mdInline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,function(_,t){
    // Bold, který je čistě telefonní číslo (číslice a mezery, ≥3 cifry),
    // dostane tón sekce — telefonní čísla v krizovce mají vyčnívat červeně.
    return /^[\d\s]+$/.test(t)&&(t.replace(/\D/g,"").length>=3) ? '<strong class="mc-tel">'+t+'</strong>' : '<strong>'+t+'</strong>';
  }).replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>"); }
  // Těla v datech začínají nadpisem, který opakuje název položky — ten je ale
  // už v titulku detailu, takže by se název ukázal dvakrát pod sebou.
  // Zahodíme první nadpis, jen když se s názvem shoduje.
  function stripDupHeading(src,title){
    if(!src||!title) return src;
    var norm=function(s){ return deburr(String(s).replace(/[*_`#]/g,"")).trim(); };
    var lines=String(src).split(/\r?\n/), i=0;
    while(i<lines.length && !lines[i].trim()) i++;
    var m=lines[i]&&lines[i].trim().match(/^#{1,6}\s+(.*)$/);
    if(m && norm(m[1])===norm(title)) return lines.slice(i+1).join("\n");
    return src;
  }

  // Oddělí závěrečný blok "## Zápis do deníku" z těla cvičení — renderuje se
  // jako samostatná journal-card (teal), ne jako běžný nadpis. Vrací tělo bez
  // něj a obsah deníku (řádky za nadpisem).
  function splitJournal(src){
    if(!src) return { body:src, journal:null };
    var lines=String(src).split(/\r?\n/);
    for(var i=0;i<lines.length;i++){
      var m=lines[i].trim().match(/^#{1,6}\s+(.*)$/);
      if(m && deburr(m[1]).indexOf("zapis do deniku")>-1){
        return { body:lines.slice(0,i).join("\n").replace(/\s+$/,""), journal:lines.slice(i+1).join("\n").trim() };
      }
    }
    return { body:src, journal:null };
  }

  function md(src){
    var lines=String(src||"").split(/\r?\n/), out=[], para=[], stack=[];
    function flushPara(){ if(para.length){ out.push("<p>"+para.map(mdInline).join("<br>")+"</p>"); para=[]; } }
    function closeList(){ out.push("</li></"+stack.pop().tag+">"); }
    function closeLists(){ while(stack.length) closeList(); }
    // Otevírací značka seznamu. U <ol> respektuje číslo prvního zdrojového
    // kroku: vícefázový postup (cv 49) má fáze oddělené podnadpisem, takže
    // vznikne druhý <ol>, který by jinak začal znovu od 1. Kromě atributu
    // start se musí přenastavit i CSS counter — kolečka kroků kreslí on.
    function openTag(tag,num){
      if(tag==="ol" && num>1) return '<ol start="'+num+'" style="counter-reset:mcstep '+(num-1)+'">';
      return "<"+tag+">";
    }
    function item(indent,tag,text,num){
      flushPara();
      while(stack.length && indent<stack[stack.length-1].indent) closeList();
      var top=stack[stack.length-1];
      if(!stack.length || indent>top.indent){ out.push(openTag(tag,num)); stack.push({tag:tag,indent:indent}); }
      else{ out.push("</li>"); if(top.tag!==tag){ out.push("</"+stack.pop().tag+">"); out.push(openTag(tag,num)); stack.push({tag:tag,indent:indent}); } }
      out.push("<li>"+text);
    }
    lines.forEach(function(raw){
      var line=raw.replace(/\t/g,"    "), m; var indent=line.match(/^ */)[0].length; line=line.trim();
      if(!line){ flushPara(); return; }
      if((m=line.match(/^(#{1,6})\s+(.*)$/))){ flushPara(); closeLists(); var lvl=Math.min(Math.max(m[1].length,2),4); out.push("<h"+lvl+">"+mdInline(m[2])+"</h"+lvl+">"); return; }
      if((m=line.match(/^[-*]\s+(.*)$/))){ item(indent,"ul",mdInline(m[1])); return; }
      if((m=line.match(/^(\d+)[.)]\s+(.*)$/))){ item(indent,"ol",mdInline(m[2]),parseInt(m[1],10)); return; }
      // Odsazený řádek, který není odrážka, pokračuje poslední položkou seznamu
      // (zalomí se v ní). Bez toho by seznam ukončil a text vypadl do odstavce.
      if(stack.length && indent>0 && para.length===0){ out.push("<br>"+mdInline(line)); return; }
      closeLists(); para.push(line);
    });
    flushPara(); closeLists(); return out.join("");
  }

  // ===================== PŘERÁMOVÁNÍ — pocity + interleaving =====================
  function mainFeelings(){ return DB.feelings.filter(function(f){ return contentClusters.indexOf(f.cluster_id)>-1 && f.main && f.main!=="0"; }); }
  function secondaryFeelings(){ return DB.feelings.filter(function(f){ return contentClusters.indexOf(f.cluster_id)>-1 && (!f.main||f.main==="0"); }); }
  function visibleFeelings(){
    var rf=state.rf, list=mainFeelings().concat(rf.showSecondary?secondaryFeelings():[]);
    if(rf.search.trim()){ list=mainFeelings().concat(secondaryFeelings()); var q=deburr(rf.search); list=list.filter(function(f){ return deburr(f.name).indexOf(q)>-1; }); }
    list.sort(function(a,b){ return a.sort_order-b.sort_order; }); return list;
  }
  function interleave(typeKey,cwc){
    var counts={},ids=[]; cwc.forEach(function(c){ counts[c.cluster_id]=c.count; ids.push(c.cluster_id); });
    ids.sort(function(a,b){ if(counts[b]!==counts[a]) return counts[b]-counts[a]; return (clusterSort[a]||0)-(clusterSort[b]||0); });
    var lists={},pos={}; ids.forEach(function(cid){ lists[cid]=byCluster[typeKey][cid]||[]; pos[cid]=0; });
    var seen={},merged=[];
    function exhausted(){ return ids.every(function(cid){ return pos[cid]>=lists[cid].length; }); }
    while(!exhausted()){ ids.forEach(function(cid){ var e=0; while(e<counts[cid]&&pos[cid]<lists[cid].length){ var it=lists[cid][pos[cid]]; pos[cid]++; if(seen[it.id])continue; seen[it.id]=1; merged.push(it); e++; } }); }
    return merged;
  }
  function currentRfList(){
    var rf=state.rf;
    if(rf.detailMode==="single"){ var cid=rf.detailClusters[0].cluster_id; return (byCluster[rf.activeType][cid]||[]).slice(); }
    return interleave(rf.activeType,rf.detailClusters);
  }
  function storeOf(typeKey){ for(var i=0;i<TYPES.length;i++){ if(TYPES[i].key===typeKey) return TYPES[i].store; } }

  // ===================== FILTR obsahových sekcí =====================
  function allTags(dataKey){
    var set={}; (flat[dataKey]||[]).forEach(function(it){ (it.tags||[]).forEach(function(t){ set[t]=1; }); });
    return Object.keys(set).sort();
  }
  // Váha tagu podle pozice v datech (tagy jsou v JSONu seřazené podle priority,
  // první nese téma, 2.–3. váhu, zbytek je tie-break). Jediná laditelná
  // konstanta filtru; lineární je bezpečný start, strmější ([8,5,3,2,1,1])
  // by nechal dominovat první tag.
  var TAG_VAHY=[6,5,4,3,2,1];
  function tagScore(it,sel){
    var t=it.tags||[], score=0, hits=0;
    sel.forEach(function(tag){ var p=t.indexOf(tag); if(p>-1){ score+=TAG_VAHY[Math.min(p,TAG_VAHY.length-1)]; hits++; } });
    return {score:score, hits:hits};
  }
  function durationBuckets(){ return [ {label:"do 5 min",max:5}, {label:"6–15 min",min:6,max:15}, {label:"16+ min",min:16} ]; }
  function activeFilterCount(key){ var s=secState(key), n=0; if(s.kw.trim())n++; n+=s.tags.length; n+=s.durs.length; return n; }
  function contentList(key){
    var cfg=CONTENT[key], s=secState(key), items=(flat[cfg.dataKey]||[]).slice();
    if(s.favOnly) items=items.filter(function(it){ return isFav(cfg.store,it.id); });
    if(s.mode==="edit" && cfg.redakce){ items=items.filter(function(it){ return it.quality===5; }); shuffle(items); }
    else { items.sort(function(a,b){ return String(b.added_at||"").localeCompare(String(a.added_at||"")) || b.sort_order-a.sort_order; }); }
    if(s.kw.trim()){
      var q=deburr(s.kw);
      items=items.filter(function(it){ var hay=deburr([it.title,it.name,it.text,it.perex].filter(Boolean).join(" ")); return hay.indexOf(q)>-1; });
    }
    // Tagy se sčítají (OR): víc zaškrtnutých = širší výběr, ne užší. Dřív AND,
    // což u pár tagů vracelo skoro vždycky prázdno. OR říká CO projde; pořadí
    // pak určuje priorita tagů v datech (první tag = téma položky) — viz tagScore.
    if(s.tags.length){
      items=items.map(function(it){ return {it:it, sc:tagScore(it,s.tags)}; })
        .filter(function(x){ return x.sc.score>0; })
        .sort(function(a,b){ return b.sc.score-a.sc.score || b.sc.hits-a.sc.hits
          || String(b.it.added_at||"").localeCompare(String(a.it.added_at||"")) || String(a.it.id).localeCompare(String(b.it.id)); })
        .map(function(x){ return x.it; });
    }
    // Délky se sčítají (OR) stejně jako tagy — položka projde, když padne do
    // kteréhokoli zaškrtnutého pásma.
    if(s.durs.length && cfg.timeField){
      var bs=s.durs.map(function(i){ return durationBuckets()[i]; });
      items=items.filter(function(it){ var v=it[cfg.timeField]||0;
        return bs.some(function(b){ return (b.min==null||v>=b.min)&&(b.max==null||v<=b.max); }); });
    }
    return items;
  }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  // ===================== RENDER — obal =====================
  function render(){
    var root=document.getElementById("mc-root");
    // Tón podle otevřené sekce; na home a v detailu se drží tón té sekce,
    // odkud se přišlo. Home sama je neutrální (accent).
    var cur=sectionByKey(state.page==="favorites"?"favorites":state.section);
    root.setAttribute("data-tone",(cur&&cur.tone)||"accent");
    // Úvodka se roztahuje na výšku okna, aby dlaždice vyplnily zbytek plochy
    // pod citátem — ten má proměnnou délku, takže se to musí počítat samo.
    root.setAttribute("data-page",(!state.detail&&state.page==="home")?"home":"");
    var h=viewTopbar();
    if(state.detail){ h+=viewContentDetail(); }
    else if(state.page==="home"){ h+=viewHome(); }
    else if(state.page==="favorites"){ h+=viewFavorites(); }
    else {
      var sec=sectionByKey(state.section);
      if(sec&&sec.kind==="reframing") h+=viewReframing();
      else if(sec&&sec.kind==="journey") h+=viewJourney();
      else if(sec&&sec.kind==="favorites") h+=viewFavorites();
      else if(sec&&sec.kind==="about") h+=viewAbout();
      else if(sec&&sec.kind==="content") h+=viewContent(sec.key);
      else h+='<div class="mc-empty">—</div>';
    }
    if(state.menuOpen) h+=viewMenu();
    root.innerHTML=h;
    bindSwipe();
    var s=document.getElementById("mc-search");
    if(s){ var v=(state.section==="reframing")?state.rf.search:(secState(state.section||"").search); if(v){ s.value=v; } }
  }

  function viewTopbar(){
    // Plné jen v Oblíbených — „máš něco uloženo" nikomu nic neříkalo.
    var favOn=state.page==="favorites", nt=newsTotal();
    var h='<div class="mc-topbar">';
    h+='<button class="mc-icon-btn" onclick="MC.menu(true)" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>'+(nt>0?'<span class="mc-topbadge">'+nt+'</span>':'')+'</button>';
    h+='<div class="mc-topbar-title" onclick="MC.home()">Moje <span class="mc-mark">cesta</span></div>';
    h+='<button class="mc-icon-btn mc-heart-top '+(favOn?"on":"")+' '+(state.page==="favorites"?"active":"")+'" onclick="MC.open(\'favorites\')" aria-label="Oblíbené"><svg class="he" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><svg class="hf" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>';
    h+='</div>'; return h;
  }

  function viewMenu(){
    var h='<div class="mc-menu-backdrop" onclick="MC.menu(false)"></div><nav class="mc-menu">';
    h+='<div class="mc-menu-head"><h2 onclick="MC.home()">Moje <span class="mc-mark">cesta</span></h2><button class="mc-icon-btn" onclick="MC.menu(false)" aria-label="Zavřít"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>';
    // Menu = registr v pořadí, linky podle `sep`; přepínač režimu před O appce.
    var lightNow=theme()==="light";
    SECTIONS.forEach(function(s){
      if(s.sep) h+='<div class="mc-menu-sep"></div>';
      if(s.kind==="about") h+='<button class="mc-menu-item" onclick="MC.theme()"><span class="mi-ic">'+(lightNow?IC.moon:IC.sun)+'</span><span class="mi-label">'+(lightNow?"Tmavý režim":"Světlý režim")+'</span></button>';
      var active=s.kind==="favorites"?state.page==="favorites":(state.page==="section"&&state.section===s.key);

      h+='<button class="mc-menu-item '+(active?"active":"")+'" onclick="MC.open(\''+s.key+'\')"><span class="mi-ic">'+IC[s.icon]+'</span><span class="mi-label">'+esc(s.label)+'</span>'+badge+'</button>';
    });

  function viewHome(){
    var insp=dailyInspiration();
    var h='<div class="mc-home-intro"><h1>Dnešní inspirace</h1>';

    if(insp) h+='<p class="mc-daily">„'+esc(insp.text)+'“</p>';
    h+='</div><div class="mc-tiles">';

    });

  // ===================== RENDER — Přerámování =====================
  function viewReframing(){
    var v=state.rf.view;
    if(v==="detail") return viewRfDetail();
    if(v==="feelings") return viewRfFeelings();
    if(v==="fears") return viewRfFears();
    if(v==="fearGroup") return viewRfFearGroup();
    if(v==="situation") return viewRfSituation();
    if(v==="pains") return viewRfPains();
    if(v==="pain") return viewRfPain();
    return viewRfGates();
  }
  // Rozcestník tří bran. Názvy samy o sobě uživatel v akutním módu
  // nerozliší — každá nese větu „kdy sem".
  function viewRfGates(){
    var n=favCountOf(RF_STORES);
    var h=secHead("reframing","Přerámování","Pojmenujte, co se s vámi děje — a podívejte se na to jinak.",n);
    // Uložená přerámování jsou napříč klastry — jeden seznam po typech.
    if(secState("reframing").favOnly) return h+(n?favGroups(RF_STORES):favEmpty());
    h+='<ul class="mc-cards mc-gates">';
    GATES.forEach(function(g){
      h+='<li class="mc-card clickable mc-in" onclick="MC.rfGate(\''+g.key+'\')"><div class="mc-card-title">'+esc(g.label)+'</div><div class="mc-card-text lead gate-hint">„'+esc(g.hint)+'“</div><span class="mc-card-go">›</span></li>';
    });
    return h+'</ul>';
  }
  function searchBox(placeholder,handler,value){
    var h='<div class="mc-search-wrap"><svg class="mc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
    h+='<input id="mc-search" class="mc-search" placeholder="'+esc(placeholder)+'" oninput="MC.'+handler+'(this.value)" onkeydown="MC.searchKey(event)">';
    if(value&&value.trim()) h+='<div class="mc-search-tools"><button class="mc-search-clear" onclick="MC.'+handler+'(\'\')" aria-label="Zrušit hledání"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>';

  // ---- Brána Strachy: Konkrétní (situace) / Jádrové (kanon) → kategorie → položky
  function groupsOf(list){ var seen={},out=[]; list.forEach(function(x){ if(!seen[x.group]){ seen[x.group]=1; out.push(x.group); } }); return out; }
  function fearMatches(q,x){ return deburr(x.name).indexOf(q)>-1 || (x.aliases||[]).some(function(a){ return deburr(a).indexOf(q)>-1; }); }
  function viewRfFears(){
    var rf=state.rf, h='<button class="mc-back" onclick="MC.rfGate(null)">← Přerámování</button>';
    h+='<div class="mc-sec-head"><h1>Strachy</h1><p>Čeho se bojíte? Vyberte konkrétní situaci, nebo rovnou jádrový strach.</p></div>';
    h+=searchBox("Hledejte strach…","rfFearSearch",rf.fearSearch);
    if(rf.fearSearch.trim()){
      // Hledání jde napříč oběma vrstvami i skrytou skupinou; aliasy se hledají, nezobrazují.
      var q=deburr(rf.fearSearch);
      var sits=flat.situations.filter(function(x){ return fearMatches(q,x); });
      var fears=flat.fears.filter(function(x){ return fearMatches(q,x); });
      if(!sits.length&&!fears.length) return h+'<div class="mc-empty">Nic neodpovídá hledání.</div>';
      if(sits.length) h+='<div class="mc-fav-group"><h2>Konkrétní strachy <span class="c">'+sits.length+'</span></h2>'+nameList(sits,function(it){ return "MC.rfSituation('"+it.id+"')"; })+'</div>';
      if(fears.length) h+='<div class="mc-fav-group"><h2>Jádrové strachy <span class="c">'+fears.length+'</span></h2>'+nameList(fears,function(it){ return "MC.rfFear('"+it.id+"')"; })+'</div>';
      return h;
    }
    h+='<div class="mc-submenu-triplet">';
    h+='<button class="'+(rf.fearsTab==="situations"?"active":"")+'" onclick="MC.rfFearsTab(\'situations\')">Konkrétní strachy</button>';
    h+='<button class="'+(rf.fearsTab==="fears"?"active":"")+'" onclick="MC.rfFearsTab(\'fears\')">Jádrové strachy</button>';
    h+='</div>';
    var list=rf.fearsTab==="situations"?flat.situations:flat.fears.filter(function(x){ return x.group!==FEAR_HIDDEN_GROUP; });
    var groups=groupsOf(list);
    h+='<div class="mc-namelist">';
    groups.forEach(function(g){
      var n=list.filter(function(x){ return x.group===g; }).length;
      h+='<button class="mc-name-item mc-in" onclick="MC.rfFearGroup(\''+esc(g).replace(/'/g,"\\'")+'\')"><span class="n">'+esc(g)+'</span><span class="sub-n">'+n+'</span><span class="go">›</span></button>';
    });
    return h+'</div>';
  }
  function viewRfFearGroup(){

  // Situace: podle mark P (přerámování) / E (empatie) / K (Krizovka), pod tím

  // ===================== RENDER — Moje cesta (oddíly) =====================
  // Cvičebnice po oddílech. Oddíly 01–03 jsou jen text (theory), 04–11 mají
  // submenu Cvičení / Info / Teorie / Praxe — výchozí Cvičení (kdo otevře
  // oddíl, chce cvičit; teorii si klikne). Tab se kreslí jen když má obsah.
  var JOURNEY_TABS=[ {key:"exercises",label:"Cvičení"}, {key:"info",label:"Info"}, {key:"theory",label:"Teorie"}, {key:"practice",label:"Praxe"} ];
  function viewJourney(){ return state.journey.sectionId?viewJourneySection():viewJourneyList(); }
  function viewJourneyList(){
    var favs=USER.favorites.exercises;
    var h=secHead("journey","Moje cesta","Cvičebnice krok za krokem — oddíly, jejich cvičení, teorie a praxe.",favs.length);
    if(secState("journey").favOnly){
      // Uložená cvičení s oddílem jako meta — druhé dveře k témuž jako v Cvičení.
      var exs=favs.slice().reverse().map(function(id){ return itemIndex.exercises[id]; }).filter(Boolean);
      if(!exs.length) return h+favEmpty();
      return h+nameList(exs,function(e){ return "MC.detail('exercises','"+e.id+"')"; },function(e){ var s=itemIndex.sections[e.section_id]; return s?'<span class="m">Oddíl '+("0"+s.sort_order).slice(-2)+' · '+esc(s.title)+'</span>':""; });
    }
    h+='<ul class="mc-cards">';
    flat.sections.forEach(function(s){
      var n=(bySection[s.id]||[]).length;
      h+='<li class="mc-card clickable mc-in" onclick="MC.journeySection(\''+s.id+'\')">';
      h+='<div class="mc-card-eyebrow">'+("0"+s.sort_order).slice(-2)+'</div>';
      h+='<div class="mc-card-title">'+esc(s.title)+'</div>';
      if(s.perex) h+='<div class="mc-card-text">'+esc(s.perex)+'</div>';
      h+='<div class="mc-card-meta">'+(n?'<span class="m">'+n+' cvičení</span>':'<span class="m">text</span>')+'</div>';
      h+='<span class="mc-card-go">›</span></li>';
    });
    return h+'</ul>';
  }
  function journeyTabs(s){
    var exs=bySection[s.id]||[];
    return JOURNEY_TABS.filter(function(t){ return t.key==="exercises"?exs.length>0:!!s[t.key]; });
  }
  function viewJourneySection(){
    var j=state.journey, s=itemIndex.sections[j.sectionId];
    if(!s) return '<div class="mc-empty">Oddíl nenalezen.</div>';
    var h='<button class="mc-back" onclick="MC.journeyBack()">← Oddíly</button>';
    h+='<div class="mc-detail-meta"><div class="mc-card-eyebrow">Oddíl '+("0"+s.sort_order).slice(-2)+'</div></div>';
    h+='<div class="mc-detail-head"><div class="mc-detail-title">'+esc(s.title)+'</div></div>';
    if(s.perex) h+='<div class="mc-detail-perex">'+esc(s.perex)+'</div>';
    var tabs=journeyTabs(s);
    if(tabs.length<=1){
      // Oddíly bez cvičení — jen text. Když zbyde jediný tab, nekreslí se.
      var only=tabs[0]?tabs[0].key:"theory";
      return h+'<div class="mc-detail-body mc-md">'+md(stripDupHeading(s[only],s.title))+'</div>';
    }
    var tab=tabs.some(function(t){return t.key===j.tab;})?j.tab:tabs[0].key;
    h+='<div class="mc-submenu">';
    tabs.forEach(function(t){ h+='<button class="'+(tab===t.key?"active":"")+'" onclick="MC.journeyTab(\''+t.key+'\')">'+t.label+'</button>'; });
    h+='</div>';
    if(tab==="exercises") h+=viewSectionExercises(s);
    else if(tab==="practice") h+=renderPractice(s.practice,s.diary_practice,s.title);
    else h+='<div class="mc-detail-body mc-md">'+md(stripDupHeading(s[tab],s.title))+'</div>';
    return h;
  }
  function viewSectionExercises(s){
    var h='<div class="mc-namelist">';
    (bySection[s.id]||[]).forEach(function(e){
      h+='<button class="mc-name-item mc-in" onclick="MC.detail(\'exercises\',\''+e.id+'\')"><span class="nb"><span class="n">'+esc(e.name)+'</span>'+
         '<span class="sub">'+minutes(e.duration)+diffPill(e.difficulty)+(e.chain_id?'<span class="m">'+IC.chain+e.chain_order+'/'+(byChain[e.chain_id]||[]).length+'</span>':'')+(e.warning?'<span class="m warn">'+IC.warn+'</span>':'')+'</span></span><span class="go">›</span></button>';
    });
    return h+'</div>';

  function diffPill(d){ if(!d) return ""; return '<span class="mc-diff '+(DIFF_CLASS[d]||"")+'">'+esc(d)+'</span>'; }
  // Tab Praxe oddílu: deník (diary_practice) se vkládá pozičně za druhý blok
  // („Uvedení do praxe"), ne podle jména nadpisu — závěrečné nadpisy jsou živé.
  function renderPractice(src,diary,title){
    src=stripDupHeading(src,title)||"";
    if(!diary) return '<div class="mc-detail-body mc-md">'+md(src)+'</div>';
    var lines=String(src).split(/\r?\n/), heads=[];
    lines.forEach(function(l,i){ if(/^#{1,6}\s/.test(l.trim())) heads.push(i); });
    var cut=heads.length>=3?heads[2]:lines.length;
    return '<div class="mc-detail-body mc-md">'+md(lines.slice(0,cut).join("\n"))+'</div>'+journalCard(diary)+
           (cut<lines.length?'<div class="mc-detail-body mc-md">'+md(lines.slice(cut).join("\n"))+'</div>':'');
  }
  function journalCard(src){
    return '<div class="mc-journal"><div class="mc-journal-eyebrow">'+IC.journal+'Zápis do deníku</div><div class="mc-md">'+md(src)+'</div></div>';
  }

    if(cfg.search){
      h+='<div class="mc-search-wrap"><svg class="mc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="mc-search" class="mc-search" placeholder="Hledejte příznak…" oninput="MC.secSearch(this.value)" onkeydown="MC.searchKey(event)"></div>';
      if(s.search.trim()){ var q=deburr(s.search); items=items.filter(function(it){ return deburr(it.name).indexOf(q)>-1; }); }
    }
    h+='<div class="mc-namelist">';
    if(items.length===0) h+='<div class="mc-empty">Nic neodpovídá hledání.</div>';
    else items.forEach(function(it){

  function viewCards(key){
    var cfg=CONTENT[key], s=secState(key);
    var h=secHead(key,cfg.label,null,USER.favorites[cfg.store].length);
    if(s.favOnly&&!USER.favorites[cfg.store].length) return h+favEmpty();
    h+='<div class="mc-submenu">';
    h+='<button class="'+(s.mode==="new"?"active":"")+'" onclick="MC.secMode(\''+key+'\',\'new\')">Nejnovější</button>';
    if(cfg.redakce) h+='<button class="'+(s.mode==="edit"?"active":"")+'" onclick="MC.secMode(\''+key+'\',\'edit\')">Redakce</button>';
    var fc=activeFilterCount(key);
    h+='<button class="mc-filter-btn '+(s.filterOpen?"active":"")+'" onclick="MC.secFilter(\''+key+'\')">'+IC.filter+'Filtr'+(fc>0?'<span class="fc">'+fc+'</span>':'')+'</button>';
    var items=contentList(key), all=items;
    // Věty (citáty, otázky) umí „jen nové" a proud karet; články a cvičení ne —
    // tam se čte struktura, ne věta. Nástroje vpravo v řádku submenu.
    if(cfg.render==="quotes"){ items=unseenOnly(cfg.store,all); h+=listTools(cfg.store,all.length,items.length,true); }
    h+='</div>';
    if(s.filterOpen) h+=viewFilterPanel(key);
    if(cfg.render==="quotes"){
      if(viewMode()==="swipe") return h+swipeView(cfg.store,key+":"+s.mode+":"+s.kw+":"+s.tags.join(","),all.filter(function(it){ return !USER.onlyNew||!isSeen(cfg.store,it.id)||state.swipe.ids.indexOf(it.id)>-1; }),function(it){ return it.author?esc(it.author):""; });
      if(!items.length&&USER.onlyNew&&all.length) return h+allSeen();
    }
    h+='<ul class="mc-cards">';
    if(items.length===0) h+='<div class="mc-empty">'+(s.favOnly?"Žádná uložená položka neodpovídá filtru.":"Nic neodpovídá filtru.")+'</div>';
    else if(cfg.render==="quotes") items.forEach(function(it){ h+=quoteCard(cfg,it); });
    else items.forEach(function(it){ h+=contentCard(key,cfg,it); });
    h+='</ul>';
    return h;
  }

  function contentCard(key,cfg,it){

    h+='</div>';

  function quoteCard(cfg,it){
