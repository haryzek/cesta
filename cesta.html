  }

  // ===================== POMOCNÉ =====================
  function esc(s){ var d=document.createElement("div"); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
  function deburr(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
  function minutes(n){ return '<span class="m">'+IC.clock+(n||0)+' min</span>'; }
  // Tag pilulky. V kartách seznamu jeden řádek: ukáže se jich tolik, kolik se vejde
  // (fitTags po vykreslení), zbytek jako „+N“ (od 24. 11. 2026, dřív pevně 2). V detailu všechny.
  function tagRow(tags,limit){
    if(!tags||!tags.length) return "";
    var h='<div class="mc-tag-row'+(limit?' fit':'')+'">';
    tags.forEach(function(t){ h+='<span class="mc-tag">'+esc(t)+'</span>'; });
    if(limit) h+='<span class="mc-tag more" hidden></span>';
    return h+'</div>';
  }
  function fitTags(){
    var rows=document.querySelectorAll(".mc-tag-row.fit");
    for(var r=0;r<rows.length;r++){
      var row=rows[r], tags=row.querySelectorAll(".mc-tag:not(.more)"), more=row.querySelector(".more"), W=row.clientWidth;
      for(var i=0;i<tags.length;i++) tags[i].hidden=false;
      more.hidden=true;
      if(!W||row.scrollWidth<=W) continue;
      // Schovávat od konce, dokud se nevejdou viditelné + „+N“.
      var n=tags.length;
      while(n>1){
        n--; tags[n].hidden=true; more.hidden=false; more.textContent="+"+(tags.length-n);
        if(row.scrollWidth<=W) break;
      }
    }
  }
  var fitT; window.addEventListener("resize",function(){ clearTimeout(fitT); fitT=setTimeout(fitTags,100); });
  try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTags); }catch(e){}
  function timeTag(n){ return '<span class="mc-tag time">'+IC.clock+(n||0)+' min</span>'; }

  // ===================== MARKDOWN ===================== (identický s produkcí)
  function mdInline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,function(_,t){
    // Bold, který je čistě telefonní číslo (číslice a mezery, ≥3 cifry),
    // dostane tón sekce — telefonní čísla v krizovce mají vyčnívat červeně.
    return /^[\d\s]+$/.test(t)&&(t.replace(/\D/g,"").length>=3) ? '<strong class="mc-tel">'+t+'</strong>' : '<strong>'+t+'</strong>';
  }).replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>"); }
  // Těla v datech začínají nadpisem, který opakuje název položky — ten je ale
  // už v titulku detailu, takže by se název ukázal dvakrát pod sebou.
  // Zahodíme první nadpis, jen když se s názvem shoduje.
  function stripDupHeading(src,title){
    if(!src||!title) return src;
    var norm=function(s){ return deburr(String(s).replace(/[*_`#]/g,"")).trim(); };
    var lines=String(src).split(/\r?\n/), i=0;
    while(i<lines.length && !lines[i].trim()) i++;
    var m=lines[i]&&lines[i].trim().match(/^#{1,6}\s+(.*)$/);
    if(m && norm(m[1])===norm(title)) return lines.slice(i+1).join("\n");
    return src;
  }

  // Oddělí závěrečný blok "## Zápis do deníku" z těla cvičení — renderuje se
  // jako samostatná journal-card (teal), ne jako běžný nadpis. Vrací tělo bez
  // něj a obsah deníku (řádky za nadpisem).
  function splitJournal(src){
    if(!src) return { body:src, journal:null };
    var lines=String(src).split(/\r?\n/);
    for(var i=0;i<lines.length;i++){
      var m=lines[i].trim().match(/^#{1,6}\s+(.*)$/);
      if(m && deburr(m[1]).indexOf("zapis do deniku")>-1){
        return { body:lines.slice(0,i).join("\n").replace(/\s+$/,""), journal:lines.slice(i+1).join("\n").trim() };
      }
    }
    return { body:src, journal:null };
  }

  function md(src){
    var lines=String(src||"").split(/\r?\n/), out=[], para=[], stack=[];
    function flushPara(){ if(para.length){ out.push("<p>"+para.map(mdInline).join("<br>")+"</p>"); para=[]; } }
    function closeList(){ out.push("</li></"+stack.pop().tag+">"); }
    function closeLists(){ while(stack.length) closeList(); }
    // Otevírací značka seznamu. U <ol> respektuje číslo prvního zdrojového
    // kroku: vícefázový postup (cv 49) má fáze oddělené podnadpisem, takže
    // vznikne druhý <ol>, který by jinak začal znovu od 1. Kromě atributu
    // start se musí přenastavit i CSS counter — kolečka kroků kreslí on.
    function openTag(tag,num){
      if(tag==="ol" && num>1) return '<ol start="'+num+'" style="counter-reset:mcstep '+(num-1)+'">';
      return "<"+tag+">";
    }
    function item(indent,tag,text,num){
      flushPara();
      while(stack.length && indent<stack[stack.length-1].indent) closeList();
      var top=stack[stack.length-1];
      if(!stack.length || indent>top.indent){ out.push(openTag(tag,num)); stack.push({tag:tag,indent:indent}); }
      else{ out.push("</li>"); if(top.tag!==tag){ out.push("</"+stack.pop().tag+">"); out.push(openTag(tag,num)); stack.push({tag:tag,indent:indent}); } }
      out.push("<li>"+text);
    }
    lines.forEach(function(raw){
      var line=raw.replace(/\t/g,"    "), m; var indent=line.match(/^ */)[0].length; line=line.trim();
      if(!line){ flushPara(); return; }
      if((m=line.match(/^(#{1,6})\s+(.*)$/))){ flushPara(); closeLists(); var lvl=Math.min(Math.max(m[1].length,2),4); out.push("<h"+lvl+">"+mdInline(m[2])+"</h"+lvl+">"); return; }
      if((m=line.match(/^[-*]\s+(.*)$/))){ item(indent,"ul",mdInline(m[1])); return; }
      if((m=line.match(/^(\d+)[.)]\s+(.*)$/))){ item(indent,"ol",mdInline(m[2]),parseInt(m[1],10)); return; }
      // Odsazený řádek, který není odrážka, pokračuje poslední položkou seznamu
      // (zalomí se v ní). Bez toho by seznam ukončil a text vypadl do odstavce.
      if(stack.length && indent>0 && para.length===0){ out.push("<br>"+mdInline(line)); return; }
      closeLists(); para.push(line);
    });
    flushPara(); closeLists(); return out.join("");
  }

  // ===================== PŘERÁMOVÁNÍ — pocity + interleaving =====================
  function mainFeelings(){ return DB.feelings.filter(function(f){ return contentClusters.indexOf(f.cluster_id)>-1 && f.main && f.main!=="0"; }); }
  function secondaryFeelings(){ return DB.feelings.filter(function(f){ return contentClusters.indexOf(f.cluster_id)>-1 && (!f.main||f.main==="0"); }); }
  function visibleFeelings(){
    var rf=state.rf, list=mainFeelings().concat(rf.showSecondary?secondaryFeelings():[]);
    if(rf.search.trim()){ list=mainFeelings().concat(secondaryFeelings()); var q=deburr(rf.search); list=list.filter(function(f){ return deburr(f.name).indexOf(q)>-1; }); }
    list.sort(function(a,b){ return a.sort_order-b.sort_order; }); return list;
  }
  function interleave(typeKey,cwc){
    // rank (volitelný) = pořadí pocitu pod strachem; má přednost před sort_order clusteru.
    var counts={},rank={},ids=[]; cwc.forEach(function(c){ counts[c.cluster_id]=c.count; rank[c.cluster_id]=c.rank; ids.push(c.cluster_id); });
    ids.sort(function(a,b){ if(counts[b]!==counts[a]) return counts[b]-counts[a]; if(rank[a]!=null&&rank[b]!=null&&rank[a]!==rank[b]) return rank[a]-rank[b]; return (clusterSort[a]||0)-(clusterSort[b]||0); });
    var lists={},pos={}; ids.forEach(function(cid){ lists[cid]=rfList(typeKey,cid); pos[cid]=0; });
    var seen={},merged=[];
    function exhausted(){ return ids.every(function(cid){ return pos[cid]>=lists[cid].length; }); }
    while(!exhausted()){ ids.forEach(function(cid){ var e=0; while(e<counts[cid]&&pos[cid]<lists[cid].length){ var it=lists[cid][pos[cid]]; pos[cid]++; if(seen[it.id])continue; seen[it.id]=1; merged.push(it); e++; } }); }
    return merged;
  }
  function currentRfList(){
    var rf=state.rf;
    var store=storeOf(rf.activeType);
    if(rf.detailMode==="single") return rfList(rf.activeType,rf.detailClusters[0].cluster_id);
    return alive(store,interleave(rf.activeType,rf.detailClusters));
  }
  // Řez pro první verzi: z každého klastru jen top N živých položek (pořadí =
  // pořadí ve zdroji). Uživatel ho má vždycky, Bob ho v adminu může vypnout.
  // Bolístky: všech 175 (fronta 139 + 36 zrušena 12. 11. 2026, Bob prošel všechny), pod každou top 5 hlášek.
  var RF_CUT={ reframings:15, questions_rf:8, actions:7 }, PAIN_CUT=5;
  // Měkký řez promíchaného seznamu (víc pocitů najednou, od 19. 11. 2026): po N větách výrazná
  // karta „nechte si zbytek na jindy“, jde ale pokračovat. Míchání po kolech = do prvních N
  // se dostane to nejlepší z každého pocitu. Viděné (oko) se vyřazují dřív, než se N počítá.
  var SOFT_CUT={ reframings:45, questions_rf:24, actions:21 }, MANY_ANSWERS=100;
  var SOFT_TITLE="Možná je to pro dnešek dost";
  var SOFT_TEXT="Přerámování nepůsobí množstvím. Pár vět, které necháte opravdu doznít, udělá víc než desítky přečtených najednou. Zbytek tu na vás počká — a příště vás možná osloví úplně jinak.";
  function softCutOf(){ var rf=state.rf; return rf.detailMode==="merged"?SOFT_CUT[rf.activeType]:0; }
  function softBreakHtml(card){
    var b='<div class="sc-soft-t">'+SOFT_TITLE+'</div><p class="sc-soft-p">'+SOFT_TEXT+'</p><div class="sc-actions"><button class="mc-fab" onclick="MC.swipeClose()">Nechat na jindy</button><button class="mc-fab ghost" onclick="MC.'+(card?'swipeNext':'rfSoftOpen')+'()">Pokračovat</button></div>';
    return card?'<div class="mc-swipe-card break soft"><div class="sc-body">'+b+'</div></div>':'<li class="mc-soft">'+b+'</li>';
  }
  // Výběr pocitů → klastry s počtem (stejně jako rfOpenSelected) a počet přerámování, který uživatel dostane.
  function selClusters(){
    var sel=state.rf.selected, counts={};
    Object.keys(sel).forEach(function(k){ var c=sel[k].cluster_id; counts[c]=(counts[c]||0)+1; });
    return Object.keys(counts).map(function(c){ return {cluster_id:c,count:counts[c]}; });
  }
  function selAnswerCount(){
    var cwc=selClusters(); if(!cwc.length) return 0;
    if(cwc.length===1) return rfList("reframings",cwc[0].cluster_id).length;
    return alive("reframings",interleave("reframings",cwc)).length;
  }
  function plOdpoved(n){ return n===1?"odpověď":(n>=2&&n<=4?"odpovědi":"odpovědí"); }
  function cutOn(){ return !ADMIN.on||ADMIN.cut!==false; }
  function rfList(typeKey,cid){
    var l=alive(storeOf(typeKey),(byCluster[typeKey][cid]||[]).slice());
    return cutOn()&&RF_CUT[typeKey]?l.slice(0,RF_CUT[typeKey]):l;
  }
  function storeOf(typeKey){ for(var i=0;i<TYPES.length;i++){ if(TYPES[i].key===typeKey) return TYPES[i].store; } }

  // ===================== FILTR obsahových sekcí =====================
  // Skupiny štítků ve filtru (25. 11. 2026). Klíč = skupina ve slovníku (data/tag_groups.json),
  // label = nadpis pro lidi (hlasem uživatele, jako brány přerámování), pořadí = pořadí ve filtru:
  // malé ostré skupiny napřed, obr „Na čem chci pracovat“ na konec. Barvy v CSS (--g-*).
  var TAG_GROUPS_UI=[
    { key:"st", group:"Stavy a potíže",     label:"S čím zápasím" },
    { key:"em", group:"Emoce",              label:"Co prožívám" },
    { key:"co", group:"Co se při tom dělá", label:"Čím si pomůžu" },
    { key:"vz", group:"Vztahy",             label:"Já a druzí" },
    { key:"ch", group:"Chci pracovat na",   label:"Na čem chci pracovat" },
    { key:"ot", group:null,                 label:"Další" }
  ];
  function tagGroupKey(t){
    var g=(DB&&DB.tag_groups||{})[t];
    for(var i=0;i<TAG_GROUPS_UI.length;i++){ if(TAG_GROUPS_UI[i].group===g) return TAG_GROUPS_UI[i].key; }
    return "ot";
  }
  function allTags(dataKey){
    var set={}; (flat[dataKey]||[]).forEach(function(it){ (it.tags||[]).forEach(function(t){ set[t]=1; }); });
    return Object.keys(set).sort();
  }
  // Váha tagu podle pozice v datech (tagy jsou v JSONu seřazené podle priority,
  // první nese téma, 2.–3. váhu, zbytek je tie-break). Jediná laditelná
  // konstanta filtru; lineární je bezpečný start, strmější ([8,5,3,2,1,1])
  // by nechal dominovat první tag.
  var TAG_VAHY=[6,5,4,3,2,1];
  function tagScore(it,sel){
    var t=it.tags||[], score=0, hits=0;
    sel.forEach(function(tag){ var p=t.indexOf(tag); if(p>-1){ score+=TAG_VAHY[Math.min(p,TAG_VAHY.length-1)]; hits++; } });
    return {score:score, hits:hits};
  }
  function durationBuckets(){ return [ {label:"do 5 min",max:5}, {label:"6–15 min",min:6,max:15}, {label:"16+ min",min:16} ]; }
  function activeFilterCount(key){ var s=secState(key), n=0; if(s.kw.trim())n++; n+=s.tags.length; n+=s.durs.length; return n; }
  function contentList(key){
    var cfg=CONTENT[key], s=secState(key), items=alive(cfg.store,(flat[cfg.dataKey]||[]).slice());
    if(s.mode==="edit" && cfg.redakce){
      items=items.filter(function(it){ return it.quality===5; });
      if(cfg.redakceOrder==="journey"){
        // Cvičení: pořadí cvičebnice — oddíl, pak pořadí v oddílu (stejně jako Moje cesta).
        var so=function(it){ var sec=itemIndex.sections[it.section_id]; return sec?sec.sort_order:999; };
        items.sort(function(a,b){ return so(a)-so(b) || a.sort_order-b.sort_order; });
      } else {
        // Zamíchat jednou za návštěvu a držet — jinak by se seznam přemíchal při každém render (srdíčko apod.).
        var ids=items.map(function(it){ return it.id; }).sort().join(",");
        if(!s.shuf||s.shufKey!==ids){ s.shuf={}; shuffle(items.slice()).forEach(function(it,i){ s.shuf[it.id]=i; }); s.shufKey=ids; }
        items.sort(function(a,b){ return s.shuf[a.id]-s.shuf[b.id]; });
      }
    }
    else { items.sort(function(a,b){ return String(b.added_at||"").localeCompare(String(a.added_at||"")) || b.sort_order-a.sort_order; }); }
    if(s.kw.trim()){
      var q=deburr(s.kw);
      items=items.filter(function(it){ var hay=deburr([it.title,it.name,it.text,it.perex].filter(Boolean).join(" ")); return hay.indexOf(q)>-1; });
    }
    // Tagy se sčítají (OR): víc zaškrtnutých = širší výběr, ne užší. Dřív AND,
    // což u pár tagů vracelo skoro vždycky prázdno. OR říká CO projde; pořadí
    // pak určuje priorita tagů v datech (první tag = téma položky) — viz tagScore.
    if(s.tags.length){
      items=items.map(function(it){ return {it:it, sc:tagScore(it,s.tags)}; })
        .filter(function(x){ return x.sc.score>0; })
        .sort(function(a,b){ return b.sc.score-a.sc.score || b.sc.hits-a.sc.hits
          || String(b.it.added_at||"").localeCompare(String(a.it.added_at||"")) || String(a.it.id).localeCompare(String(b.it.id)); })
        .map(function(x){ return x.it; });
    }
    // Délky se sčítají (OR) stejně jako tagy — položka projde, když padne do
    // kteréhokoli zaškrtnutého pásma.
    if(s.durs.length && cfg.timeField){
      var bs=s.durs.map(function(i){ return durationBuckets()[i]; });
      items=items.filter(function(it){ var v=it[cfg.timeField]||0;
        return bs.some(function(b){ return (b.min==null||v>=b.min)&&(b.max==null||v<=b.max); }); });
    }
    return items;
  }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  // ===================== RENDER — obal =====================
  // ---- Úvodní souhlas (18. 11. 2026). Při prvním otevření nepřeskočitelná obrazovka:
  // appka nenahrazuje odbornou pomoc + 18+. Checkboxy až pod textem (= musí doscrollovat),
  // tlačítko aktivní až po obou. Uloženo s verzí: změna textu → zvednout CONSENT_VER.
  var CONSENT_KEY="mc_consent", CONSENT_VER=1;
  function hasConsent(){
    if(state.consentOk) return true;
    try{ var c=JSON.parse(localStorage.getItem(CONSENT_KEY)||"null"); return !!(c&&c.v>=CONSENT_VER); }catch(e){ return false; }
  }
  function disclaimerHtml(){

      else if(sec&&sec.kind==="favorites") h+=viewFavorites();

      state.journey.sectionId,state.journey.tab,viewMode()].join("|");

    setStill(root,"data-still",sig===STILL.sig);

  // ---- Brána Strachy: kategorie → konkrétní strach → přerámování → jádrové pocity
  function groupsOf(list){ var seen={},out=[]; list.forEach(function(x){ if(!seen[x.group]){ seen[x.group]=1; out.push(x.group); } }); return out; }
  function fearMatches(q,x){ return deburr(x.name).indexOf(q)>-1 || (x.aliases||[]).some(function(a){ return deburr(a).indexOf(q)>-1; }); }
  function viewRfFears(){
    var rf=state.rf, h='<button class="mc-back" onclick="MC.rfGate(null)">← Přerámování</button>';
    h+='<div class="mc-sec-head"><h1>Čeho se bojím?</h1><p>Najděte strach, který je vám nejblíž.</p></div>';
    h+=searchBox("Hledejte strach…","rfFearSearch",rf.fearSearch);
    if(rf.fearSearch.trim()){
      // Aliasy se hledají, nezobrazují.
      var q=deburr(rf.fearSearch);
      var sits=flat.situations.filter(function(x){ return fearMatches(q,x); });
      if(!sits.length) return h+'<div class="mc-empty">Nic neodpovídá hledání.</div>';
      return h+nameList(sits,function(it){ return "MC.rfSituation('"+it.id+"')"; });
    }
    var list=flat.situations;
    var groups=groupsOf(list);
    h+='<div class="mc-namelist">';
    groups.forEach(function(g){
      var n=list.filter(function(x){ return x.group===g; }).length;

    var rf=state.rf;
    var h='<button class="mc-back" onclick="MC.rfGate(\'fears\')">← Strachy</button>';
    // Kategorie pod Zpět se neopakuje (24. 11. 2026) — uživatel ji právě vybral.
    h+='<div class="mc-detail-head"><div class="mc-detail-title">Čeho se bojím?</div></div>';

  // Jádrové pocity pod konkrétním strachem: součet vah přes jeho kanonové
  // strachy, seřazené od nejpravděpodobnějšího. Všechny, ne top N — uživatel
  // vybírá, pořadí mu jen napovídá.
  function situationFeelings(s){
    var score={};
    (s.fear_ids||[]).forEach(function(id){
      var f=itemIndex.fears[id]; if(!f) return;
      (f.cluster_ids||[]).forEach(function(c,i){ if(contentClusters.indexOf(c)>-1) score[c]=(score[c]||0)+(FEAR_POS_WEIGHTS[i]||1); });
    });
    return Object.keys(score).sort(function(a,b){ return score[b]-score[a] || (clusterSort[a]||0)-(clusterSort[b]||0); });
  }
  // Situace: podle mark P (přerámování) / E (empatie) / K (Krizovka), pod tím

    var rf=state.rf, s=itemIndex.situations[rf.situation];

    if(s.mark==="K"){
      if(!al) h+='<div class="mc-box mc-warn"><span class="b-ic">'+IC.warn+'</span><span class="b-text">Tohle není na přerámování. Když je vám takhle, je tu první pomoc.</span></div>';
      h+='<div class="mc-fab-wrap static"><button class="mc-fab" onclick="MC.open(\'crisis\')">Otevřít První pomoc</button></div>';

    return h;
  }
  // Výběr jádrových pocitů pod strachem / bolístkou → triplet. Klik na jméno = jeden pocit,
  // zaškrtnuté + tlačítko = víc najednou (merged).
  function feelingPicker(title,text,cids,sel,toggleFn,openFn){
    var h='<div class="mc-under"><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p></div><ul class="mc-list">';
    cids.forEach(function(c){
      var on=!!sel[c];
      h+='<li class="mc-feeling mc-in '+(on?"checked":"")+'"><span class="mc-check '+(on?"on":"")+'" onclick="MC.'+toggleFn+'(\''+c+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span class="mc-feeling-name" onclick="MC.'+openFn+'(\''+c+'\')">'+esc(clusterName[c]||"")+'</span><span class="mc-feeling-go" onclick="MC.'+openFn+'(\''+c+'\')">›</span></li>';
    });
    h+='</ul>';
    var n=Object.keys(sel).length;
    if(n>0) h+=fabPair("selReset('"+(toggleFn==="rfSitToggle"?"sit":"pain")+"')",openFn+"()",answersForClusters(Object.keys(sel)));
    return h;
  }
  // Spodní dvojice tlačítek při výběru pocitů (od 25. 11. 2026, stejný vzor jako filtr):
  // vlevo Zrušit výběr, vpravo pod pravým palcem Přerámovat (N). Nahoře v hledání už reset není.
  function fabPair(clearCall,openCall,n){
    return '<div class="mc-fab-wrap"><div class="mc-fab-row"><button class="mc-fab mc-clear" onclick="MC.'+clearCall+'">Zrušit výběr</button>'+
      '<button class="mc-fab" onclick="MC.'+openCall+'">Přerámovat ('+n+')</button></div></div>';
  }
  function answersForClusters(cids){
    if(!cids.length) return 0;
    if(cids.length===1) return rfList("reframings",cids[0]).length;
    return alive("reframings",interleave("reframings",cids.map(function(c){ return {cluster_id:c,count:1}; }))).length;
  }

  // ---- Brána Bolístky: jedno zrcadlo vět (bez kategorií) → hlášky
  // Režim karet: zápisník — bez nadpisu, záložky, karta, spodní lišta.
  function rfFolder(cids){
    var rf=state.rf, all=currentRfList(), store=storeOf(rf.activeType);
    var rfKey="rf:"+rf.activeType+":"+cids.join(",");

    var ti=TYPES.map(function(t){ return t.key; }).indexOf(rf.activeType), nx=TYPES[ti+1]||null;
    SWIPE_NEXT=nx?{key:nx.key,label:nx.label}:null;
    var items=swipeItems(store,rfKey,all);
    if(!items.length) h+=alertBoxes(cids)+(USER.onlyNew?allSeen():'<div class="mc-empty">Nic tu není.</div>')+(nx?'<div class="mc-fab-wrap static"><button class="mc-fab" onclick="MC.rfType(\''+nx.key+'\')">Pokračovat na '+nx.label+' ›</button></div>':'');
    else h+=swipeView(store,rfKey,items,metaFn,function(it){ return (rf.detailTitle?rf.detailTitle+" → ":"")+(clusterName[it.cluster_id]||""); },softCutOf(),preCards(cids,true));
    h+=swipeFoot(unseenCount(store,all))+'</div>'; SWIPE_NEXT=null; return h;
  }
  var SWIPE_NEXT=null;

      else h+=swipeView("pains","pain:"+p.id,itemsS,function(){ return esc(cutText(p.text,70)); },function(){ return p.text; },0,preCards([p.id]));

    if(cutOn()) all=all.slice(0,PAIN_CUT);
    var list=unseenOnly("pains",all);
    // Jádrové pocity pod bolístkou (od 18. 11. 2026) — jen kde je vazba jasná (cluster_ids v datech), měkčí titulek než u strachů.
    var under=(p.cluster_ids&&p.cluster_ids.length)?feelingPicker("Co může být pod tím?","Za bolístkou může být hlubší pocit. Pokud některý sedí, vyberte ho a podívejte se na něj jinak.",p.cluster_ids,rf.painSel||{},"rfPainToggle","rfPainOpen"):"";

    h+='<ul class="mc-cards">';
    list.forEach(function(x){ h+='<li class="mc-card mc-in">'+admText("pains",x.id,x.text,"mc-card-text")+adminBar("pains",x.id)+heartBtn("pains",x.id,isFav("pains",x.id))+'</li>'; });
    return h+'</ul>'+under;
  }

  function viewRfDetail(){
    var rf=state.rf, h='<button class="mc-back" onclick="MC.rfBack()">← Zpět</button>';

    h+=alertBoxes(cids);

    if(rf.detailTitle) h+='<div class="mc-detail-head"><div class="mc-detail-title">'+esc(rf.detailTitle)+'</div></div><div class="mc-detail-sub">'+esc(names.join(" · "))+'</div>';
    else if(rf.detailMode==="single") h+='<div class="mc-detail-head"><div class="mc-detail-title">'+esc(names[0]||"")+'</div></div>';
    else h+='<div class="mc-detail-head"><div class="mc-detail-title">Vybrané pocity</div></div><div class="mc-detail-sub">'+esc(names.join(" · "))+'</div>';
    var all=currentRfList(), store=storeOf(rf.activeType), list=unseenOnly(store,all);

    h+='<div class="mc-submenu-triplet">';

    if(viewMode()==="swipe") return h+swipeView(store,rfKey,swipeItems(store,rfKey,all),metaFn,function(it){ return (rf.detailTitle?rf.detailTitle+" → ":"")+(clusterName[it.cluster_id]||""); },softCutOf());
    if(!list.length) return h+'<div class="mc-empty">Nic tu není.</div>';

  // submenu Cvičení / Info / Teorie / Praxe — výchozí Cvičení (kdo otevře
  // oddíl, chce cvičit; teorii si klikne). Tab se kreslí jen když má obsah.
  var JOURNEY_TABS=[ {key:"exercises",label:"Cvičení"}, {key:"info",label:"Info"}, {key:"theory",label:"Teorie"}, {key:"practice",label:"Praxe"} ];
  function viewJourney(){ return state.journey.sectionId?viewJourneySection():viewJourneyList(); }
  function viewJourneyList(){
    var h=secHead("journey","Moje cesta","Cvičebnice krok za krokem — oddíly, jejich cvičení, teorie a praxe.");
    h+='<ul class="mc-cards">';
    // Návod jako první karta — bez čísla, s ikonkou, ať je jasné, že to není oddíl.
    h+='<li class="mc-card clickable mc-in" onclick="MC.open(\'guide\')"><div class="mc-card-eyebrow mc-guide-ic">'+IC.guide+'</div>'+
       '<div class="mc-card-title">Jak s appkou pracovat</div><div class="mc-card-text">Kde začít, jak číst přerámování a jak cvičit.</div><span class="mc-card-go">›</span></li>';
    flat.sections.forEach(function(s){
      var n=(bySection[s.id]||[]).length;
      h+='<li class="mc-card clickable mc-in" onclick="MC.journeySection(\''+s.id+'\')">';

      h+='<span class="mc-card-go">›</span></li>';
    });
    return h+'</ul>';

  function journeyTabs(s){
    var exs=bySection[s.id]||[];
    return JOURNEY_TABS.filter(function(t){ return t.key==="exercises"?exs.length>0:!!s[t.key]; });

  function viewJourneySection(){
    var j=state.journey, s=itemIndex.sections[j.sectionId];
    if(!s) return '<div class="mc-empty">Oddíl nenalezen.</div>';
    var h='<button class="mc-back" onclick="MC.journeyBack()">← Oddíly</button>';
    h+='<div class="mc-detail-meta"><div class="mc-card-eyebrow">Oddíl '+("0"+s.sort_order).slice(-2)+'</div></div>';

      return h+'<div class="mc-detail-body mc-md">'+md(stripDupHeading(s[only],s.title))+'</div>';
    }

    if(ADMIN.on) h+='<div class="mc-adm-detail">'+admPanel(admSectionTargets(s,tab),true)+'</div>';
    h+='<div class="mc-submenu">';

    var h='<div class="mc-namelist">';

      h+='<button class="mc-name-item mc-in" onclick="MC.detail(\'exercises\',\''+e.id+'\')"><span class="nb"><span class="n">'+esc(e.name)+'</span>'+
         '<span class="sub">'+minutes(e.duration)+diffPill(e.difficulty)+(e.chain_id?'<span class="m">'+IC.chain+e.chain_order+'/'+(byChain[e.chain_id]||[]).length+'</span>':'')+(e.warning?'<span class="m warn">'+IC.warn+'</span>':'')+'</span></span><span class="go">›</span></button>';

  function diffPill(d){ if(!d) return ""; return '<span class="mc-diff '+(DIFF_CLASS[d]||"")+'">'+esc(d)+'</span>'; }
  // Tab Praxe oddílu: deník (diary_practice) se vkládá pozičně za druhý blok
  // („Uvedení do praxe"), ne podle jména nadpisu — závěrečné nadpisy jsou živé.
  function renderPractice(src,diary,title){
    src=stripDupHeading(src,title)||"";
    if(!diary) return '<div class="mc-detail-body mc-md">'+md(src)+'</div>';
    var lines=String(src).split(/\r?\n/), heads=[];
    lines.forEach(function(l,i){ if(/^#{1,6}\s/.test(l.trim())) heads.push(i); });
    var cut=heads.length>=3?heads[2]:lines.length;
    return '<div class="mc-detail-body mc-md">'+md(lines.slice(0,cut).join("\n"))+'</div>'+journalCard(diary)+
           (cut<lines.length?'<div class="mc-detail-body mc-md">'+md(lines.slice(cut).join("\n"))+'</div>':'');
  }
  function journalCard(src){
    return '<div class="mc-journal"><div class="mc-journal-eyebrow">'+IC.journal+'Zápis do deníku</div><div class="mc-md">'+md(src)+'</div></div>';

  // ===================== RENDER — obsahové sekce =====================

      if(s.search.trim()){ var q=deburr(s.search); items=items.filter(function(it){ return deburr(it.name).indexOf(q)>-1; }); }
    }
    h+='<div class="mc-namelist">';

    h+='<ul class="mc-cards">';

  // Otázky a Inspirace (od 24. 11. 2026): Filtr a přepínač karty / seznam v řádku s nadpisem,

      h='<div class="mc-folder mc-qfold">'+h;   // hlavička uvnitř bloku, ať blok i s ní vyplní okno

      return h+swipeView(cfg.store,qKey,swipeItems(cfg.store,qKey,all),function(it){ return it.author?esc(it.author):""; },function(it){ return it.author||""; })+swipeFoot(unseenCount(cfg.store,all))+'</div>';

    var chips='';

    }
    // Štítky po skupinách slovníku (25. 11. 2026): nadpis hlasem uživatele + vlastní jemná barva skupiny.
    var byG={};

  function contentCard(key,cfg,it){
    var title=it[cfg.titleField]||"";
    var store=cfg.store, on=isFav(store,it.id), read=cfg.readable&&isRead(it.id);
    var h='<li class="mc-card clickable mc-in '+(read?"read":"")+'" onclick="MC.detail(\''+cfg.dataKey+'\',\''+it.id+'\')">';
    h+='<div class="mc-card-title">'+esc(title)+'</div>';
    if(it.perex) h+='<div class="mc-card-text">'+esc(it.perex)+'</div>';
    if(it.tags&&it.tags.length) h+=tagRow(it.tags,2);
    h+='<div class="mc-card-meta">';
    if(cfg.timeField) h+=minutes(it[cfg.timeField]);
    // Štítek Redakce jen mimo režim Redakce — tam je jasné, kde jsem.
    if(cfg.redakce&&it.quality===5&&secState(key).mode!=="edit") h+='<span class="m" style="color:var(--accent)">'+IC.star+'Redakce</span>';
    if(isTop(store,it.id)) h+='<span class="m mc-top">'+IC.star+'Top</span>';
    h+='</div>';
    h+=adminBar(store,it.id)+heartBtn(store,it.id,on,true)+'</li>';
    return h;
  }

  function quoteCard(cfg,it){
    var store=cfg.store, on=isFav(store,it.id);

  // ===================== RENDER — obsahový detail =====================
  function viewContentDetail(){
    var d=state.detail, item=(itemIndex[d.type]||{})[d.id];
    var cfg=null; Object.keys(CONTENT).forEach(function(k){ if(CONTENT[k].dataKey===d.type) cfg=CONTENT[k]; });
    if(!item||!cfg) return '<div class="mc-empty">Položka nenalezena.</div>';
    var title=item[cfg.titleField]||item.name||"";
    var store=cfg.store, on=isFav(store,d.id);
    // Cvičení: taby Postup / Info / Teorie / Praxe. Info/Teorie/Praxe se u
    // cvičení dědí z oddílu (v datech jsou vždy null), nad text jde název
    // oddílu, ať je jasné, že platí pro celou kapitolu. Doplňky ke cvičení
    // (dřív info_extra/theory_extra) žijí od 18. 11. 2026 v body.
    // Tab se kreslí jen když má obsah.
    var isEx=!!cfg.info, sec=isEx&&item.section_id?itemIndex.sections[item.section_id]:null;
    var tabs=[];
    if(isEx){
      tabs.push({key:"body",label:"Postup"});
      var src={ info:item.info||(sec&&sec.info), theory:item.theory||(sec&&sec.theory), practice:item.practice||(sec&&sec.practice) };
      if(src.info) tabs.push({key:"info",label:"Info",src:src.info});
      if(src.theory) tabs.push({key:"theory",label:"Teorie",src:src.theory});
      if(src.practice) tabs.push({key:"practice",label:"Praxe",src:src.practice,practice:true});
    }
    var hasTabs=tabs.length>1;
    var tab=tabs.some(function(t){return t.key===d.tab;})?d.tab:"body";

    var h='<button class="mc-back" onclick="MC.detailBack()">← Zpět</button>'+alertBoxes([d.id]);
    // Pořadí podle mockupu: tag pilulky nad H1, pak titulek, pak perex.
    // Čas u cvičení nese box náročnosti pod taby, takže pilulku nedubluje.
    // Štítky cvičení jsou jen na kartách v seznamu, v detailu se neopakují.
    var pills=[];
    if(cfg.timeField&&item[cfg.timeField]&&!isEx) pills.push(timeTag(item[cfg.timeField]));
    if(item.tags&&item.tags.length&&!isEx) item.tags.forEach(function(t){ pills.push('<span class="mc-tag">'+esc(t)+'</span>'); });
    if(pills.length) h+='<div class="mc-detail-meta"><div class="mc-tag-row">'+pills.join("")+'</div></div>';

    h+='<div class="mc-detail-head"><div class="mc-detail-title">'+esc(title)+'</div>';
    h+='<button class="mc-detail-heart '+(on?"on":"")+'" onclick="MC.fav(\''+store+'\',\''+d.id+'\')" aria-label="Uložit"><svg class="he" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><svg class="hf" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button></div>';
    // Most z cvičení do jeho oddílu v Moje cesta — hned pod názvem.
    if(sec) h+='<button class="mc-sec-link" onclick="MC.journeySection(\''+sec.id+'\')"><span class="l">Oddíl '+("0"+sec.sort_order).slice(-2)+'</span>'+esc(sec.title)+' ›</button>';
    // Perex je upoutávka na kartu, v detailu se nekreslí (od 24. 11. 2026, Bob) — článek jede rovnou
    // textem, cvičení začíná „Než začneme“, oddíl svým obsahem.
    if(ADMIN.on) h+='<div class="mc-adm-detail">'+adminBar(store,d.id)+admPanel(admDetailTargets(store,item,sec,tab),false)+'</div>';

    if(hasTabs){
      h+='<div class="mc-tabbar">';
      tabs.forEach(function(t){ h+='<button class="mc-tab '+(tab===t.key?"active":"")+'" onclick="MC.detailTab(\''+t.key+'\')">'+t.label+(t.key!=="body"?'<span class="dot"></span>':'')+'</button>'; });
      h+='</div>';
    }
    var cur=tabs.filter(function(t){return t.key===tab;})[0];
    if(cur&&cur.key!=="body"){
      if(cur.practice) h+=renderPractice(cur.src,sec&&sec.diary_practice,title);
      else h+='<div class="mc-detail-body mc-md">'+md(stripDupHeading(cur.src,title))+'</div>';
    } else {
      if(isEx){
        // Box náročnosti: Trvání (jedna performance) · Praxe (frequency /
        // training_period) · Náročnost. Návrh local/_design/box_náročnosti.jpg.
        var lines=[item.duration?item.duration+" min":"",item.frequency,item.training_period].filter(Boolean);
        h+='<div class="mc-strip ex" style="--n:'+Math.max(2,lines.length)+'"><div class="s-ic">'+IC.clock+'</div><div class="s-rows">';
        lines.forEach(function(l){ h+='<div class="s-value">'+esc(l)+'</div>'; });
        h+='</div>';
        if(item.difficulty) h+='<span class="s-sep"></span><div class="s-diff"><div class="s-label">Náročnost</div>'+diffPill(item.difficulty)+'</div>';
        h+='</div>';
        // Box řetězu — jediný nosič návaznosti. Rozklik ukáže celý řetěz.
        if(item.chain_id && byChain[item.chain_id]){
          var ch=itemIndex.chains[item.chain_id], list=byChain[item.chain_id];
          h+='<div class="mc-box mc-chain '+(d.chainOpen?"open":"")+'"><button class="b-head" onclick="MC.detailChain()"><span class="b-num">'+item.chain_order+'/'+list.length+'</span><span class="b-text">Cvičení je součástí řetězu</span><span class="b-chev">'+IC.chevron+'</span></button>';
          if(d.chainOpen){
            h+='<div class="b-body"><div class="b-title">'+esc(ch?ch.title:"")+'</div><div class="b-hint">Cvičení na sebe navazují — doporučujeme začít od prvního.</div><ol class="b-list">';
            list.forEach(function(e){ h+='<li class="'+(e.id===item.id?"cur":"")+'"><button onclick="MC.detail(\'exercises\',\''+e.id+'\')">'+esc(e.name)+'</button></li>'; });
            h+='</ol></div>';
          }
          h+='</div>';
        }
        if(item.warning) h+='<div class="mc-box mc-warn"><span class="b-ic">'+IC.warn+'</span><span class="b-text">'+esc(item.warning)+'</span></div>';
      }
      var jr=isEx?{body:stripDupHeading(item.body,title),journal:null}:splitJournal(stripDupHeading(item.body,title));
      h+='<div class="mc-detail-body mc-md'+(isEx?" mc-steps":"")+'">'+md(jr.body)+'</div>';
      if(isEx&&item.attachments&&item.attachments.length){
        item.attachments.forEach(function(a){ h+='<div class="mc-attach"><div class="a-title">'+esc(a.title||"Příloha")+'</div><div class="mc-md">'+md(a.body||"")+'</div></div>'; });
      }
      // Deník cvičení žije v polích: oddílový (společný) + specifický, slepené.
      var diary=isEx?[sec&&sec.diary_exercise,item.diary_exercise].filter(Boolean).join("\n"):jr.journal;
      if(diary) h+=journalCard(diary);
      // Zkrácené články (`show_link: true`) nabídnou plné znění na blogu.
      // Odkaz staví renderer, ne markdown — parser odkazy neumí a do těl se
      // zásadně nepíšou. Podmínka na https:// je pojistka, ať se do href
      // nedostane nic jiného než webová adresa.
      if(item.show_link && /^https:\/\//.test(String(item.source_url||""))){
        h+='<div class="mc-source"><a href="'+esc(item.source_url)+'" target="_blank" rel="noopener noreferrer">'+
           IC.external+'Celý článek na blogu</a></div>';
      }
    }
    if(cfg.readable) markRead(d.id);
    return h;
  }

  // ===================== RENDER — Oblíbené =====================
  // ===================== RENDER — Moje oblíbené (24. 11. 2026) =====================
  // Dlaždice jako na homepage. Nahoře podbarvený pakl čtyř dlaždic s větami (karty):
  // Všechny karty (zamíchaný proud napříč) · Přerámování (triplet + hlášky + věty pod strachy)
  // · Otázky · Inspirace. Pod ním materiály: Cvičení · Články · Tělo · První pomoc → seznam
  // jako v sekci, jen uložené. „Jen nové“ tu není — uložené už člověk viděl.
  var FAV_SENT=["reframings","reframing_questions","reframing_actions","pains","situations","inspirations","questions"];
  var FAV_PACK=[
    { key:"all",          label:"Všechny karty", icon:"cards",        stores:FAV_SENT },
    { key:"reframing",    label:"Přerámování",   icon:"reframing",    stores:["reframings","reframing_questions","reframing_actions","pains","situations"] },
    { key:"questions",    label:"Otázky",        icon:"questions",    stores:["questions"] },
    { key:"inspirations", label:"Inspirace",     icon:"inspirations", stores:["inspirations"] }
  ];
  var FAV_MAT=[
    { key:"exercises", label:"Cvičení",          icon:"exercises", tone:"teal" },
    { key:"articles",  label:"Články",           icon:"articles",  tone:"teal" },
    { key:"body",      label:"Tělesné příznaky", icon:"body",      tone:"accent" },
    { key:"crisis",    label:"První pomoc",      icon:"crisis",    tone:"accent" }
  ];
  var FAV_RF_TABS={ reframings:["reframings","pains","situations"], questions_rf:["reframing_questions"], actions:["reframing_actions"] };
  var SWIPE_FAV=false, FAV_ENTRY={};
  function favDataKey(store){ for(var i=0;i<FAV_VIEW.length;i++){ if(FAV_VIEW[i].store===store) return FAV_VIEW[i].dataKey; } }
  // Uložené věty jako položky proudu: kopie s úložištěm (_st), nejnovější první v rámci typu.
  function favEntries(stores){
    var out=[];
    stores.forEach(function(st){
      var dk=favDataKey(st);
      alive(st,USER.favorites[st].slice().reverse().map(function(id){ return (itemIndex[dk]||{})[id]; }).filter(Boolean)).forEach(function(it){
        var e={ id:it.id, text:it.text||"", cluster_id:it.cluster_id, meta:it.meta, author:it.author, _st:st };
        FAV_ENTRY[it.id]=e; out.push(e);
      });
    });
    return out;
  }
  function favLabel(it,typed){
    var st=it._st, cl=clusterName[it.cluster_id]||"";
    if(st==="reframings") return cl;
    if(st==="reframing_questions") return typed?"Otázka · "+cl:cl;
    if(st==="reframing_actions") return typed?"Úkol · "+cl:cl;
    if(st==="pains") return cutText(it.meta||"",60);
    if(st==="situations") return it.meta||"";
    if(st==="inspirations") return it.author||"Inspirace";
    return typed?"Podnětná otázka":"";
  }
  function favTileHtml(t,n,tone,onclick){
    return '<button class="mc-tile mc-in'+(n?'':' empty')+'" data-tone="'+tone+'" '+(n?'onclick="'+onclick+'"':'disabled')+'><span class="mc-tile-ic">'+IC[t.icon]+'</span><span class="mc-tile-num">'+n+'</span><span class="mc-tile-name">'+esc(t.label)+'</span></button>';
  }
  function viewFavorites(){
    var h='<div class="mc-sec-head"><h1>Moje oblíbené</h1></div>';
    if(favCount()===0) return h+'<div class="mc-empty"><div class="e-ic">♡</div>Zatím tu nic není.<br>Klepněte na srdíčko u věty, která vás osloví, a najdete ji tady.</div>';
    var t=state.fav.tile;
    if(t){ for(var i=0;i<FAV_MAT.length;i++){ if(FAV_MAT[i].key===t) return favMaterial(FAV_MAT[i]); } return favCards(t); }
    h='<div class="mc-sec-head mc-fav-intro"><h1>Moje oblíbené</h1><p>Co vás oslovilo, máte tady po ruce. Vracejte se sem klidně denně, třeba v tramvaji nebo ve frontě. Co potkáváte často, usadí se vám v hlavě i v těle.</p></div>';
    h+='<div class="mc-fav-pack"><div class="mc-tiles">';
    FAV_PACK.forEach(function(p){ h+=favTileHtml(p,favCountOf(p.stores),"teal","MC.favTile('"+p.key+"')"); });
    h+='</div></div><div class="mc-tiles mc-fav-mat">';
    FAV_MAT.forEach(function(m){ h+=favTileHtml(m,USER.favorites[m.key].length,m.tone,"MC.favTile('"+m.key+"')"); });
    return h+'</div>';
  }
  function favCards(t){
    var p=FAV_PACK.filter(function(x){ return x.key===t; })[0]; if(!p) return '<div class="mc-empty">—</div>';
    var rf=t==="reframing", type=state.fav.type, stores=rf?FAV_RF_TABS[type]:p.stores;
    var key="fav:"+t+(rf?":"+type:""), entries=favEntries(stores);
    if(viewMode()==="swipe"){
      // Všechny karty: zamíchat při každém vstupu (snímek drží pořadí, dokud se proud nezmění).
      if(t==="all"&&state.swipe.key!==key) entries=shuffle(entries);
      // Odebrané srdíčko: karta zůstává až do dalšího vstupu, ať proud pod rukou neposkočí.
      if(state.swipe.key===key){ var have={}; entries.forEach(function(e){ have[e.id]=1; }); state.swipe.ids.forEach(function(id){ if(!have[id]&&FAV_ENTRY[id]) entries.push(FAV_ENTRY[id]); }); }
      var h='<div class="mc-folder">'+folderTabs(rf?TYPES:[],type,"favType",["favTile(null)","Oblíbené"]);
      if(!entries.length) h+='<div class="mc-empty">Nic tu není.</div>';
      else { SWIPE_FAV=true; h+=swipeView("fav",key,entries,function(it){ return esc(favLabel(it,t==="all")); },function(it){ return favLabel(it,true); }); SWIPE_FAV=false; }
      return h+'<div class="mc-sfoot"><span class="sp"></span><button class="mc-fbf" onclick="MC.fbCurrent()" aria-label="Napsat k téhle větě">'+FB_ICON+'</button></div></div>';

    var h2='<button class="mc-back" onclick="MC.favTile(null)">← Oblíbené</button>';
    h2+='<div class="mc-sec-head"><div class="mc-sec-row"><h1>'+esc(p.label)+'</h1>'+viewToggle()+'</div></div>';
    if(rf){ h2+='<div class="mc-submenu-triplet">'; TYPES.forEach(function(x){ h2+='<button class="'+(type===x.key?"active":"")+'" onclick="MC.favType(\''+x.key+'\')">'+x.label+'</button>'; }); h2+='</div>'; }
    var g=favGroups(stores);
    return h2+(g||'<div class="mc-empty">Nic tu není.</div>');
  }

  // Materiály: stejné karty / řádky jako v sekci, jen uložené (nejnovější první).
  function favMaterial(m){
    var cfg=CONTENT[m.key];
    var items=alive(cfg.store,USER.favorites[cfg.store].slice().reverse().map(function(id){ return (itemIndex[cfg.dataKey]||{})[id]; }).filter(Boolean));
    var h='<button class="mc-back" onclick="MC.favTile(null)">← Oblíbené</button><div class="mc-sec-head"><h1>'+esc(m.label)+'</h1></div>';
    if(!items.length) return h+'<div class="mc-empty">Nic tu není.</div>';

  function allSeen(){ return '<div class="mc-empty"><div class="e-ic">✓</div>Všechno z tohohle už jste viděli.<br><button class="mc-link" onclick="MC.onlyNew()">Zobrazit i viděné</button></div>'; }
  // Proud karet: horizontální scroll-snap bez knihovny. Seznam se snímkuje
  // (key) — při „jen nové" by karty jinak mizely pod rukama, jak se označují
  // za viděné. Každých SWIPE_BREAK karet měkký předěl „Stačí pro dnes?",
  // na konci závěr — appka sama nabízí odchod.
  var SWIPE_BREAK=10;
  // Vstup do proudu: při „jen nové" se viděné vyhazují, ale karty aktuálního
  // snímku (stejný key) zůstávají — jinak by mizely pod rukama. Pozor: ids se
  // smí konzultovat JEN když key sedí, jinak by starý snímek propustil úplně
  // všechno a oko by vypadalo nefunkčně (bug 16. 9. 2026).
  // „Jen nové“ se nastaví samo při každém vstupu do proudu (od 24. 11. 2026, Bob): zapnuto, když je tu
  // něco neviděného, jinak vypnuto — žádná slepá ulička „všechno viděno“. Ruční přepnutí platí do
  // odchodu z proudu (state.onDecided = klíč proudu, pro který už je rozhodnuto; render ho po odchodu maže).
  var STREAM_SEEN=false;
  function streamOnlyNew(store,key,all){
    STREAM_SEEN=true;
    if(state.onDecided===key) return;
    state.onDecided=key;
    var v=all.some(function(it){ return !isSeen(store,it.id); });
    if(v!==USER.onlyNew){ USER.onlyNew=v; saveUser(); }
  }
  function swipeItems(store,key,all){
    streamOnlyNew(store,key,all);
    if(!USER.onlyNew) return all;
    var keep=state.swipe.key===key?state.swipe.ids:[];
    return all.filter(function(it){ return !isSeen(store,it.id)||keep.indexOf(it.id)>-1; });
  }
  var FILL=false;
  function swipeView(store,key,items,meta,fbName,softCut,pre){
    FILL=true;
    var sw=state.swipe;
    if(sw.key!==key){ sw.key=key; sw.ids=(sw.shuffle?shuffle(items.slice()):items).map(function(it){ return it.id; }); sw.index=0; sw.shuffle=false; }
    var idx={}; items.forEach(function(it){ idx[it.id]=it; });
    var list=sw.ids.map(function(id){ return idx[id]; }).filter(Boolean);
    if(!list.length) return USER.onlyNew?allSeen():'<div class="mc-empty">Nic tu není.</div>';
    var h='<div class="mc-swipe-wrap"><div class="mc-swipe" id="mc-swipe" data-store="'+store+'">'+(pre||"");
    list.forEach(function(it,i){
      var size=it.text.length<90?"xl":it.text.length<180?"lg":it.text.length<320?"md":"sm";
      var st=it._st||store;   // smíšený proud (Oblíbené) nese úložiště u každé karty
      FB_ITEMS[it.id]={ store:st, text:it.text, name:fbName?fbName(it):(it.author||"") };
      // Triplet a bolístky (fbName, 24. 11. 2026): velké srdíčko v toku hned pod textem (pevná mezera,
      // na dosah palce), admin až pod ním; vlevo dole počítadlo, vpravo dole pocit / bolístka.
      // Otázky a Inspirace (od 24. 11. 2026) taky srdíčko pod textem, autor citátu pod citátem.
      var fm=fbName&&meta?meta(it):"", cnt='<span class="sc-foot-l"><span class="sc-count">'+(i+1)+' / '+list.length+'</span></span>';
      if(fbName){
        h+='<div class="mc-swipe-card" data-id="'+esc(it.id)+'"'+(it._st?' data-store="'+st+'"':'')+'><div class="sc-body">'+cnt+(fm?'<span class="sc-foot-r">'+fm+'</span>':'');
        h+=admText(st,it.id,it.text,"sc-text "+size)+'<div class="sc-heart">'+heartBtn(st,it.id,isFav(st,it.id))+'</div>'+adminBar(st,it.id)+'</div></div>';
      } else {
        var am=meta?meta(it):"";
        h+='<div class="mc-swipe-card" data-id="'+esc(it.id)+'"><div class="sc-body">'+cnt;
        h+=admText(store,it.id,it.text,"sc-text "+size)+(am?'<div class="sc-meta">'+am+'</div>':'')+'<div class="sc-heart">'+heartBtn(store,it.id,isFav(store,it.id))+'</div>'+adminBar(store,it.id)+'</div></div>';
      }
      if(softCut && i+1===softCut && i<list.length-1) h+=softBreakHtml(true);
      else if((i+1)%SWIPE_BREAK===0 && i<list.length-1) h+='<div class="mc-swipe-card break"><div class="sc-body"><div class="sc-text lg">Stačí pro dnes?</div><div class="sc-actions"><button class="mc-fab ghost" onclick="MC.swipeClose()">Zavřít</button><button class="mc-fab" onclick="MC.swipeNext()">Ještě pár</button></div></div></div>';
    });
    var nxt=SWIPE_NEXT;
    if(SWIPE_FAV){ h+='<div class="mc-swipe-card break end"><div class="sc-body"><div class="sc-text lg">To je všechno.</div><div class="sc-actions col"><div class="sc-act-row"><button class="mc-fab ghost" onclick="MC.swipeClose()">Zavřít</button></div></div></div></div>'; return h+'</div></div>'; }
    // Konec: při „Jen nové“ nabídnout zopakování (přepne na všechno, zamíchaně) — opakování je dobrá věc, ne prázdný stav.
    h+='<div class="mc-swipe-card break end"><div class="sc-body"><div class="sc-text lg">'+(USER.onlyNew?"Viděli jste všechno.":"To je všechno.")+'</div><div class="sc-actions col">'+
      (nxt?'<button class="mc-fab" onclick="MC.rfType(\''+nxt.key+'\')">Pokračovat na '+nxt.label+' ›</button>':'')+
      '<div class="sc-act-row"><button class="mc-fab ghost" onclick="MC.swipeClose()">Zavřít</button>'+(USER.onlyNew?'<button class="mc-fab '+(nxt?"ghost":"")+'" onclick="MC.swipeAgain()">Projít znovu</button>':'')+'</div></div></div></div>';
    return h+'</div></div>';
  }
  // Po překreslení: obnovit pozici a označovat viděné podle karty na obrazovce.
  function bindSwipe(){
    var el=document.getElementById("mc-swipe"); if(!el) return;
    var store=el.getAttribute("data-store"), cards=el.children;
    function w(){ return el.clientWidth||1; }
    function update(){
      var i=Math.round(el.scrollLeft/w()); if(i<0)i=0; if(i>=cards.length)i=cards.length-1;
      state.swipe.index=i;
      var c=cards[i];
      // Číslo u oka („jen nové“) se přepíše za živa — bez překreslení, aby karty neposkakovaly.
      if(c&&c.getAttribute("data-id")&&markSeen(c.getAttribute("data-store")||store,c.getAttribute("data-id"))){
        var fc=document.querySelector(".mc-newc")||document.querySelector(".mc-pill .fc"); if(fc) fc.textContent=Math.max(0,(parseInt(fc.textContent,10)||0)-1);
      }
      if(i>0){ try{ if(el.querySelector(".mc-swipe-card.tutor")) localStorage.setItem(TUTOR_KEY,"1"); }catch(e){} }
      // Druhá návodná karta: tlačítka Otázky / Úkoly nahoře pulzují, dokud je karta na obrazovce.
      var tb=document.querySelector(".mc-ftabs .mc-submenu-triplet"); if(tb) tb.classList.toggle("pulse",!!(c&&c.classList.contains("tutor2")));
      var sb=document.querySelector(".mc-sfoot .mc-switch"); if(sb) sb.classList.toggle("pulse",!!(c&&c.classList.contains("tutor3")));
    }
    el.scrollLeft=state.swipe.index*w();
    var t; el.addEventListener("scroll",function(){ clearTimeout(t); t=setTimeout(update,80); });
    update();
    // Výzva ke swipování: první karta krátce vykoukne doleva při KAŽDÉM vstupu do proudu karet
    // (od 25. 11. 2026, dřív jen do 3 návštěv) — i když je první kartou placka s čísly nebo návod.
    // Jednou za vstup, ne při každém překreslení (HINTED, maže se odchodem z karet).
    var hk=state.swipe.key;
    if(state.swipe.index===0&&cards.length>1&&!HINTED[hk]){ HINTED[hk]=1; el.classList.add("hint"); setTimeout(function(){ el.classList.remove("hint"); },1900); }
  }
  // HINTED = proudy, kde už kvrdlání v téhle návštěvě proběhlo; render ho maže, jakmile se z karet odejde.
  var HINTED={};
  function swipeStep(d){ var el=document.getElementById("mc-swipe"); if(el) el.scrollBy({left:d*el.clientWidth,behavior:"smooth"}); }

  }

  // ===================== ZÁLOHA UŽIVATELSKÝCH DAT =====================
  // Oblíbené, přečtené a nastavení žijí jen v localStorage tohoto prohlížeče.
  // Záloha = soubor mimo prohlížeč (sdílet do mailu / na Disk, jinak stáhnout).
  // Při vstupu jednou za BACKUP_DAYS pop-up, když je co zálohovat (aspoň 1 oblíbená).
  var BACKUP_KEY="mc_backup", BACKUP_DAYS=30;
  function loadBackup(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY))||{}; }catch(e){ return {}; } }
  function saveBackupInfo(b){ try{ localStorage.setItem(BACKUP_KEY,JSON.stringify(b)); }catch(e){} }
  function daysSince(iso){ return iso?Math.floor((Date.now()-new Date(iso).getTime())/864e5):null; }
  function backupJson(){
    var t=null,v=null; try{ t=localStorage.getItem(THEME_KEY); v=localStorage.getItem(VIEW_KEY); }catch(e){}
    return JSON.stringify({ app:"moje-cesta", v:1, exported:new Date().toISOString(), user:USER, theme:t, view:v });
  }
  function backupDone(){ var b=loadBackup(); b.last=new Date().toISOString(); b.snooze=null; saveBackupInfo(b); }
  function shouldNag(){
    if(!hasConsent()||favCount()<1) return false;
    var b=loadBackup(), d=daysSince(b.last||b.first);
    if(d==null||d<BACKUP_DAYS) return false;
    return !(b.snooze&&Date.now()<new Date(b.snooze).getTime());
  }
  function initBackup(){
    // Požádat prohlížeč, ať data appky nemaže sám, když dochází místo.
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
    var b=loadBackup(); if(!b.first){ b.first=new Date().toISOString(); saveBackupInfo(b); }
    state.nag=shouldNag();
  }
  function backupSave(){
    var name="moje-cesta-zaloha-"+today()+".json", json=backupJson();
    function fin(ok){ if(ok){ backupDone(); toast("Záloha uložena"); } render(); }
    function download(){
      try{ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); fin(true); }
      catch(e){ fin(false); }
    }
    try{
      var file=new File([json],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:"Záloha Moje cesta"}).then(function(){ fin(true); },function(err){ if(err&&err.name==="AbortError") fin(false); else download(); });
        return;
      }
    }catch(e){}
    download();
  }
  function backupRestore(){
    var inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json,text/plain";
    inp.onchange=function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        var d=null; try{ d=JSON.parse(rd.result); }catch(e){}
        if(!d||d.app!=="moje-cesta"||!d.user||!d.user.favorites){ toast("Tohle není záloha Moje cesta"); render(); return; }
        var dt=d.exported?new Date(d.exported):null;
        if(!window.confirm("Obnovit zálohu"+(dt?" z "+dt.getDate()+". "+(dt.getMonth()+1)+". "+dt.getFullYear():"")+"?\n\nOblíbené a přečtené v tomto telefonu se nahradí zálohou.")) return;
        try{ localStorage.setItem(STORE_KEY,JSON.stringify(d.user)); if(d.theme) localStorage.setItem(THEME_KEY,d.theme); if(d.view) localStorage.setItem(VIEW_KEY,d.view); }catch(e){}
        USER=loadUser(); applyTheme(); backupDone(); toast("Záloha obnovena"); render();
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  // ===================== OFFLINE (service worker) =====================
  // Appka přidaná na plochu musí jet bez signálu. SW precachuje obal i všech
  // 16 JSONů; data pak jedou network-first s fallbackem do cache.
  // Uvnitř Miowebu se registrace nepovede (jiný origin/scope) — nevadí,
  // catch to spolkne a appka jede jako dřív.
  function initSW(){
    if(!("serviceWorker" in navigator)) return;
    if(location.protocol!=="https:" && location.hostname!=="localhost" && location.hostname!=="127.0.0.1") return;
    try{
      navigator.serviceWorker.register("sw.js",{scope:"./",updateViaCache:"none"})
        .then(function(reg){ if(reg&&reg.update) reg.update(); })
        .catch(function(){});
    }catch(e){}
  }

  // ===================== GESTO ZPĚT (Android, šipka prohlížeče) =====================
  // Od 25. 11. 2026: gesto zpět dělá totéž co nejbližší „Zpět“ v appce — nejdřív zavře vrstvu
  // (menu, filtr, okno se zálohou, úpravu v adminu), pak vede po stejných cílech jako tlačítka
  // ← Zpět na obrazovce. Jen z domovské obrazovky odchází z appky. Princip: dokud je kam se
  // vracet, drží appka v historii prohlížeče jeden „strážní“ krok; gesto ho spotřebuje a appka
  // místo opuštění stránky udělá backTarget(). Uvnitř Miowebu to funguje stejně (stejná URL).
  function backTarget(){
    if(state.menuOpen) return function(){ MC.menu(false); };
    if(!state.detail&&state.page==="section"&&CONTENT[state.section]&&state.sec[state.section]&&state.sec[state.section].filterOpen) return function(){ MC.filterShow(state.section); };
    if(state.adminEdit) return function(){ MC.admEditClose(); };
    if(state.nag) return function(){ state.nag=false; render(); };
    if(state.detail) return function(){ MC.detailBack(); };
    if(state.page==="favorites") return state.fav.tile?function(){ MC.favTile(null); }:function(){ MC.home(); };
    if(state.page==="admin"||state.page==="settings") return function(){ MC.home(); };
    if(state.page==="section"){
      if(state.section==="reframing"){
        var v=state.rf.view;
        if(v==="detail") return function(){ MC.rfBack(); };
        if(v==="fearGroup") return function(){ MC.rfGate("fears"); };
        if(v==="situation") return function(){ MC.rfSitBack(); };
        if(v==="pain") return function(){ MC.rfGate("pains"); };
        if(v==="feelings"||v==="fears"||v==="pains") return function(){ MC.rfGate(null); };
      }
      if(state.section==="journey"&&state.journey.sectionId) return function(){ MC.journeyBack(); };
      return function(){ MC.home(); };
    }
    return null;   // domovská obrazovka (a souhlas) → gesto opouští appku
  }
  var BACK_SKIP=false;
  function syncBack(){
    try{
      var hs=history.state, guard=!!(hs&&hs.mcGuard);
      if(backTarget()&&hasConsent()){ if(!guard) history.pushState({mcGuard:1},""); }
      // Doma zbytečný strážný krok uklidit, ať gesto odchází hned napoprvé.
      else if(guard){ BACK_SKIP=true; history.back(); }
    }catch(e){}
  }
  function initBack(){
    try{ if(!(history.state&&history.state.mcGuard)) history.replaceState({mcBase:1},""); }catch(e){}
    window.addEventListener("popstate",function(){
      if(BACK_SKIP){ BACK_SKIP=false; return; }
      var t=backTarget();
      if(t) t(); else syncBack();
    });
  }
